<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-gray-900">{{ data.title }}</h2>
    <button 
      (click)="onClose()" 
      class="text-gray-400 hover:text-gray-600 transition-colors">
      <ng-icon name="heroXMark" class="w-6 h-6"></ng-icon>
    </button>
  </div>

  <div class="space-y-4">
    <div *ngFor="let item of data.history; let i = index" 
         class="border border-gray-200 rounded-lg p-4 bg-gray-50">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
            <ng-icon name="heroXCircle" class="w-4 h-4 text-red-600"></ng-icon>
          </div>
          <div>
            <p class="font-medium text-gray-900">Rejection #{{ i + 1 }}</p>
            <p class="text-sm text-gray-500">{{ formatDate(item.rejectedAt) }}</p>
          </div>
        </div>
        <div class="text-right">
          <p class="text-sm font-medium text-gray-700">Rejected By</p>
          <p class="text-sm text-gray-900">{{ item.rejectedBy.firstName }} {{ item.rejectedBy.lastName }}</p>
        </div>
      </div>
      
      <div>
        <label class="text-sm font-medium text-gray-700">Reason:</label>
        <p class="text-sm text-gray-900 bg-white p-2 rounded border">{{ item.comment }}</p>
      </div>
    </div>

    <div *ngIf="data.history.length === 0" 
         class="text-center py-8 text-gray-500">
      <ng-icon name="heroDocumentText" class="w-12 h-12 mx-auto mb-2 text-gray-300"></ng-icon>
      <p>No status history available</p>
    </div>
  </div>

  <div class="flex justify-end mt-6 pt-4 border-t">
    <app-btn theme="secondary" (click)="onClose()">
      Close
    </app-btn>
  </div>
</div>
