<app-modal-layout
    title="Comment"
    subtitle="Comment history."
    [onClose]="onClose.bind(this)"
    [footerButtons]="footerButtons"
    contentMaxHeight="70vh">
    <div class="px-6 py-5 space-y-4">
        <div class="rounded-lg bg-gray-100 p-4 dark:bg-white/5" *ngIf="data.comment">
            <p class="text-gray-700 dark:text-gray-300">{{ data.comment }}</p>
        </div>
        <div *ngIf="data.revisionComment?.length">
            <h3 class="text-md font-semibold text-gray-900 dark:text-gray-100">Revision Comment</h3>
            <div class="mt-2 rounded-lg bg-gray-100 p-4 dark:bg-white/5" *ngFor="let comment of data.revisionComment; let i = index">
                <p class="text-gray-700 dark:text-gray-300">Revision {{ i + 1 }}: {{ comment }}</p>
            </div>
        </div>
        <div class="rounded-lg bg-gray-100 p-4 dark:bg-white/5" *ngIf="data.feedbackComment">
            <h3 class="text-md font-semibold text-gray-900 dark:text-gray-100">Feedback Request</h3>
            <p class="text-gray-700 dark:text-gray-300">{{ data.feedbackComment }}</p>
        </div>
    </div>
</app-modal-layout>
