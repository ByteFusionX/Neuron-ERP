<!-- Top bar: breadcrumb + actions -->
<div class="shrink-0 flex items-center justify-between gap-3 h-12 px-4 border-b border-gray-100 dark:border-erp-border-dark">
  <nav class="flex items-center gap-1.5 min-w-0 text-sm" aria-label="Breadcrumb">
    <ng-container *ngFor="let b of breadcrumb">
      <span class="text-gray-500 dark:text-gray-500 truncate">{{ b }}</span>
      <span class="text-gray-300 dark:text-gray-600">/</span>
    </ng-container>
    <span class="font-medium text-gray-900 dark:text-gray-100 truncate">{{ subtitle || title }}</span>
  </nav>
  <div class="flex items-center gap-1 shrink-0">
    <ng-content select="[panelActions]"></ng-content>
    <button type="button" (click)="close()" aria-label="Close details" class="dp-icon-btn">
      <app-dp-icon name="close"></app-dp-icon>
    </button>
  </div>
</div>

<div class="flex-1 min-h-0 overflow-y-auto">
  <!-- Header: reference, title, status -->
  <div class="px-5 pt-4 pb-4">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <p *ngIf="subtitle" class="text-xs font-medium text-gray-500 dark:text-gray-500 tabular-nums">{{ subtitle }}</p>
        <h2 class="mt-0.5 text-base font-semibold text-gray-900 dark:text-gray-100 leading-snug break-words">{{ title }}</h2>
        <ng-content select="[panelSubtitle]"></ng-content>
      </div>
      <div class="shrink-0"><ng-content select="[panelAside]"></ng-content></div>
    </div>

    <!-- Key facts strip -->
    <div class="dp-meta empty:hidden"><ng-content select="[panelMeta]"></ng-content></div>
  </div>

  <!-- Tabs (sticky while the body scrolls) -->
  <nav *ngIf="tabs.length" role="tablist"
    class="sticky top-0 z-10 bg-white dark:bg-erp-surface-dark flex flex-wrap gap-x-5 gap-y-1 px-5 border-b border-gray-100 dark:border-erp-border-dark">
    <button *ngFor="let t of tabs" type="button" role="tab" (click)="selectTab(t.id)"
      [attr.aria-selected]="activeTab === t.id"
      class="flex items-center gap-1.5 py-2.5 text-sm whitespace-nowrap border-b-2 -mb-px transition-colors"
      [ngClass]="activeTab === t.id ? 'border-violet-600 text-gray-900 dark:text-gray-100 font-medium' : 'border-transparent text-gray-500 dark:text-gray-500 hover:text-gray-800 dark:hover:text-gray-200'">
      <app-dp-icon *ngIf="t.icon" [name]="t.icon" size="w-3.5 h-3.5"></app-dp-icon>
      {{ t.label }}
    </button>
  </nav>

  <div class="p-5" role="tabpanel">
    <ng-content></ng-content>
  </div>
</div>

<!-- Footer actions -->
<div class="dp-footer empty:hidden"><ng-content select="[panelFooter]"></ng-content></div>
