<div class="bg-white rounded-lg overflow-hidden w-full">

    <!-- Header -->
    <div class="border-b px-6 py-4 flex justify-between items-center bg-white">
        <div>
            <h2 class="text-base font-semibold text-gray-900">Open Events</h2>
            <p class="text-xs text-gray-500 mt-0.5">Events linked to this record</p>
        </div>
        <div class="flex items-center gap-2">
            <button *ngIf="!isReassigned" type="button"
                class="bg-orange-500 hover:bg-orange-400 text-white font-medium py-1.5 px-3 rounded-lg text-sm flex items-center gap-1"
                (click)="onNewEventClicks()">
                <ng-icon name="heroPlus" class="text-sm"></ng-icon>
                New Event
            </button>
            <button type="button"
                class="bg-gray-100 hover:bg-gray-200 rounded-lg p-1 flex items-center justify-center text-gray-600"
                (click)="onClose()">
                <ng-icon name="heroXMark" class="text-md p-0 m-0"></ng-icon>
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="px-6 py-4 max-h-[65vh] overflow-y-auto">
        <ng-container *ngIf="events$ | async as events">
            <ol *ngIf="events.length; else noEvent" class="relative ml-1 border-l border-gray-200">
                <li class="relative pb-5 pl-5 last:pb-0" *ngFor="let event of events">
                    <span class="absolute -left-[5px] top-1.5 h-2.5 w-2.5 rounded-full bg-white ring-2 ring-violet-500"></span>

                    <div class="w-full flex items-start justify-between gap-2">
                        <p class="text-[13px] font-medium text-gray-900 flex items-center gap-1.5">
                            <ng-icon name="heroCalendarDays" class="text-violet-500"></ng-icon>
                            {{event.event}}
                        </p>
                        <div class="flex items-center gap-1 shrink-0">
                            <input type="checkbox" class="size-4 border border-violet-500"
                                [disabled]="event.status === 'completed'"
                                (click)="onCheckboxClick($event, event._id)"
                                [checked]="event.status === 'completed'">
                            <button *ngIf="event.createdBy && isCreatedEmployee(event.createdBy._id || event.createdBy)"
                                type="button" class="text-red-600 hover:text-red-800 px-1" matTooltip="Delete Event"
                                matTooltipPosition="above" (click)="onDeleteEvent(event._id)">
                                <ng-icon name="heroTrash" class="text-sm"></ng-icon>
                            </button>
                        </div>
                    </div>

                    <p class="text-xs text-gray-500 mt-0.5">{{event.summary}}</p>
                    <p class="text-xs text-gray-400 mt-0.5">{{formatDate(event.date)}}</p>

                    <div *ngIf="event.eventFiles && event.eventFiles.length" class="mt-2 space-y-1">
                        <div *ngFor="let file of event.eventFiles" class="flex items-center gap-1">
                            <button type="button"
                                class="flex items-center gap-1 text-violet-600 hover:text-violet-800 text-xs underline"
                                matTooltip="Preview File" matTooltipPosition="above"
                                (click)="onPreviewFile(file.fileName)">
                                <ng-icon name="heroEye" class="text-sm"></ng-icon>
                                {{file.originalname}}
                            </button>
                            <button
                                *ngIf="event.createdBy && isCreatedEmployee(event.createdBy._id || event.createdBy)"
                                type="button" class="text-red-600 hover:text-red-800" matTooltip="Delete File"
                                matTooltipPosition="above" (click)="onDeleteFile(event, file.fileName)">
                                <ng-icon name="heroTrash" class="text-xs"></ng-icon>
                            </button>
                        </div>
                    </div>
                </li>
            </ol>
        </ng-container>

        <ng-template #noEvent>
            <div class="flex flex-col items-center justify-center text-center py-10">
                <span
                    class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-3">
                    <ng-icon name="heroCalendarDays" class="text-xl"></ng-icon>
                </span>
                <p class="text-sm font-medium text-gray-700">No events yet</p>
                <p class="text-xs text-gray-500 mt-1">
                    {{ isReassigned ? 'No events have been added to this record.' : 'Use “New Event” to add the first
                    one.' }}
                </p>
            </div>
        </ng-template>
    </div>

</div>
