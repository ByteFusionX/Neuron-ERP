<app-modal-layout
  title="Reject Delivered Items"
  subtitle="Select the items the customer rejected, the quantity, and a reason"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="footerButtons">
  <div class="p-4">
    <table class="w-full text-sm text-left border mb-4">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50">
        <tr>
          <th class="px-3 py-2 border text-center"></th>
          <th class="px-3 py-2 border text-center">Part No.</th>
          <th class="px-3 py-2 border text-center">Description</th>
          <th class="px-3 py-2 border text-center">Delivered Qty</th>
          <th class="px-3 py-2 border text-center">Rejected Qty</th>
          <th class="px-3 py-2 border text-center">Reason</th>
        </tr>
      </thead>
      <tbody>
        @for(row of rows; track row.itemId) {
          <tr class="border-b">
            <td class="px-3 py-2 border text-center">
              <input type="checkbox" [(ngModel)]="row.selected" />
            </td>
            <td class="px-3 py-2 border text-center">{{ row.partNo || '-' }}</td>
            <td class="px-3 py-2 border">{{ row.description || '-' }}</td>
            <td class="px-3 py-2 border text-center">{{ maxRejectable(row) }}</td>
            <td class="px-3 py-2 border text-center">
              <input type="number" [(ngModel)]="row.rejectedQty" [disabled]="!row.selected"
                min="0" [max]="maxRejectable(row)"
                class="w-20 border rounded px-2 py-1 text-center"
                [class.border-orange-500]="touched && row.selected && !isRowValid(row)" />
            </td>
            <td class="px-3 py-2 border">
              <input type="text" [(ngModel)]="row.reason" [disabled]="!row.selected"
                placeholder="Reason"
                class="w-full border rounded px-2 py-1"
                [class.border-orange-500]="touched && row.selected && !row.reason.trim()" />
            </td>
          </tr>
        }
      </tbody>
    </table>

    <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
      Overall Rejection Reason
    </label>
    <textarea
      [(ngModel)]="overallReason"
      placeholder="Enter the overall reason for this rejection"
      rows="3"
      class="appearance-none block w-full bg-gray-100 text-gray-700 border rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white"
      [class.border-orange-500]="touched && !overallReason.trim()">
    </textarea>
    @if(touched && !overallReason.trim()) {
      <span class="text-xs text-red-600">Overall reason is required</span>
    }
  </div>
</app-modal-layout>
