<app-modal-layout
  title="Previous Job Items"
  subtitle="Select items from previous in-progress or completed jobs to add to this quote"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="footerButtons"
>
  <div class="p-4">
    <table class="w-full text-sm text-left border mb-4">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50">
        <tr>
          <th class="px-3 py-2 border text-center">
            <input
              type="checkbox"
              [checked]="allSelected"
              [indeterminate]="someSelected"
              (change)="toggleSelectAll($any($event.target).checked)"
            />
          </th>
          <th class="px-3 py-2 border text-center">Job ID</th>
          <th class="px-3 py-2 border text-center">Item Name</th>
          <th class="px-3 py-2 border">Item Details</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.jobId + row.itemName + $index) {
          <tr class="border-b">
            <td class="px-3 py-2 border text-center">
              <input type="checkbox" [(ngModel)]="row.selected" />
            </td>
            <td class="px-3 py-2 border text-center whitespace-nowrap">{{ row.jobId }}</td>
            <td class="px-3 py-2 border font-medium uppercase">{{ row.itemName }}</td>
            <td class="px-3 py-2 border">
              <ul class="list-disc pl-4">
                @for (detail of row.itemDetails; track $index) {
                  <li>
                    {{ detail.detail }}
                    <span class="text-gray-500">(Qty: {{ detail.quantity }})</span>
                  </li>
                }
              </ul>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-3 py-4 border text-center text-gray-500">
              No items found.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</app-modal-layout>
