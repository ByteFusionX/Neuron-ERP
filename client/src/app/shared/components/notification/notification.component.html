<div role="dialog" aria-label="Notifications"
  class="flex max-h-[min(560px,calc(100vh-5rem))] w-[min(400px,calc(100vw-1.5rem))] flex-col overflow-hidden rounded-xl border border-erp-border bg-erp-surface shadow-xl dark:border-erp-border-dark dark:bg-erp-surface-dark"
  *ngIf="sections$ | async as s">

  <!-- Header -->
  <header class="flex items-center gap-2 border-b border-gray-100 px-4 py-3 dark:border-erp-border-dark">
    <h2 class="text-sm font-semibold text-gray-900 dark:text-gray-100">Notifications</h2>
    <span *ngIf="s.unreadCount" class="rounded-full bg-violet-600 px-1.5 text-[10px] font-semibold leading-4 text-white">{{ s.unreadCount }} new</span>
    <app-action-menu class="ms-auto" label="Notification settings" icon="heroCog6Tooth" [items]="menuItems(s.unreadCount, (pushSubscribed$ | async) ?? false)"
      (selected)="onMenu($event)"></app-action-menu>
  </header>

  <div class="border-b border-gray-100 px-4 py-2 dark:border-erp-border-dark">
    <app-detail-filter-chips [options]="tabs" [value]="activeTab" (valueChange)="activeTab = $any($event)"></app-detail-filter-chips>
  </div>

  <!-- List -->
  <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
    <ng-container *ngFor="let section of (activeTab === 'All' ? s.all : s.unread)">
      <p class="sticky top-0 z-10 bg-erp-surface/95 px-4 pb-1 pt-3 text-[11px] font-semibold uppercase tracking-wide backdrop-blur dark:bg-erp-surface-dark/95"
        [ngClass]="section.label === 'Needs action' ? warnText : 'text-gray-400 dark:text-gray-500'">
        {{ section.label }}
      </p>

      <div *ngFor="let n of section.items; trackBy: trackById" role="button" tabindex="0"
        (click)="open(n)" (keydown.enter)="open(n)"
        class="group relative flex cursor-pointer gap-3 border-b border-gray-100 px-4 py-3 transition hover:bg-gray-50 focus:outline-none focus-visible:bg-gray-50 dark:border-erp-border-dark dark:hover:bg-gray-800/60 dark:focus-visible:bg-gray-800/60">

        <!-- Avatar with type badge -->
        <div class="relative mt-0.5 h-7 w-7 shrink-0">
          <app-detail-avatar *ngIf="initials(n); else sysAvatar" [text]="initials(n)" size="sm"></app-detail-avatar>
          <ng-template #sysAvatar>
            <span class="grid h-7 w-7 place-content-center rounded-full bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400">
              <ng-icon [name]="meta(n.type).icon" class="text-sm"></ng-icon>
            </span>
          </ng-template>
          <span *ngIf="initials(n)" class="absolute -bottom-1 -right-1 grid h-3.5 w-3.5 place-content-center rounded-full text-white ring-2 ring-erp-surface dark:ring-erp-surface-dark"
            [ngClass]="dotClass(meta(n.type).tone)">
            <ng-icon [name]="meta(n.type).icon" class="text-[8px]"></ng-icon>
          </span>
        </div>

        <!-- Body -->
        <div class="min-w-0 flex-1 pe-6">
          <p class="truncate text-xs text-gray-500 dark:text-gray-400">
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ actor(n) }}</span>
            · {{ n.date | relativeTime }}
          </p>
          <p class="line-clamp-1 text-[13px] text-gray-900 dark:text-gray-100" [class.font-semibold]="n.isUnread">{{ n.title }}</p>
          <p *ngIf="n.message" class="mt-0.5 line-clamp-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400">{{ n.message }}</p>

          <div *ngIf="eventDate(n) || readableEnquiryId(n)" class="mt-1.5 flex flex-wrap items-center gap-1.5">
            <app-detail-badge *ngIf="eventDate(n)" tone="info" [label]="(eventDate(n) | date: 'EEE, d MMM · h:mm a') ?? ''"></app-detail-badge>
            <app-detail-badge *ngIf="readableEnquiryId(n)" tone="neutral" [label]="readableEnquiryId(n) ?? ''"></app-detail-badge>
          </div>
        </div>

        <!-- Unread dot / hover actions -->
        <span *ngIf="n.isUnread" class="absolute right-4 top-4 h-2 w-2 rounded-full bg-violet-600 group-hover:hidden group-focus-within:hidden" aria-label="Unread"></span>
        <div class="absolute right-2 top-2 hidden items-center rounded-lg border border-erp-border bg-erp-surface shadow-sm group-hover:flex group-focus-within:flex dark:border-erp-border-dark dark:bg-erp-surface-dark">
          <app-dp-icon-button [icon]="n.isUnread ? 'check' : 'mail'" [label]="n.isUnread ? 'Mark as read' : 'Mark as unread'"
            size="w-3.5 h-3.5" (click)="toggleRead(n, $event)"></app-dp-icon-button>
          <app-dp-icon-button icon="close" label="Dismiss" size="w-3.5 h-3.5" (click)="dismiss(n, $event)"></app-dp-icon-button>
        </div>
      </div>
    </ng-container>

    <!-- Empty state -->
    <div *ngIf="!(activeTab === 'All' ? s.all : s.unread).length" class="px-6 py-10 text-center">
      <ng-icon name="heroInbox" class="text-2xl text-gray-300"></ng-icon>
      <p class="mt-2 text-xs font-medium text-gray-700 dark:text-gray-300">You're all caught up</p>
      <p class="mt-0.5 text-xs text-gray-500">
        {{ activeTab === 'Unread' ? 'No unread notifications.' : 'New notifications will show up here.' }}
      </p>
    </div>
  </div>
</div>
