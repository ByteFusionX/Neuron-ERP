<!-- Vertical -->
<ol *ngIf="orientation === 'vertical'" class="m-0 list-none space-y-0 p-0">
    <li *ngFor="let stage of stages; let last = last" class="flex items-stretch gap-2.5">
        <div class="flex flex-col items-center">
            <span class="relative flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold ring-4"
                [ngClass]="[variantClasses[stage.variant], stage.variant === 'stage' ? 'bg-violet-600' : '']">
                <span *ngIf="stage.icon" class="material-icons text-[16px]">{{ stage.icon }}</span>
                <ng-container *ngIf="!stage.icon">{{ stage.initials }}</ng-container>
                <span *ngIf="stage.stepNumber as num" class="absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full bg-white text-[9px] font-bold text-violet-700 ring-1 ring-violet-200 dark:bg-gray-900 dark:text-violet-300 dark:ring-violet-500/40">{{ num }}</span>
            </span>
            <span *ngIf="!last" class="my-1 w-0.5 flex-1 rounded bg-gray-200 dark:bg-gray-700"></span>
        </div>
        <div class="min-w-0 flex-1" [ngClass]="last ? 'pt-1' : 'pb-3 pt-1'">
            <p class="truncate text-sm font-medium" [ngClass]="isMuted(stage) ? 'text-gray-500 dark:text-gray-400' : 'text-gray-900 dark:text-gray-100'" [title]="stage.title">{{ stage.title }}</p>
            <p *ngIf="stage.subtitle" class="text-xs text-gray-500 dark:text-gray-400">{{ stage.subtitle }}</p>
        </div>
    </li>
</ol>

<!-- Horizontal -->
<div *ngIf="orientation === 'horizontal'" class="flex items-start overflow-x-auto pb-1">
    <ng-container *ngFor="let stage of stages; let last = last">
        <div class="flex min-w-[88px] max-w-[140px] flex-col items-center text-center">
            <span class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xs font-semibold ring-4"
                [ngClass]="[variantClasses[stage.variant], stage.variant === 'stage' ? 'bg-violet-600' : '']">
                <span *ngIf="stage.icon" class="material-icons text-[16px]">{{ stage.icon }}</span>
                <ng-container *ngIf="!stage.icon">{{ stage.initials }}</ng-container>
                <span *ngIf="stage.stepNumber as num" class="absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full bg-white text-[9px] font-bold text-violet-700 ring-1 ring-violet-200 dark:bg-gray-900 dark:text-violet-300 dark:ring-violet-500/40">{{ num }}</span>
            </span>
            <p class="mt-1.5 w-full truncate text-xs font-medium" [ngClass]="isMuted(stage) ? 'text-gray-500 dark:text-gray-400' : 'text-gray-900 dark:text-gray-100'" [title]="stage.title">{{ stage.title }}</p>
            <p *ngIf="stage.subtitle" class="w-full truncate text-[10px] text-gray-500 dark:text-gray-400" [title]="stage.subtitle">{{ stage.subtitle }}</p>
        </div>
        <span *ngIf="!last" class="mt-[18px] h-0.5 w-6 shrink-0 rounded bg-gray-200 dark:bg-gray-700 sm:w-10"></span>
    </ng-container>
</div>

<div *ngIf="rejectionNote" class="mt-3 flex items-center gap-2 rounded-lg bg-red-50/70 px-3 py-1.5 text-xs text-red-700 dark:bg-red-500/10 dark:text-red-300">
    <span class="material-icons text-[14px]">block</span>
    {{ rejectionNote }}
</div>
