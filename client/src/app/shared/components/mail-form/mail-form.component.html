<app-modal-layout
  [title]="data.mailData ? 'Edit Mail' : 'Compose Mail'"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="getFooterButtons()"
  contentClass="py-6 px-6">
  <form [formGroup]="mailForm">
      
      <!-- To Field -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold">
            To <span class="text-red-500">*</span>
          </label>
          <button 
            type="button" 
            (click)="toggleCC()" 
            class="text-sm text-violet-700 hover:text-violet-600">
            {{showCC() ? 'Hide CC' : 'Add CC'}}
          </button>
        </div>
        <app-email-tag-input
          placeholder="Enter recipient emails..."
          [isSubmitted]="isSubmitted()"
          formControlName="to">
        </app-email-tag-input>
        @if(f['to'].invalid && isSubmitted()) {
          <div class="text-red-700 text-sm mt-1">
            At least one recipient is required
          </div>
        }
      </div>

      <!-- CC Field (Conditional) -->
      @if(showCC()) {
        <div class="mb-6">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
            CC
          </label>
          <app-email-tag-input
            placeholder="Enter CC emails..."
            [isSubmitted]="isSubmitted()"
            formControlName="cc">
          </app-email-tag-input>
        </div>
      }

      <!-- Subject Field -->
      <app-form-field 
        label="Subject" 
        [control]="f['subject']" 
        [isSubmitted]="isSubmitted()"
        placeholder="Enter email subject">
      </app-form-field>

     

      <!-- Message Field -->
      <div class="mb-6">
        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="message">
          Message <span class="text-red-500">*</span>
        </label>
        <textarea 
          id="message"
          placeholder="Enter your message..."
          [class.border-orange-500]="f['message'].invalid && isSubmitted()" 
          class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500 min-h-48 resize-y"
          formControlName="message">
        </textarea>
        @if(f['message'].invalid && isSubmitted()) {
          <div class="text-red-700 text-sm mt-1">
            Message is required
          </div>
        }
      </div>

       <!-- Attachments -->
       <div class="mb-6">

        <app-upload-file 
          (fileUpload)="onFileUpload($event)"
          [isPadding]="false"
          [selectedFiles]="selectedFiles">
        </app-upload-file>
      </div>

    </form>
</app-modal-layout>
