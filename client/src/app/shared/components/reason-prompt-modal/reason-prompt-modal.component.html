<app-modal-layout
  [title]="data.title"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="footerButtons">
  <div class="p-4">
    <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
      {{ data.label || 'Reason' }}
    </label>
    <textarea
      [(ngModel)]="reason"
      [placeholder]="data.placeholder || 'Enter reason'"
      rows="4"
      class="appearance-none block w-full bg-gray-100 text-gray-700 border rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white"
      [class.border-red-500]="touched && !reason.trim()"
      [class.border-gray-200]="!(touched && !reason.trim())">
    </textarea>
    @if(touched && !reason.trim()) {
      <span class="text-xs text-red-600">Reason is required</span>
    }
  </div>
</app-modal-layout>
