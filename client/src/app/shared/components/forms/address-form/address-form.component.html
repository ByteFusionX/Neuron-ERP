<div [formGroup]="addressForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Street No</label>
      <input 
        formControlName="streetNo"
        class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
        [class.border-orange-500]="addressForm.get('streetNo')?.invalid && addressForm.get('streetNo')?.touched"
        type="text" 
        placeholder="Street Number">
      <div class="text-red-600 text-xs mt-1" *ngIf="addressForm.get('streetNo')?.invalid && addressForm.get('streetNo')?.touched">
        Street number is required
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Zone No</label>
      <input 
        formControlName="zoneNo"
        class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
        [class.border-orange-500]="addressForm.get('zoneNo')?.invalid && addressForm.get('zoneNo')?.touched"
        type="text" 
        placeholder="Zone Number">
      <div class="text-red-600 text-xs mt-1" *ngIf="addressForm.get('zoneNo')?.invalid && addressForm.get('zoneNo')?.touched">
        Zone number is required
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Building No</label>
      <input 
        formControlName="buildingNo"
        class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
        [class.border-orange-500]="addressForm.get('buildingNo')?.invalid && addressForm.get('buildingNo')?.touched"
        type="text" 
        placeholder="Building Number">
      <div class="text-red-600 text-xs mt-1" *ngIf="addressForm.get('buildingNo')?.invalid && addressForm.get('buildingNo')?.touched">
        Building number is required
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">PO Box</label>
      <input 
        formControlName="poBox"
        class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
        type="text" 
        placeholder="PO Box (Optional)">
    </div>
    
    <div class="mb-4 md:col-span-2">
      <label class="block text-sm font-medium text-gray-700">Location</label>
      <input 
        formControlName="location"
        class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
        [class.border-orange-500]="addressForm.get('location')?.invalid && addressForm.get('location')?.touched"
        type="text" 
        placeholder="Location">
      <div class="text-red-600 text-xs mt-1" *ngIf="addressForm.get('location')?.invalid && addressForm.get('location')?.touched">
        Location is required
      </div>
    </div>
  </div>
