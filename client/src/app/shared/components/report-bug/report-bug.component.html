<app-form-modal-shell
  icon="info"
  tone="rose"
  title="Report a bug"
  contextEmptyText="Describe the problem and attach anything that helps us reproduce it."
  formId="bug-report-form"
  [invalid]="reportForm.invalid && reportForm.touched"
  invalidText="Describe what went wrong before submitting"
  submitLabel="Submit report"
  savingLabel="Submitting..."
  submitIcon="check"
  submitShortcutVerb="submit"
  [saving]="isSubmitting || isInitializing"
  (closed)="onCancel()"
>
  <div *ngIf="isInitializing" class="animate-pulse space-y-4" aria-label="Preparing bug report">
    <div>
      <div class="h-3.5 w-32 bg-gray-200 rounded mb-2"></div>
      <div class="h-20 w-full bg-gray-200 rounded-md"></div>
    </div>
    <div>
      <div class="h-3.5 w-24 bg-gray-200 rounded mb-2"></div>
      <div class="h-9 w-full bg-gray-200 rounded-md"></div>
    </div>
    <div>
      <div class="h-3.5 w-24 bg-gray-200 rounded mb-2"></div>
      <div class="flex gap-3">
        <div class="w-24 h-24 bg-gray-200 rounded-md"></div>
        <div class="w-24 h-24 bg-gray-200 rounded-md"></div>
      </div>
    </div>
    <div class="h-10 w-full bg-gray-200 rounded-md"></div>
  </div>

  <form id="bug-report-form" [formGroup]="reportForm" (ngSubmit)="onSubmit()" *ngIf="!isInitializing" novalidate>
    <div class="space-y-5">
      <app-sf-section title="Report details" columns="1">
        <app-sf-field label="What went wrong?" [control]="reportForm.controls['description']"
          [messages]="{ required: 'A description is required' }">
          <app-sf-textarea formControlName="description" [rows]="5" autoresize
            placeholder="Describe what you were doing, what you expected, and what happened..."></app-sf-textarea>
        </app-sf-field>
      </app-sf-section>

      <app-sf-section title="Evidence" columns="1">
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-gray-700 dark:text-gray-300">Screenshots</span>
          <button
            type="button"
            (click)="onAddScreenshot()"
            [disabled]="isCapturing"
            class="text-xs font-medium text-violet-700 transition hover:text-violet-800 disabled:opacity-50 dark:text-violet-400"
          >
            {{ isCapturing ? 'Capturing...' : '+ Add another screenshot' }}
          </button>
        </div>

        <div class="flex flex-wrap gap-3">
          <div *ngFor="let shot of screenshots" class="relative h-24 w-24 overflow-hidden rounded-lg border border-gray-200 dark:border-erp-border-dark">
            <img [src]="shot.dataUrl" class="h-full w-full object-cover" alt="Attached bug screenshot" />
            <button
              type="button"
              (click)="onRemoveScreenshot(shot.id)"
              class="absolute right-1 top-1 grid h-6 w-6 place-content-center rounded-md bg-black/65 text-sm text-white transition hover:bg-black/85 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-white"
              aria-label="Remove screenshot"
              title="Remove screenshot"
            >
              &times;
            </button>
            <span
              *ngIf="shot.source === 'manual'"
              class="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[10px] text-center py-0.5"
            >
              manual
            </span>
          </div>

          <label
            class="flex h-24 w-24 cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-gray-300 text-xs font-medium text-gray-500 transition hover:border-violet-300 hover:bg-violet-50/50 hover:text-violet-700 dark:border-erp-border-dark dark:text-gray-400 dark:hover:bg-violet-950/20 dark:hover:text-violet-300"
          >
            <span class="text-lg leading-none" aria-hidden="true">+</span>
            Upload
            <input type="file" accept="image/*" class="hidden" (change)="onManualUpload($event)" />
          </label>
        </div>
        <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">
          Upload manually if a screenshot renders broken or blank.
        </p>
      </div>
      </app-sf-section>

      <div class="rounded-lg border border-gray-200 dark:border-erp-border-dark">
        <button
          type="button"
          (click)="toggleTechnicalDetails()"
          class="flex w-full items-center justify-between px-3 py-2.5 text-sm font-medium text-gray-600 transition hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800/60"
          [attr.aria-expanded]="showTechnicalDetails"
        >
          <span>Technical details</span>
          <span class="text-xs text-gray-400" aria-hidden="true">{{ showTechnicalDetails ? '▲' : '▼' }}</span>
        </button>
        <div *ngIf="showTechnicalDetails" class="space-y-1 border-t border-gray-100 px-3 pb-3 pt-2 text-xs text-gray-500 dark:border-erp-border-dark dark:text-gray-400">
          <p>Route: <span class="break-all font-mono">{{ route }}</span></p>
          <p>Console entries captured: {{ consoleErrorCount }}</p>
          <p>Network errors captured: {{ networkErrorCount }}</p>
        </div>
      </div>
    </div>
  </form>
</app-form-modal-shell>
