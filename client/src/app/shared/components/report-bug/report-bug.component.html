<app-modal-layout
  title="Report a Bug"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="[
    { label: 'Cancel', onClick: onCancel.bind(this), theme: 'cancel' },
    {
      label: 'Submit',
      onClick: onSubmit.bind(this),
      theme: 'primary',
      loading: isSubmitting,
      disabled: isInitializing || reportForm.invalid,
    },
  ]"
  contentClass="p-6"
>
  <div *ngIf="isInitializing" class="space-y-4 animate-pulse">
    <div>
      <div class="h-3.5 w-32 bg-gray-200 rounded mb-2"></div>
      <div class="h-20 w-full bg-gray-200 rounded-md"></div>
    </div>
    <div>
      <div class="h-3.5 w-24 bg-gray-200 rounded mb-2"></div>
      <div class="h-9 w-full bg-gray-200 rounded-md"></div>
    </div>
    <div>
      <div class="h-3.5 w-24 bg-gray-200 rounded mb-2"></div>
      <div class="flex gap-3">
        <div class="w-24 h-24 bg-gray-200 rounded-md"></div>
        <div class="w-24 h-24 bg-gray-200 rounded-md"></div>
      </div>
    </div>
    <div class="h-10 w-full bg-gray-200 rounded-md"></div>
  </div>

  <form [formGroup]="reportForm" *ngIf="!isInitializing">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">What went wrong? <span class="text-red-500">*</span></label>
        <textarea
          formControlName="description"
          rows="4"
          class="w-full border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:ring-1 focus:ring-violet-600"
          placeholder="Describe what you were doing and what happened..."
        ></textarea>
        <p
          *ngIf="reportForm.get('description')?.invalid && reportForm.get('description')?.touched"
          class="text-xs text-red-500 mt-1"
        >
          A description is required.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Reporting To</label>
        <select
          formControlName="reportingTo"
          class="w-full border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:ring-1 focus:ring-violet-600"
        >
          <option [ngValue]="null">Unassigned</option>
          <option *ngFor="let emp of employees" [ngValue]="emp._id">
            {{ emp.firstName }} {{ emp.lastName }} ({{ emp.designation }})
          </option>
        </select>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-gray-700">Screenshots</label>
          <button
            type="button"
            (click)="onAddScreenshot()"
            [disabled]="isCapturing"
            class="text-xs text-violet-700 hover:underline disabled:opacity-50"
          >
            {{ isCapturing ? 'Capturing...' : '+ Add another screenshot' }}
          </button>
        </div>

        <div class="flex flex-wrap gap-3">
          <div *ngFor="let shot of screenshots" class="relative w-24 h-24 border border-gray-200 rounded-md overflow-hidden">
            <img [src]="shot.dataUrl" class="w-full h-full object-cover" alt="Screenshot" />
            <button
              type="button"
              (click)="onRemoveScreenshot(shot.id)"
              class="absolute top-0.5 right-0.5 w-5 h-5 flex items-center justify-center rounded-full bg-black/60 text-white text-xs hover:bg-black/80"
              title="Remove screenshot"
            >
              &times;
            </button>
            <span
              *ngIf="shot.source === 'manual'"
              class="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[10px] text-center py-0.5"
            >
              manual
            </span>
          </div>

          <label
            class="w-24 h-24 flex flex-col items-center justify-center gap-1 border border-dashed border-gray-300 rounded-md text-gray-500 text-xs cursor-pointer hover:bg-gray-50"
          >
            <ng-icon name="heroPlus" class="text-lg"></ng-icon>
            Upload
            <input type="file" accept="image/*" class="hidden" (change)="onManualUpload($event)" />
          </label>
        </div>
        <p class="text-xs text-gray-400 mt-1">
          Upload manually if a screenshot renders broken or blank.
        </p>
      </div>

      <div class="border border-gray-200 rounded-md">
        <button
          type="button"
          (click)="toggleTechnicalDetails()"
          class="w-full flex items-center justify-between px-3 py-2 text-sm text-gray-600"
        >
          <span>Technical details</span>
          <ng-icon [name]="showTechnicalDetails ? 'heroChevronUp' : 'heroChevronDown'"></ng-icon>
        </button>
        <div *ngIf="showTechnicalDetails" class="px-3 pb-3 text-xs text-gray-500 space-y-1 border-t border-gray-100 pt-2">
          <p>Route: <span class="font-mono">{{ route }}</span></p>
          <p>Console errors captured: {{ consoleErrorCount }}</p>
          <p>Network errors captured: {{ networkErrorCount }}</p>
        </div>
      </div>
    </div>
  </form>
</app-modal-layout>
