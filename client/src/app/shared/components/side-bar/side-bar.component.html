<div class="h-screen bg-white flex flex-col">
  <div class="flex flex-col flex-1 min-h-0">
    <div class="py-2 px-4 flex flex-col flex-1 min-h-0">
      <div class="flex flex-col flex-1 min-h-0" [@sideBarTrigger]="showFullBar? 'default':'reduce'">
        <!-- Logo Section -->
        <div class="w-10 h-14 overflow-hidden absolute top-0 bg-white z-10"
          [ngClass]="{'w-60':showFullBar}">
          <div class="w-full h-full flex justify-start items-center mt-2">
            <img src="assets/images/logo.webp" alt
              class="me-3 w-9 transition-all" [ngClass]="{'ml-6':showFullBar}">
            <img src="assets/images/company.jpg" alt class="me-2 w-28">
          </div>
        </div>

        <!-- Loading Skeleton -->
        <div *ngIf="!showTabs" class="mt-2 animate-pulse">
          <div *ngFor="let i of [1,2,3,4,5,6]"
            class="w-full h-9 rounded-md active mb-2"></div>
        </div>

        <!-- Menu Items -->
        <div *ngIf="showTabs"
          class="font-medium mt-20 mb-14 flex-1 min-h-0 overflow-auto overflow-x-hidden
            [scrollbar-gutter:stable_both-edges]
            [&::-webkit-scrollbar]:w-2
            [&::-webkit-scrollbar-track]:rounded-full
            [&::-webkit-scrollbar-track]:bg-gray-100
            [&::-webkit-scrollbar-thumb]:rounded-full
            [&::-webkit-scrollbar-thumb]:bg-gray-300">
          <!-- Loop through categories -->
          <ng-container *ngFor="let category of visibleCategories; let first = first">
            <!-- Category label (full sidebar) or divider (minimised sidebar) -->
            <p *ngIf="showFullBar" class="mb-1 px-3 text-xs font-semibold text-gray-400 uppercase tracking-wide"
              [class.mt-1]="first" [class.mt-6]="!first">
              {{category.label}}
            </p>
            <div *ngIf="!showFullBar && !first" class="my-2 mx-2 border-t border-gray-200"></div>

              <!-- Loop through items in this category -->
              <ng-container *ngFor="let item of category.items">
            <!-- Only show menu items that user has access to -->
            <ng-container *ngIf="hasAccess(item)">
              <!-- Top-level menu item -->
              <div class="cursor-pointer my-1"
                [id]="'sidebar-item-' + item.id"
                *ngIf="item.hasDropdown; else singleItem"
                (click)="toggleMenu(item.id)">
                <div
                  class="w-full px-3 py-2 rounded-md hover:text-violet-800 flex items-center"
                  [class.active]="!showFullBar && isParentActive(item)">
                  <ng-icon [name]="item.icon" class="text-xl text-gray-600"
                    [matTooltip]="showFullBar ? '' : item.label"
                    matTooltipPosition="right"
                    matTooltipClass="text-sm">
                  </ng-icon>
                  <div
                    class="relative w-48 flex justify-between items-center ml-3"
                    [class.hidden]="!showFullBar">
                    <p class="mt-0.5">{{item.label}}</p>

                    <!-- Chevron Up/Down for dropdown items -->
                    <ng-container
                      *ngIf="expandedMenus[item.id]; else collapsedChevron">
                      <ng-icon name="heroChevronUp"
                        class="text-gray-600"></ng-icon>
                    </ng-container>
                    <ng-template #collapsedChevron>
                      <ng-icon name="heroChevronRight"
                        class="text-gray-600"></ng-icon>
                    </ng-template>

                  </div>
                </div>
              </div>

              <!-- Template for non-dropdown menu items -->
              <ng-template #singleItem>
                <div class="my-1 cursor-pointer"
                  [id]="'sidebar-item-' + item.id"
                  [@slideTrigger]="expandedMenus['home'] && showFullBar ? 'slideDown' : 'slideUp'"
                  [routerLink]="item.route"
                  routerLinkActive="active">
                  <div
                    class="w-full px-3 py-2 rounded-md hover:text-violet-800 flex items-center relative">

                    <ng-icon [name]="item.icon" class="text-xl text-gray-600"
                      [matTooltip]="showFullBar ? '' : item.label"
                      matTooltipPosition="right"
                      matTooltipClass="text-sm">
                    </ng-icon>

                    <div class="w-48 flex justify-between ml-3"
                      [class.hidden]="!showFullBar">
                      <p class="mt-0.5">{{item.label}}</p>

                      <div class="flex items-center justify-center gap-1">
                        <ng-icon name="heroChevronRight"
                          class="text-gray-600"></ng-icon>
                      </div>
                    </div>
                  </div>
                </div>
              </ng-template>

              <!-- Dropdown submenu items -->
              <div class="overflow-hidden z-[150]"
                *ngIf="item.hasDropdown && expandedMenus[item.id]"
                [ngClass]="{dropDown: !showFullBar}">
                <div @dropDownTrigger>
                  <ul class="flex flex-col gap-1">
                    <ng-container *ngFor="let subItem of item.children">
                      <!-- Only show submenu items user has access to -->
                      <li *ngIf="!subItem.privilegeKey || hasAccess(subItem)"
                        class="py-2 pl-11 pr-3 hover:text-violet-800 rounded-md cursor-pointer"
                        [routerLink]="subItem.route"
                        [class.active]="activeLink === subItem.route">
                        <button class="relative w-full text-left">
                          {{getSubMenuLabel(subItem)}}
                        </button>
                      </li>
                    </ng-container>
                  </ul>
                </div>
              </div>
            </ng-container>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
