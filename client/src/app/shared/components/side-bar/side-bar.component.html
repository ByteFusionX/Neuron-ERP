<div class="h-screen bg-white">
    <div class="flex flex-col">
      <div class="py-2 px-4">
        <div class="w-60 overflow-hidden" [@sideBarTrigger]="showFullBar? 'default':'reduce'">
          <!-- Logo Section -->
          <div class="w-60 h-14 overflow-hidden">
            <div class="w-full h-full flex justify-start items-center">
              <img src="assets/images/logo.webp" alt="" class="me-3 w-9 transition-all" [ngClass]="{'ml-6':showFullBar}">
              <img src="assets/images/company.jpg" alt="" class="me-2 w-28">
            </div>
          </div>
          
          <!-- Loading Skeleton -->
          <div *ngIf="!showTabs" class="mt-2 animate-pulse">
            <div *ngFor="let i of [1,2,3,4,5,6]" class="w-full h-9 rounded-md active mb-2"></div>
          </div>
          
          <!-- Menu Items -->
          <div *ngIf="showTabs" class="font-medium">
            <!-- Loop through all menu items -->
            <ng-container *ngFor="let item of menuItems">
              <!-- Only show menu items that user has access to -->
              <ng-container *ngIf="hasAccess(item)">
                <!-- Top-level menu item -->
                <div class="cursor-pointer mt-2" *ngIf="item.hasDropdown; else singleItem" (click)="toggleMenu(item.id)">
                  <div class="w-full p-2 rounded-md hover:text-violet-800 flex items-center">
                    <ng-icon [name]="item.icon" class="text-xl text-gray-600" 
                      [matTooltip]="showFullBar ? '' : item.label" 
                      matTooltipPosition="right" 
                      matTooltipClass="text-sm">
                    </ng-icon>
                    <div class="relative w-48 flex justify-between items-center ml-3" [class.hidden]="!showFullBar">
                      <p class="mt-0.5">{{item.label}}</p>
                      
                      <!-- Chevron Up/Down for dropdown items -->
                      <ng-container *ngIf="expandedMenus[item.id]; else collapsedChevron">
                        <ng-icon name="heroChevronUp" class="text-gray-600"></ng-icon>
                      </ng-container>
                      <ng-template #collapsedChevron>
                        <ng-icon name="heroChevronRight" class="text-gray-600"></ng-icon>
                      </ng-template>
                      
                      <!-- Notification indicator dot -->
                      <ng-container *ngIf="hasAnyNotification(item)">
                        <span class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2 bg-orange-500 text-white text-xs font-bold h-2 w-2 flex items-center justify-center rounded-full"></span>
                      </ng-container>
                    </div>
                  </div>
                </div>
                
                <!-- Template for non-dropdown menu items -->
                <ng-template #singleItem>
                  <div class="my-3 cursor-pointer" 
                       [@slideTrigger]="expandedMenus['home'] && showFullBar ? 'slideDown' : 'slideUp'" 
                       [routerLink]="item.route" 
                       routerLinkActive="active">
                    <div class="w-full p-2 rounded-md hover:text-violet-800 flex items-center relative">
                      <!-- Notification dot for mobile view -->
                      <div *ngIf="item.notificationKey && getNotificationCount(item.notificationKey) && !showFullBar">
                        <span class="w-2 h-2 rounded-full bg-orange-500 absolute left-6 top-2"></span>
                      </div>
                      
                      <ng-icon [name]="item.icon" class="text-xl text-gray-600" 
                        [matTooltip]="showFullBar ? '' : item.label" 
                        matTooltipPosition="right" 
                        matTooltipClass="text-sm">
                      </ng-icon>
                      
                      <div class="w-48 flex justify-between ml-3" [class.hidden]="!showFullBar">
                        <p class="mt-0.5">{{item.label}}</p>
                        
                        <div class="flex items-center justify-center gap-1">
                          <!-- Notification count badge -->
                          <div *ngIf="item.notificationKey && getNotificationCount(item.notificationKey)">
                            <div class="bg-orange-500 my-auto text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full">
                              <p>{{getNotificationCount(item.notificationKey)}}</p>
                            </div>
                          </div>
                          
                          <ng-icon name="heroChevronRight" class="text-gray-600"></ng-icon>
                        </div>
                      </div>
                    </div>
                  </div>
                </ng-template>
                
                <!-- Dropdown submenu items -->
                <div class="overflow-hidden z-[150]" *ngIf="item.hasDropdown && expandedMenus[item.id]" [ngClass]="{dropDown: !showFullBar}">
                  <div @dropDownTrigger>
                    <ul>
                      <ng-container *ngFor="let subItem of item.children">
                        <!-- Only show submenu items user has access to -->
                        <li *ngIf="!subItem.privilegeKey || hasAccess(subItem)" 
                            class="p-2 flex justify-between hover:text-violet-800 rounded-md cursor-pointer"
                            [routerLink]="subItem.route" 
                            [class.active]="activeLink === subItem.route">
                          <button class="mx-6 relative">
                            {{getSubMenuLabel(subItem)}}
                          </button>
                          
                          <!-- Notification count for submenu items -->
                          <div *ngIf="subItem.notificationKey && getNotificationCount(subItem.notificationKey)">
                            <div class="bg-orange-500 my-auto text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full">
                              <p>{{getNotificationCount(subItem.notificationKey)}}</p>
                            </div>
                          </div>
                        </li>
                      </ng-container>
                    </ul>
                  </div>
                </div>
              </ng-container>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
