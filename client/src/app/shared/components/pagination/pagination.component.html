<div class="flex flex-col gap-3 px-4 py-3 sm:px-6 sm:flex-row sm:items-center sm:justify-between border-t border-gray-200">

    <!-- Rows per page -->
    <div class="flex items-center gap-3 rounded-md bg-gray-50 border border-gray-100 px-3 py-1 w-fit">
        <span class="text-[11px] font-semibold uppercase tracking-widest text-gray-600">Rows</span>
        <div class="relative">
            <select
                class="appearance-none bg-white border border-gray-200 rounded-md pl-2 pr-6 py-1.5 text-sm font-medium text-gray-900 outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 disabled:opacity-50 disabled:pointer-events-none cursor-pointer"
                (change)="onChangeSelect($event)" [value]="row" [disabled]="total<=6">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="30">30</option>
            </select>
            <ng-icon name="heroChevronDown"
                class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></ng-icon>
        </div>
    </div>

    <!-- Range summary -->
    <p class="flex items-center gap-1.5 text-sm text-gray-500 whitespace-nowrap">
        <span>Showing</span>
        <span class="font-semibold text--gray-900">{{ total ? ((selectedPage - 1) * row) + 1 : 0 }} - {{ row * selectedPage >= total ? total : row * selectedPage }}</span>
        <span>of</span>
        <span class="font-semibold text-gray-900">{{ total }}</span>
        <span>items</span>
    </p>

    <!-- Page controls -->
    <nav class="flex items-center gap-1.5" aria-label="Pagination">
        <button type="button" class="pg-btn" [disabled]="selectedPage === 1" (click)="onPageNumberClick(1)">
            <span class="sr-only">First page</span>
            <ng-icon name="heroChevronDoubleLeft" class="text-sm"></ng-icon>
        </button>
        <button type="button" class="pg-btn" [disabled]="selectedPage === 1" (click)="onPreviousClick()">
            <span class="sr-only">Previous</span>
            <ng-icon name="heroChevronLeft" class="text-sm"></ng-icon>
        </button>

        <ng-container *ngFor="let item of pageList()">
            <span *ngIf="item === '...'"
                class="w-9 h-9 flex items-center justify-center text-gray-400 tracking-widest select-none">•••</span>
            <button *ngIf="item !== '...'" type="button"
                class="w-9 h-9 rounded-full text-sm font-medium flex items-center justify-center transition-colors"
                [ngClass]="item === selectedPage
                    ? 'bg-violet-600 text-white shadow-sm shadow-violet-200'
                    : 'text-gray-600 hover:bg-gray-100'"
                [attr.aria-current]="item === selectedPage ? 'page' : null"
                (click)="onPageNumberClick($any(item))">{{ item }}</button>
        </ng-container>

        <button type="button" class="pg-btn" [disabled]="selectedPage === maxPage" (click)="onNextClick()">
            <span class="sr-only">Next</span>
            <ng-icon name="heroChevronRight" class="text-sm"></ng-icon>
        </button>
        <button type="button" class="pg-btn" [disabled]="selectedPage === maxPage" (click)="onPageNumberClick(maxPage)">
            <span class="sr-only">Last page</span>
            <ng-icon name="heroChevronDoubleRight" class="text-sm"></ng-icon>
        </button>
    </nav>
</div>
