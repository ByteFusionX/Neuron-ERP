<app-modal-layout
  [title]="data.title + ' (' + data.attachments.length + ' file' + (data.attachments.length !== 1 ? 's' : '') + ')'"
  [onClose]="onClose.bind(this)"
  [showFooter]="false"
  contentClass="px-6 py-4"
  contentMaxHeight="96">
    <div *ngIf="data.attachments.length === 0" class="text-center py-8">
      <ng-icon name="heroArchiveBoxXMark" class="text-4xl text-gray-300 mx-auto mb-3"></ng-icon>
      <p class="text-gray-500 text-sm">No attachments available</p>
    </div>

    <div *ngIf="data.attachments.length > 0" class="space-y-3">
      <div
        *ngFor="let attachment of data.attachments; trackBy: trackByFileName"
        class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200 hover:bg-gray-100 transition-colors group"
      >
        <!-- File Info -->
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="flex-shrink-0 w-10 h-10 rounded-lg bg-white border border-gray-200 flex items-center justify-center">
            <ng-icon 
              [name]="getFileIcon(attachment.originalname)" 
              class="text-lg"
              [ngClass]="{
                'text-red-500': getFileExtension(attachment.originalname) === 'pdf',
                'text-blue-500': ['doc', 'docx'].includes(getFileExtension(attachment.originalname)),
                'text-green-500': ['xls', 'xlsx'].includes(getFileExtension(attachment.originalname)),
                'text-purple-500': ['jpg', 'jpeg', 'png', 'gif'].includes(getFileExtension(attachment.originalname)),
                'text-yellow-500': ['zip', 'rar'].includes(getFileExtension(attachment.originalname)),
                'text-gray-500': !['pdf', 'doc', 'docx', 'xls', 'xlsx', 'jpg', 'jpeg', 'png', 'gif', 'zip', 'rar'].includes(getFileExtension(attachment.originalname))
              }"
            ></ng-icon>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate" [title]="attachment.originalname">
              {{ attachment.originalname }}
            </p>
            <p class="text-xs text-gray-500 uppercase tracking-wide">
              {{ getFileExtension(attachment.originalname) || 'file' }}
            </p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 ml-4">
          <!-- View Button (only for PDFs) -->
          <button
            *ngIf="isPdfFile(attachment.originalname)"
            type="button"
            (click)="onViewPDF(attachment)"
            aria-label="View File"
            class="w-8 h-8 flex justify-center items-center border border-gray-300 rounded-full hover:bg-gray-200 transition"
            title="View in new tab"
          >
            <ng-icon name="heroEye" class="text-sm"></ng-icon>
          </button>

          <!-- Download Button -->
          <button
            type="button"
            (click)="onDownload(attachment)"
            aria-label="Download File"
            class="w-8 h-8 flex justify-center items-center border border-gray-300 rounded-full hover:bg-gray-200 transition"
            title="Download file"
          >
            <ng-icon name="heroArrowDownTray" class="text-sm"></ng-icon>
          </button>
        </div>
      </div>
    </div>
</app-modal-layout>
