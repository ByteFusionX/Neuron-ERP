<div *ngIf="bar.applied.length" class="flex flex-wrap items-center gap-2 px-4 sm:px-5 py-2.5">
  <!-- Applied filter pills, as in the grid -->
  <ng-container *ngFor="let f of bar.applied; let i = index; trackBy: bar.trackById">
    <span *ngIf="i" class="px-1 text-[10px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">and</span>
    <span class="inline-flex items-center gap-1 h-7 pl-2.5 pr-1 text-xs rounded-full bg-violet-50 dark:bg-violet-950/40 text-violet-800 dark:text-violet-300 ring-1 ring-inset ring-violet-200 dark:ring-violet-900">
      <button type="button" class="inline-flex items-center gap-1 hover:underline" (click)="bar.edit(f)" [attr.aria-label]="'Edit ' + bar.label(f).field + ' filter'">
        <span class="font-medium">{{ bar.label(f).field }}</span>
        <span class="text-violet-500 dark:text-violet-400">{{ bar.label(f).op }}</span>
        <span class="font-medium max-w-40 truncate">{{ bar.label(f).value }}</span>
      </button>
      <button type="button" (click)="bar.remove(f)" [attr.aria-label]="'Remove ' + bar.label(f).field + ' filter'"
        class="ml-0.5 inline-flex h-5 w-5 items-center justify-center rounded-full hover:bg-violet-100 dark:hover:bg-violet-900/50">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </span>
  </ng-container>
  <button *ngIf="bar.applied.length" type="button" class="text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 hover:underline" (click)="bar.clear()">Clear all</button>
</div>
