<div class="flex flex-col flex-1 min-h-0 w-full overflow-hidden rounded-lg">
  @if (showHeader) {
    <div
      class="flex-shrink-0 border border-white border-b-gray-300 p-3 px-6 flex justify-between items-center cursor-move"
      [class]="headerClass"
      cdkDrag
      cdkDragRootElement=".cdk-overlay-pane"
      cdkDragHandle>
      <div>
        <h3 class="text-md font-medium">{{ title }}</h3>
        @if (subtitle) {
          <p class="text-sm text-gray-500 mt-1">{{ subtitle }}</p>
        }
      </div>
      <button
        (click)="onClose()"
        (mousedown)="$event.stopPropagation()"
        class="bg-gray-200 rounded-lg w-8 h-8 p-0 text-center flex items-center justify-center hover:bg-gray-300 transition-colors flex-shrink-0"
        type="button">
        <ng-icon name="heroXMark" class="text-md p-0 m-0"></ng-icon>
      </button>
    </div>
  }

  <div
    class="flex flex-col flex-1 min-h-0 mx-auto w-full text-gray-900 bg-white overflow-y-auto"
    [style.max-height]="contentMaxHeight"
    [class]="contentClass">
    <ng-content></ng-content>
  </div>

  @if (showFooter && footerButtons.length > 0) {
    <div
      class="flex-shrink-0 border border-white border-t-gray-300 py-3 px-6 flex justify-end gap-2"
      [class]="footerClass">
      <div class="flex gap-2">
        @for (button of footerButtons; track button.label) {
          <app-btn
            [theme]="button.theme || 'primary'"
            [type]="button.type || 'button'"
            [loading]="button.loading || false"
            [disabled]="button.disabled || false"
            (buttonClick)="button.onClick()">
            @if (button.icon) {
              <ng-icon [name]="button.icon" class="w-4 h-4 mr-1"></ng-icon>
            }
            {{ button.label }}
          </app-btn>
        }
      </div>
    </div>
  }
</div>
