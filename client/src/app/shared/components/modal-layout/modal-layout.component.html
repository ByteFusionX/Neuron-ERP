<div class="flex flex-col flex-1 min-h-0 w-full overflow-hidden rounded-lg">
  @if (showHeader) {
    <div
      class="flex-shrink-0 border border-white dark:border-gray-800 border-b-gray-300 dark:border-b-gray-700 bg-white dark:bg-gray-800 p-3 px-6 flex justify-between items-center cursor-move"
      [class]="headerClass"
      cdkDrag
      cdkDragRootElement=".cdk-overlay-pane"
      cdkDragHandle>
      <div>
        <h3 class="text-md font-medium text-gray-900 dark:text-gray-100">{{ title }}</h3>
        @if (subtitle) {
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ subtitle }}</p>
        }
      </div>
      <div class="flex items-center gap-2 flex-shrink-0" (mousedown)="$event.stopPropagation()">
        <ng-content select="[modalHeaderActions]"></ng-content>
        <button
          (click)="onClose()"
          class="bg-gray-200 dark:bg-gray-700 rounded-lg w-8 h-8 p-0 text-center flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors flex-shrink-0"
          type="button">
          <ng-icon name="heroXMark" class="text-md p-0 m-0 dark:text-gray-100"></ng-icon>
        </button>
      </div>
    </div>
  }

  <div
    class="flex flex-col flex-1 min-h-0 mx-auto w-full text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 overflow-y-auto"
    [style.max-height]="contentMaxHeight"
    [class]="contentClass">
    <ng-content></ng-content>
  </div>

  @if (showFooter && footerButtons.length > 0) {
    <div
      class="flex-shrink-0 border border-white dark:border-gray-800 border-t-gray-300 dark:border-t-gray-700 bg-white dark:bg-gray-800 py-3 px-6 flex justify-end gap-2"
      [class]="footerClass">
      <div class="flex gap-2">
        @for (button of footerButtons; track button.label) {
          <app-btn
            [theme]="button.theme || 'primary'"
            [type]="button.type || 'button'"
            [loading]="button.loading || false"
            [disabled]="button.disabled || false"
            (buttonClick)="button.onClick()">
            @if (button.icon) {
              <ng-icon [name]="button.icon" class="w-4 h-4 mr-1"></ng-icon>
            }
            {{ button.label }}
          </app-btn>
        }
      </div>
    </div>
  }
</div>
