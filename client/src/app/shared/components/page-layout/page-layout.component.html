<div class="w-full p-6 bg-gray-50 min-h-screen">
  @if (showHeader) {
    <div 
      class="border-b border-gray-200 bg-white shadow-sm p-4 px-6 flex justify-between items-center sticky top-0 z-10"
      [class]="headerClass">
      <div>
        <h3 class="text-lg font-semibold text-gray-900">{{ title }}</h3>
        @if (subtitle) {
          <p class="text-sm text-gray-600 mt-1">{{ subtitle }}</p>
        }
      </div>

    </div>
  }

  <div 
    class="flex flex-col mx-auto text-gray-900 bg-white w-full"
    [style.max-height]="contentMaxHeight"
    [class]="contentClass">
    <ng-content></ng-content>
  </div>

  @if (showFooter && footerButtons.length > 0) {
    <div 
      class="border-t border-gray-200 bg-white shadow-sm py-4 px-6 flex justify-end gap-3 sticky bottom-0 z-10"
      [class]="footerClass">
      <div class="flex gap-3">
        @for (button of footerButtons; track button.label) {
          <app-btn
            [theme]="button.theme || 'primary'"
            [type]="button.type || 'button'"
            [loading]="button.loading || false"
            [disabled]="button.disabled || false"
            (buttonClick)="button.onClick()">
            @if (button.icon) {
              <ng-icon [name]="button.icon" class="w-4 h-4 mr-1"></ng-icon>
            }
            {{ button.label }}
          </app-btn>
        }
      </div>
    </div>
  }
</div>
