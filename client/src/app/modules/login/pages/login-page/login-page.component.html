<main class="relative flex flex-1 flex-col overflow-hidden">
    <img src="assets/images/beams-cover.webp" alt="" class="absolute top-0 h-full w-full">
    <div class="absolute inset-0 text-slate-900/[0.07] [mask-image:linear-gradient(to_bottom_left,white,transparent,transparent)]">
        <svg class="absolute inset-0 h-full w-full" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <pattern id="grid-bg" width="32" height="32" patternUnits="userSpaceOnUse" x="100%" patternTransform="translate(0 -1)">
                    <path d="M0 32V.5H32" fill="none" stroke="currentColor"></path>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-bg)"></rect>
        </svg>
    </div>

    <div class="relative flex flex-1 flex-col items-center justify-center">
        <section class="w-full px-4">
            <div class="mx-auto flex min-h-screen w-full max-w-[750px] flex-col items-center justify-center">
                <div class="mb-6 flex items-center text-2xl font-semibold text-gray-900">
                    <img class="mr-2 h-8 w-8" src="assets/images/favicon.png" alt="Neuron Technologies">
                    <img class="mr-2 h-8 w-46" src="assets/images/companyTransparent.png" alt="Neuron Technologies">
                </div>

                <div class="w-full rounded-lg bg-white shadow sm:max-w-md">
                    <div class="space-y-6 p-6 sm:p-8 md:space-y-8">
                        <div class="text-center">
                            <h1 class="mb-2 text-xl font-bold leading-tight tracking-tight text-gray-700 md:text-2xl">
                                Welcome Back
                            </h1>
                            <p class="text-sm text-gray-600">Sign in to your account using Microsoft</p>
                        </div>

                        <button type="button" (click)="loginWithMicrosoft()" [disabled]="isMicrosoftLoginLoading"
                            class="flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-3 transition-colors duration-200 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-white">
                            <div *ngIf="isMicrosoftLoginLoading" class="mr-3 h-5 w-5 animate-spin rounded-full border-2 border-gray-300 border-t-gray-700"></div>
                            <svg *ngIf="!isMicrosoftLoginLoading" class="mr-3 h-5 w-5" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M11 0H0V11H11V0Z" fill="#F25022"></path>
                                <path d="M23 0H12V11H23V0Z" fill="#7FBA00"></path>
                                <path d="M11 12H0V23H11V12Z" fill="#00A4EF"></path>
                                <path d="M23 12H12V23H23V12Z" fill="#FFB900"></path>
                            </svg>
                            <span class="font-medium text-gray-700">
                                {{ isMicrosoftLoginLoading ? 'Signing in...' : 'Continue with Microsoft' }}
                            </span>
                        </button>

                        <p class="text-center text-xs text-gray-500">
                            Use the Microsoft account linked to your employee profile.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
