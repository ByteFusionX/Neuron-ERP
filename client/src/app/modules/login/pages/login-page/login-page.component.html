<main class="relative flex flex-1 flex-col overflow-hidden"><img src="assets/images/beams-cover.webp" alt=""
        class="absolute top-0 w-full h-full">
    <div
        class="absolute inset-0 text-slate-900/[0.07] [mask-image:linear-gradient(to_bottom_left,white,transparent,transparent)]">
        <svg class="absolute inset-0 h-full w-full" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid-bg" width="32" height="32" patternUnits="userSpaceOnUse" x="100%"
                    patternTransform="translate(0 -1)">
                    <path d="M0 32V.5H32" fill="none" stroke="currentColor"></path>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-bg)"></rect>
        </svg>
    </div>
    <div class="relative flex flex-1 flex-col items-center justify-center ">
        <section>
            <div class="flex flex-col items-center justify-center  mx-auto md:h-screen w-[750px]">
                <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 ">
                    <img class="w-8 h-8 mr-2" src="../../../../../assets/images/favicon.png" alt="logo">
                    <img class="w-46 h-8 mr-2" src="../../../../../assets/images/companyTransparent.png" alt="logo">
                </a>
                <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0">
                    <div *ngIf="isEmployeePresent" class="p-6 space-y-6 md:space-y-8 sm:p-8">
                        <div class="text-center">
                            <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-700 md:text-2xl mb-2">
                                Welcome Back
                            </h1>
                            <p class="text-gray-600 text-sm">
                                Sign in to your account using Microsoft
                            </p>
                        </div>

                        <div class="space-y-4">
                            <button type="button" (click)="loginWithMicrosoft()" 
                                [disabled]="isMicrosoftLoginLoading"
                                class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white">
                                
                                <div *ngIf="isMicrosoftLoginLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-gray-700 mr-3"></div>
                                
                                <svg *ngIf="!isMicrosoftLoginLoading" class="w-5 h-5 mr-3" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M11 0H0V11H11V0Z" fill="#F25022"/>
                                    <path d="M23 0H12V11H23V0Z" fill="#7FBA00"/>
                                    <path d="M11 12H0V23H11V12Z" fill="#00A4EF"/>
                                    <path d="M23 12H12V23H23V12Z" fill="#FFB900"/>
                                </svg>
                                
                                <span class="text-gray-700 font-medium">
                                    {{ isMicrosoftLoginLoading ? 'Signing in...' : 'Continue with Microsoft' }}
                                </span>
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="text-xs text-gray-500">
                                By signing in, you agree to our Terms of Service and Privacy Policy
                            </p>
                        </div>
                    </div> 
                    <div *ngIf="!isEmployeePresent" class="p-6 space-y-4 md:space-y-6 sm:p-8">
                        <div class="text-center">
                            <h2 class="text-xl font-bold text-gray-900 mb-2">
                                Setup Required
                            </h2>
                            <p class="text-gray-600 mb-6">
                                No employees found in the database. Create a super admin account to get started.
                            </p>
                        </div>
                        <button type="button" (click)="onCreateSuperAdmin()"
                            [disabled]="isSuperAdminLoading"
                            class="w-full text-white bg-violet-700 hover:bg-violet-600 font-medium rounded-lg text-sm px-5 py-3 text-center flex justify-center items-center gap-2 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-violet-700">
                            
                            <div *ngIf="isSuperAdminLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                            
                            <ng-icon *ngIf="!isSuperAdminLoading" name="heroUserCircle" class="text-white text-lg"></ng-icon>
                            
                            {{ isSuperAdminLoading ? 'Creating Account...' : 'Create Super Admin Account' }}
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
