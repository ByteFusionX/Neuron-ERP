<div class="h-full flex flex-col p-6 bg-gray-50 dark:bg-erp-surface-dark-alt" *ngIf="categorySection">
    <app-data-grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        [showToolbarTools]="false"
        [showDetailPanel]="false"
        title="Roles &amp; Privileges"
        subtitle="Categories of employees and what each one is allowed to see and do."
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        storageKey="hr-roles"
        [selectable]="false"
        [data]="roles"
        [columns]="columns"
        [loading]="isCategoryLoading"
        [rowActions]="rowActions"
        [createLabel]="gridCreateLabel"
        searchPlaceholder="Search roles"
        emptyMessage="No roles found"
        (create)="createCategory()"
        (rowOpen)="viewCategory($event)"
        (rowAction)="onRowAction($event)">
    </app-data-grid>
</div>

<app-role-form-drawer [open]="formOpen" [mode]="formMode" [category]="formCategory" [canEdit]="!!privileges?.roles?.edit"
    (saved)="onFormSaved()" (closed)="formOpen = false"></app-role-form-drawer>
