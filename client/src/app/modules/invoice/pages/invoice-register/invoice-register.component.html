<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">

    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Payable"
        subtitle="Invoice register and payment status"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="paginationService.paginationState().total"
        [data]="tableData()"
        [columns]="registerColumns"
        [loading]="isLoading()"
        [pageSize]="paginationService.paginationState().row"
        [selectable]="false"
        [showDetailPanel]="false"
        searchPlaceholder="Search invoices"
        emptyMessage="No invoices found"
        [createLabel]="canCreateInvoice() ? 'Create Invoice' : ''"
        storageKey="finance-payables-invoice-register"
        exportable
        exportFileName="invoice-register.xlsx"
        (queryChange)="onQueryChange($event)"
        (cellEdit)="onStatusChange($event)"
        (rowOpen)="onRowClick($event)"
        (exportRequest)="onExportRequest()"
        (create)="openCreateInvoice()">
    </app-data-grid>

    <app-create-invoice
        class="contents"
        [open]="createInvoiceOpen()"
        (saved)="onCreateInvoiceSaved()"
        (closed)="createInvoiceOpen.set(false)">
    </app-create-invoice>

</div>
