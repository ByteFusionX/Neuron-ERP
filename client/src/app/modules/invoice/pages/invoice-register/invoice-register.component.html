<div class="p-6 bg-slate-50 min-h-screen">

    <!-- Shared Action Buttons Template -->
    <ng-template #actionButtons>
        <div class="flex items-center gap-3">
            <!-- View Mode Switcher via Dropdown -->
            <button [matMenuTriggerFor]="reportMenu"
                class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 flex items-center gap-2 text-sm font-medium transition-colors">
                <ng-icon name="heroDocumentChartBar" class="text-slate-500"></ng-icon>
                Invoice Report
                <ng-icon name="heroChevronDown" class="text-slate-400 text-xs"></ng-icon>
            </button>
            <mat-menu #reportMenu="matMenu">
                <button mat-menu-item>
                    <ng-icon name="heroUserGroup" class="mr-2 text-slate-500"></ng-icon>
                    Customer-wise Report
                </button>
                <button mat-menu-item>
                    <ng-icon name="heroUser" class="mr-2 text-slate-500"></ng-icon>
                    Salesperson-wise Report
                </button>
            </mat-menu>

            <!-- Create Invoice Button -->
            <ng-container *ngIf="canCreateInvoice()">
                <app-btn theme="primary" routerLink="/invoice/invoice-register/create">
                    <ng-icon name="heroPlus" class="mr-1"></ng-icon>
                    Create Invoice
                </app-btn>
            </ng-container>
        </div>
    </ng-template>
    <data-table [data]="tableData()" [columns]="registerColumns" [defaultColumns]="defaultColumns"
        [isLoading]="isLoading()" [totalItems]="paginationService.paginationState().total"
        [isEmpty]="tableData().length === 0" [tableId]="'invoice-register-table'" [title]="'Invoice Register'"
        (filterChange)="onFilterChange($event)" (paginationChange)="onPaginationChange($event)"
        (statusChange)="onStatusChange($event)" (rowClick)="onRowClick($event)">
        <ng-template #sideColumn>
            <div class="flex items-center gap-3">
                <!-- <data-search 
                        placeholder="Search invoices..."
                        (searchSubmitted)="onSearch($event)"
                    ></data-search> -->
                <ng-container *ngTemplateOutlet="actionButtons"></ng-container>
            </div>
        </ng-template>
    </data-table>

</div>
