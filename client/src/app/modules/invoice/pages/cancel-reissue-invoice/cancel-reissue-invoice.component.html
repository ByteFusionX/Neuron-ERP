<app-modal-layout
  title="Cancel + Re-Issue Invoice"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="[
    { label: 'Cancel', onClick: onCancelInvoice.bind(this), theme: 'cancel' },
    { label: 'Cancel & Re-Issue', onClick: onCancelAndReissue.bind(this), theme: 'primary' }
  ]"
  contentClass="px-6 py-6"
  headerClass="bg-red-50 text-red-800 border-b-red-200"
  footerClass="bg-gray-50">
  <form [formGroup]="form">
    
    <!-- Top Row: Job ID and Invoice No -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <!-- Job ID Field -->
      <div>
        <label for="cancel-job-id" class="block text-sm font-medium text-gray-700 mb-1">
          Job ID <span class="text-red-500">*</span>
        </label>
        <ng-select
          id="cancel-job-id"
          class="w-full form"
          [items]="jobOptions"
          formControlName="jobId"
          bindLabel="label"
          bindValue="value"
          placeholder="Select Job ID"
          [clearable]="true"
          [ngClass]="{'ng-invalid ng-dirty': form.get('jobId')?.invalid && form.get('jobId')?.touched}"
        ></ng-select>
      </div>

      <!-- Invoice No Field -->
      <div>
        <label for="cancel-invoice-no" class="block text-sm font-medium text-gray-700 mb-1">
          Invoice No <span class="text-red-500">*</span>
        </label>
        <ng-select
          id="cancel-invoice-no"
          class="w-full form"
          [items]="invoiceOptions"
          formControlName="invoiceNo"
          bindLabel="label"
          bindValue="value"
          placeholder="Select Invoice"
          [clearable]="true"
          [ngClass]="{'ng-invalid ng-dirty': form.get('invoiceNo')?.invalid && form.get('invoiceNo')?.touched}"
        ></ng-select>
      </div>
    </div>

    <!-- Customer Name Field -->
    <div class="mb-4">
      <label for="cancel-customer" class="block text-sm font-medium text-gray-700 mb-1">
        Customer Name
      </label>
      <input
        type="text"
        id="cancel-customer"
        formControlName="customerName"
        class="form-input appearance-none block w-full bg-gray-100 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none"
        readonly
      />
    </div>

    <!-- Reason Field -->
    <div class="mb-6">
      <label for="cancel-reason" class="block text-sm font-medium text-gray-700 mb-1">
        Reason for Cancellation <span class="text-red-500">*</span>
      </label>
      <textarea
        id="cancel-reason"
        formControlName="reason"
        class="appearance-none block w-full bg-white text-gray-700 border border-gray-300 rounded py-3 px-4 leading-tight focus:ring-1 focus:ring-inset focus:ring-blue-500 focus:outline-none focus:border-blue-500 mt-1"
        rows="3"
        placeholder="Please provide a reason for cancelling this invoice"
      ></textarea>
      <div 
        *ngIf="form.get('reason')?.invalid && form.get('reason')?.touched" 
        class="text-red-500 mt-1 text-sm">
        A valid reason is required.
      </div>
    </div>

    <!-- Invoice Details Summary section -->
    <div class="mt-4 border-t border-gray-200 pt-4" *ngIf="invoiceData">
      <h3 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-3">Invoice Details Summary</h3>
      
      <div class="bg-gray-50 rounded-lg border border-gray-200 overflow-hidden">
        <table class="w-full text-sm text-left text-gray-600">
          <thead class="text-xs text-gray-500 uppercase bg-gray-100 border-b border-gray-200">
            <tr>
              <th scope="col" class="px-4 py-3 font-semibold">Description</th>
              <th scope="col" class="px-4 py-3 font-semibold text-center w-16">Qty</th>
              <th scope="col" class="px-4 py-3 font-semibold text-right">Amount</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let item of invoiceData.items" class="bg-white">
              <td class="px-4 py-3 font-medium text-gray-800">{{ item.description }}</td>
              <td class="px-4 py-3 text-center">{{ item.quantity || '-' }}</td>
              <td class="px-4 py-3 text-right font-medium text-gray-800">{{ item.amount | number:'1.2-2' }}</td>
            </tr>
            <tr *ngIf="!invoiceData.items?.length" class="bg-white">
              <td colspan="3" class="px-4 py-4 text-center text-gray-500 italic">No items found</td>
            </tr>
          </tbody>
          <tfoot class="bg-gray-50">
            <tr>
              <td colspan="2" class="px-4 py-3 text-right font-semibold text-gray-600">Total</td>
              <td class="px-4 py-3 text-right font-bold text-gray-900">{{ invoiceData.amount | number:'1.2-2' }} <span class="text-xs text-gray-500 font-normal">QAR</span></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </form>
</app-modal-layout>
