<app-sf-drawer title="Assign To Presale" subtitle="Choose who prepares the estimate" width="560px"
    [open]="open" [dirty]="form.dirty" (closed)="onDrawerClosed()">

    <form id="assign-presale-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-sf-section title="Assignment">
            <app-sf-field label="Presale Person" [control]="form.controls.presalePerson">
                <app-sf-combobox formControlName="presalePerson" [options]="employeeOptions" placeholder="Select presale person"></app-sf-combobox>
            </app-sf-field>
            <app-sf-field label="Comment" [control]="form.controls.comment">
                <app-sf-textarea formControlName="comment" placeholder="Instructions for presales"></app-sf-textarea>
            </app-sf-field>
        </app-sf-section>

        <app-sf-section title="Files">
            <ul *ngIf="existingFiles.length" class="mb-2 divide-y divide-gray-100 dark:divide-erp-border-dark rounded-lg border border-gray-200 dark:border-erp-border-dark">
                <li *ngFor="let f of existingFiles; let i = index" class="flex items-center gap-3 px-3 py-2 text-[13px]">
                    <span class="min-w-0 flex-1 truncate text-gray-900 dark:text-gray-100">{{ f.originalname || f.name }}</span>
                    <button type="button" class="rounded px-1.5 text-gray-400 dark:text-gray-500 hover:text-red-600 dark:hover:text-red-400"
                        [attr.aria-label]="'Remove ' + (f.originalname || f.name)" (click)="removeExisting(i)">&times;</button>
                </li>
            </ul>
            <app-sf-field label="Attach files" hint="At least one file is required">
                <app-sf-file formControlName="files" [accept]="acceptedFiles" [maxSizeMb]="5"></app-sf-file>
            </app-sf-field>
            <p *ngIf="filesError && !form.value.files?.length && !existingFiles.length" class="mt-1 text-xs text-red-600 dark:text-red-400" role="alert">Select at least one file.</p>
        </app-sf-section>
    </form>

    <ng-container sfDrawerFooter>
        <app-action-button *ngIf="isReassign" class="mr-auto" variant="tool" (click)="clear()">Clear</app-action-button>
        <app-action-button variant="secondary" (click)="onDrawerClosed()">Close</app-action-button>
        <app-action-button variant="primary" type="submit" form="assign-presale-form">Submit</app-action-button>
    </ng-container>
</app-sf-drawer>
