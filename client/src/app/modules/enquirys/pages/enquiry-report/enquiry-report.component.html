<div class="er-page h-full overflow-y-auto bg-gray-50 dark:bg-erp-surface-dark-alt p-6 flex flex-col gap-5">

    <!-- Header — same shell and spacing as the grid's toolbar, so List and Report read as one screen. -->
    <div class="er-card shrink-0">
        <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-3 min-h-16 border-b border-gray-100 dark:border-erp-border-dark">
            <div class="flex items-center gap-2.5 min-w-0">
                <nav aria-label="Breadcrumb" class="hidden sm:flex items-center gap-1.5 text-[13px] text-gray-500 dark:text-gray-500 min-w-0">
                    <a *ngFor="let b of breadcrumbs" [routerLink]="b.link" class="truncate max-w-40 hover:text-gray-900 dark:hover:text-gray-100 hover:underline">{{ b.label }}</a>
                    <svg class="w-3.5 h-3.5 shrink-0 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
                    </svg>
                </nav>
                <h2 class="text-[15px] font-semibold text-gray-900 dark:text-gray-100 truncate" aria-current="page">Enquiries</h2>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <!-- List | Report. Both carry the same filters through the URL. -->
                <app-view-toggle label="Enquiry" active="report" listLink="/enquiry" reportLink="/enquiry/report" [listQueryParams]="listQueryParams"></app-view-toggle>

                <app-action-button variant="tool" (click)="exportExcel()" [disabled]="!report">
                    <ng-icon name="heroArrowDownTray" class="h-4 w-4 text-gray-500 dark:text-gray-400"></ng-icon>
                    Excel
                </app-action-button>
                <app-action-button variant="tool" (click)="exportPdf()" [disabled]="!report">
                    <ng-icon name="heroPrinter" class="h-4 w-4 text-gray-500 dark:text-gray-400"></ng-icon>
                    PDF
                </app-action-button>
            </div>
        </div>

        <app-report-filters [fields]="filterFields" [values]="filters" hint="Showing a filtered slice of the enquiries."
            (valuesChange)="onFilterChange($event)"></app-report-filters>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="er-card grid place-content-center py-20 text-sm text-gray-500 dark:text-gray-400">
        Building report…
    </div>

    <div *ngIf="!loading && failed" class="er-card grid place-content-center gap-3 py-20 text-center">
        <p class="text-sm text-gray-600 dark:text-gray-300">The report could not be generated.</p>
        <p class="text-xs text-gray-500 dark:text-gray-500">Try a narrower date range, or reload the page.</p>
    </div>

    <ng-container *ngIf="!loading && report as r">

        <!-- KPI strip -->
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
            <app-kpi-card label="Enquiries" [value]="r.kpi.totalCount"
                [foot]="r.kpi.openCount + ' still open'" [delta]="delta('totalCount')"></app-kpi-card>
            <app-kpi-card label="Quoted" [value]="r.kpi.quotedCount" valueClass="text-emerald-600 dark:text-emerald-400"
                [foot]="'converted to a quotation'" [delta]="delta('quotedCount')"></app-kpi-card>
            <app-kpi-card label="With Presales" [value]="r.kpi.presalesCount"
                [foot]="r.kpi.estimatedCount + ' estimated, ready to quote'"></app-kpi-card>
            <app-kpi-card label="Needs Attention" [value]="attentionTotal"
                [foot]="'items to follow up'"></app-kpi-card>
        </div>

        <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">
            <div class="er-card p-5">
                <h3 class="er-heading mb-4">Pipeline</h3>
                <div class="space-y-3">
                    <button *ngFor="let stage of r.funnel" type="button"
                        class="flex w-full items-center justify-between gap-3 rounded-md border border-gray-100 px-3 py-2 text-left text-sm transition-colors hover:bg-gray-50 dark:border-erp-border-dark dark:hover:bg-gray-800"
                        routerLink="/enquiry" [queryParams]="listQueryParams">
                        <span class="min-w-0 truncate text-gray-700 dark:text-gray-300">{{ stage.label }}</span>
                        <span class="shrink-0 font-semibold tabular-nums text-gray-900 dark:text-gray-100">{{ stage.count }}</span>
                    </button>
                </div>
            </div>

            <div class="er-card lg:col-span-2 flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 dark:border-erp-border-dark px-5 py-3">
                    <h3 class="er-heading">Needs Attention</h3>
                    <div class="er-toggle">
                        <button *ngFor="let t of attentionTabs" type="button" class="er-toggle-btn"
                            [ngClass]="attentionKey === t.key ? 'er-toggle-on' : ''" (click)="attentionKey = t.key">
                            {{ t.label }} <span class="er-count">{{ attentionCount(t.key) }}</span>
                        </button>
                    </div>
                </div>

                <div class="max-h-[28rem] overflow-y-auto divide-y divide-gray-100 dark:divide-erp-border-dark">
                    <button *ngFor="let item of attentionItems; trackBy: trackById" type="button"
                        class="flex w-full items-center gap-3 px-5 py-3 text-left transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                        (click)="openEnquiry(item)">
                        <span class="min-w-0 flex-1">
                            <span class="block truncate text-[13px] font-medium text-gray-900 dark:text-gray-100">{{ item.enquiryId }} — {{ item.customer }}</span>
                            <span class="block truncate text-xs text-gray-500 dark:text-gray-400">
                                {{ item.title }} · {{ item.salesPerson }}<ng-container *ngIf="item.presale"> · with {{ item.presale }}</ng-container>
                            </span>
                        </span>
                        <span class="shrink-0 text-right">
                            <span class="block text-xs tabular-nums"
                                [ngClass]="attentionKey === 'rejected' ? 'text-red-600 dark:text-red-400' : 'text-amber-600 dark:text-amber-400'">{{ attentionDaysLabel(item) }}</span>
                        </span>
                    </button>
                    <p *ngIf="!attentionItems.length" class="px-5 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
                        Nothing here — every enquiry in this list is on track.
                    </p>
                </div>
            </div>
        </div>

        <p class="pb-2 text-center text-[11px] text-gray-400 dark:text-gray-600">
            Generated {{ r.generatedAt | date: 'dd MMM yyyy, HH:mm' }}
        </p>
    </ng-container>
</div>
