<app-sf-drawer [title]="isEdit ? 'Edit Enquiry' : 'Create Enquiry'" [subtitle]="isEdit ? (enquiry?.enquiryId ?? '') : steps[step - 1].label" width="720px"
    [open]="open" [dirty]="enquiryForm.dirty" (closed)="onDrawerClosed($event)">

    <span sfDrawerHeader *ngIf="draftRef.savedAt && !isEdit" class="text-xs text-gray-400 dark:text-gray-500">Draft saved {{ draftRef.savedAt | date: 'HH:mm' }}</span>

    <!-- Stepper -->
    <ol *ngIf="!isEdit" class="mb-5 flex items-center gap-2">
        <li *ngFor="let s of steps" class="flex flex-1 items-center gap-2">
            <button type="button" class="flex min-w-0 flex-1 items-center gap-2 rounded-lg px-2 py-1.5 text-left transition-colors"
                [ngClass]="s.n === step ? 'bg-violet-50 dark:bg-violet-950/40' : 'hover:bg-gray-50 dark:hover:bg-gray-800'"
                (click)="goToStep(s.n)">
                <span class="grid h-6 w-6 shrink-0 place-content-center rounded-full text-[11px] font-semibold"
                    [ngClass]="s.n === step
                        ? 'bg-violet-600 text-white'
                        : (s.n < step && isStepValid(s.n))
                            ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300'
                            : 'bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400'">{{ s.n }}</span>
                <span class="truncate text-xs font-medium"
                    [ngClass]="s.n === step ? 'text-violet-700 dark:text-violet-300' : 'text-gray-600 dark:text-gray-400'">{{ s.label }}</span>
            </button>
            <span *ngIf="s.n < 2" class="h-px w-4 shrink-0 bg-gray-200 dark:bg-erp-border-dark"></span>
        </li>
    </ol>

    <form id="enquiry-form" [formGroup]="enquiryForm" sfDraft="enquiry-list-create" #draftRef="sfDraft"
        [sfDraftExclude]="['attachments']" [sfDraftDisabled]="isEdit" (ngSubmit)="submit()" novalidate>

        <div *ngIf="draftRef.pending && !isEdit" class="mb-5 flex flex-wrap items-center justify-between gap-2 rounded-lg border border-violet-200 dark:border-violet-900 bg-violet-50 dark:bg-violet-950/40 px-3 py-2 text-[13px] text-violet-900 dark:text-violet-200">
            <span>You have an unsaved draft from {{ draftRef.pending.savedAt | date: 'dd MMM, HH:mm' }}.</span>
            <span class="flex gap-3">
                <button type="button" class="font-medium hover:underline" (click)="draftRef.restore()">Restore</button>
                <button type="button" class="text-violet-700 dark:text-violet-400 hover:underline" (click)="draftRef.discard()">Discard</button>
            </span>
        </div>

        <!-- Step 1 — customer & details ------------------------------------------- -->
        <ng-container *ngIf="step === 1">
            <app-sf-section title="Customer" columns="2">
                <app-sf-field label="Customer" [control]="enquiryForm.controls.client">
                    <app-sf-combobox formControlName="client" [options]="customerOptions" placeholder="Select customer"></app-sf-combobox>
                </app-sf-field>
                <app-sf-field label="Contact" [hint]="enquiryForm.controls.client.value ? '' : 'Select customer first'" [control]="enquiryForm.controls.contact">
                    <app-sf-combobox formControlName="contact" [options]="contactOptions" emptyText="Select a customer first" placeholder="Select contact"></app-sf-combobox>
                </app-sf-field>
                <app-sf-field label="Department" [control]="enquiryForm.controls.department">
                    <app-sf-combobox formControlName="department" [options]="departmentOptions" placeholder="Select department"></app-sf-combobox>
                </app-sf-field>
                <app-sf-field label="Enquiry Owner">
                    <app-sf-input [ngModelOptions]="{ standalone: true }" [ngModel]="enquiryOwnerName" [readonly]="true"></app-sf-input>
                </app-sf-field>
            </app-sf-section>

            <app-sf-section title="Details" columns="2">
                <app-sf-field full label="Enquiry Title" [control]="enquiryForm.controls.title">
                    <app-sf-input formControlName="title" placeholder="Title"></app-sf-input>
                </app-sf-field>
                <app-sf-field label="Priority" [control]="enquiryForm.controls.priority">
                    <app-sf-select formControlName="priority" [options]="priorityOptions" placeholder="Select priority"></app-sf-select>
                </app-sf-field>
                <app-sf-field label="Source" hint="Optional" [control]="enquiryForm.controls.source">
                    <app-sf-select formControlName="source" [options]="sourceOptions" placeholder="Select source"></app-sf-select>
                </app-sf-field>
                <app-sf-field *ngIf="!isEdit" label="Assign Enquiry Owner" hint="Optional — leave blank to assign it to yourself" [control]="enquiryForm.controls.accountingManager">
                    <app-sf-combobox formControlName="accountingManager" clearable [options]="accountingManagerOptions"
                        placeholder="Myself"></app-sf-combobox>
                </app-sf-field>
                <app-sf-field *ngIf="!isEdit" label="Enquiry Date" [control]="enquiryForm.controls.date">
                    <app-sf-date formControlName="date" [min]="earliestEnquiryDate" [max]="today" typeable displayFormat="dd/MM/yyyy"></app-sf-date>
                </app-sf-field>
                <app-sf-field *ngIf="!isEdit" label="Next Follow-up Date" [control]="enquiryForm.controls.nextFollowUpDate">
                    <app-sf-date formControlName="nextFollowUpDate" [min]="today" typeable displayFormat="dd/MM/yyyy"></app-sf-date>
                </app-sf-field>
            </app-sf-section>

            <app-sf-section *ngIf="isEdit" title="Notes">
                <app-sf-field full label="Requirement" [control]="enquiryForm.controls.requirement">
                    <app-sf-textarea formControlName="requirement" [rows]="6" placeholder="Requirement, scope or important notes"></app-sf-textarea>
                </app-sf-field>
            </app-sf-section>
        </ng-container>

        <!-- Step 2 — requirement / notes & files ------------------------------------------- -->
        <ng-container *ngIf="step === 2">
            <app-sf-section title="Notes">
                <app-sf-field full label="Requirement" [control]="enquiryForm.controls.requirement">
                    <app-sf-textarea formControlName="requirement" [rows]="6" placeholder="Requirement, scope or important notes"></app-sf-textarea>
                </app-sf-field>
            </app-sf-section>

            <app-sf-section title="Files">
                <app-sf-field label="Files" hint="Optional" [control]="enquiryForm.controls.attachments">
                    <app-sf-file formControlName="attachments" [accept]="acceptedFiles" [maxSizeMb]="5"></app-sf-file>
                </app-sf-field>
            </app-sf-section>
        </ng-container>
    </form>

    <ng-container sfDrawerFooter>
        <!-- Opens the customer form in a drawer on top of this one. -->
        <app-action-button *ngIf="step === 1 && !isEdit" class="mr-auto" variant="tool" [disabled]="saving" (click)="createCustomer()">+ Create Customer</app-action-button>

        <app-action-button *ngIf="step === 1" variant="secondary" (click)="cancel()">Cancel</app-action-button>
        <app-action-button *ngIf="step === 2" variant="secondary" (click)="previousStep()">Back</app-action-button>

        <app-action-button *ngIf="step === 1 && !isEdit" variant="primary" (click)="nextStep()">Next: {{ steps[1].label }}</app-action-button>
        <app-action-button *ngIf="isEdit" variant="primary" type="submit" form="enquiry-form" [disabled]="saving">
            {{ saving ? 'Saving…' : 'Save changes' }}
        </app-action-button>
        <app-action-button *ngIf="step === 2 && !isEdit" variant="primary" type="submit" form="enquiry-form" [disabled]="saving">
            {{ saving ? 'Creating…' : 'Create Enquiry' }}
        </app-action-button>
    </ng-container>
</app-sf-drawer>

<app-customer-form-drawer [open]="customerDrawerOpen" mode="create" [customer]="null"
    (saved)="onCustomerSaved($event)" (closed)="customerDrawerOpen = false"></app-customer-form-drawer>
