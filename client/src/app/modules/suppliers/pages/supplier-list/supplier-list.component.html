<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <div *ngIf="selectedCategory || selectedSupplierType" class="flex flex-wrap items-center gap-2 text-xs text-gray-600 dark:text-gray-300" role="status">
        <span>Filtered from report:</span>
        <span *ngIf="selectedCategory" class="rounded-full border border-violet-300 bg-violet-50 px-2.5 py-0.5 text-violet-700 dark:border-violet-800 dark:bg-violet-950/40 dark:text-violet-300">Category</span>
        <span *ngIf="selectedSupplierType" class="rounded-full border border-violet-300 bg-violet-50 px-2.5 py-0.5 text-violet-700 dark:border-violet-800 dark:bg-violet-950/40 dark:text-violet-300">Type: {{ selectedSupplierType }}</span>
        <button type="button" class="font-medium text-violet-700 hover:underline dark:text-violet-400" (click)="clearReportFilters()">Clear</button>
    </div>

    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Suppliers"
        subtitle="Manage supplier records and banking details"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="total"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        searchPlaceholder="Search by supplier name or id"
        emptyMessage="No suppliers found"
        [createLabel]="canCreate ? 'Create Supplier' : ''"
        [rowActions]="rowActions"
        [views]="views"
        (viewChange)="onViewChange($event)"
        storageKey="supplier-list"
        exportable
        exportFileName="suppliers.xlsx"
        [detailTabs]="detailTabs"
        [detailTitle]="supplierTitle"
        [detailSubtitle]="supplierSubtitle"
        (queryChange)="onQueryChange($event)"
        (rowOpen)="onRowOpen()"
        (cellEdit)="onCellEdit($event)"
        (rowAction)="onRowAction($event)"
        (create)="onCreateSupplier()">

        <div dgToolbarExtra class="flex items-center gap-2">
            <button type="button" (click)="openDuplicatesReport()" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-[13px] font-medium text-gray-700 hover:bg-gray-50 dark:border-erp-border-dark dark:bg-erp-surface-dark dark:text-gray-200">Duplicates</button>
        </div>

        <app-view-toggle dgToolbarExtra label="Supplier" active="list" listLink="/suppliers" reportLink="/suppliers/report" [reportQueryParams]="reportQueryParams"></app-view-toggle>

        <ng-template #detailAsideTemplate let-row>
            <span *ngIf="row.status; else asideStatusEmpty" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset"
                [ngClass]="statusBadgeClasses[displayStatus(row)] || 'bg-gray-100 text-gray-700 ring-gray-200 border-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:ring-gray-700 dark:border-gray-700'">{{ displayStatus(row) }}</span>
            <ng-template #asideStatusEmpty><span class="text-gray-400 dark:text-gray-600">—</span></ng-template>
        </ng-template>

        <ng-template #detailMetaTemplate let-row>
            <div class="sp-meta">
                <p class="sp-meta-label">Category</p>
                <p class="sp-meta-value">{{ row.category?.departmentName }}</p>
            </div>
            <div class="sp-meta">
                <p class="sp-meta-label">Type</p>
                <p class="sp-meta-value">{{ row.supplierType }}</p>
            </div>
            <div class="sp-meta">
                <p class="sp-meta-label">Credit Limit</p>
                <p class="sp-meta-value">{{ row.creditValue | number: '1.2-2' }}</p>
            </div>
            <div class="sp-meta">
                <p class="sp-meta-label">Created</p>
                <p class="sp-meta-value">{{ row.createdDate | date: 'dd MMM yyyy' }}</p>
            </div>
        </ng-template>

        <!-- left: optional, per-tab (outline) -->
        <ng-template #detailFooterLeftTemplate let-row let-tab="tab">
            <app-action-button *ngIf="tab === 'detail'"variant="outline" (click)="openEditDrawer(row)" icon="edit">Edit</app-action-button>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'detail'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'products'">
                    <app-detail-table [columns]="productColumns" [rows]="productRows(row)" emptyMessage="No products listed."></app-detail-table>
                </ng-container>

                <ng-container *ngSwitchCase="'documents'">
                    <app-detail-documents [documents]="documentRows(row)" emptyMessage="No documents uploaded for this supplier."
                        (open)="openDocument($event)" (download)="downloadDocument($event)"></app-detail-documents>
                </ng-container>

                <ng-container *ngSwitchCase="'banking'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="bankingSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'history'">
                    <app-detail-timeline [entries]="historyEntries(row)" emptyMessage="No approval or rejection history yet."></app-detail-timeline>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>

    <!-- Create and edit share one drawer; the list only decides which mode to open it in. -->
    <app-supplier-form-drawer [open]="formOpen" [mode]="formMode" [supplier]="formSupplier"
        (saved)="getSuppliers()" (closed)="onFormClosed()"></app-supplier-form-drawer>
</div>
