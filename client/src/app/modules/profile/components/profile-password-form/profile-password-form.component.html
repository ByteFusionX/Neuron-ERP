<div class="panel p-5">
    <div class="flex items-start justify-between gap-4" [class.mb-6]="open()">
        <div class="flex items-center gap-4">
            <span class="meta-icon !w-10 !h-10 !rounded-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.03 5.91c-.56-.1-1.16.03-1.56.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.82c0-.6.24-1.17.66-1.59l6.5-6.5c.4-.4.52-1 .43-1.56A6 6 0 1 1 21.75 8.25Z"/></svg>
            </span>
            <div>
                <h3 class="section-title">Password</h3>
                <p class="muted text-xs mt-1">At least 8 characters, with a letter and a number.</p>
            </div>
        </div>
        @if (!open()) {
            <button type="button" (click)="open.set(true)" class="btn-ghost">Change</button>
        }
    </div>
    @if (open()) {
        <form class="grid grid-cols-1 md:grid-cols-3 gap-x-5 gap-y-4 fade-in" [formGroup]="form()" (ngSubmit)="submit()">
            <app-sf-field label="Current password" [control]="form().controls['oldPassword']">
                <app-sf-input formControlName="oldPassword" type="password" autocomplete="current-password" />
            </app-sf-field>
            <app-sf-field label="New password" [control]="form().controls['newPassword']"
                [messages]="{ pattern: 'Use at least one letter and one number', minlength: 'Use at least 8 characters' }">
                <app-sf-input formControlName="newPassword" type="password" autocomplete="new-password" />
                <div class="flex gap-1 mt-2" aria-hidden="true">
                    @for (i of [1, 2, 3, 4]; track i) {
                        <span class="h-1.5 flex-1 rounded-full transition-colors"
                            [class.strength-off]="strength < i"
                            [style.background]="strength >= i ? (strength <= 1 ? 'var(--pf-danger)' : strength === 2 ? 'var(--pf-warn)' : 'var(--pf-ok)') : null"></span>
                    }
                </div>
            </app-sf-field>
            <div>
                <app-sf-field label="Confirm new password" [control]="form().controls['confirmPassword']">
                    <app-sf-input formControlName="confirmPassword" type="password" autocomplete="new-password" />
                </app-sf-field>
                @if (form().controls['confirmPassword'].touched && form().hasError('mismatch')) {
                    <p class="mt-1 text-xs text-red-600 dark:text-red-400" role="alert">Passwords do not match</p>
                }
            </div>
            <div class="md:col-span-3 flex flex-wrap items-center gap-3">
                <button type="submit" [disabled]="saving()" class="btn">{{ saving() ? 'Saving…' : 'Update password' }}</button>
                <button type="button" (click)="cancel()" class="btn-ghost">Cancel</button>
            </div>
        </form>
    }
</div>
