<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Deal Sheets"
        subtitle="Track pending, approved, rejected and revoked deals"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="total"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        searchPlaceholder="Search deal, quote, customer or sales person"
        emptyMessage="No deal sheets found"
        [rowActions]="rowActions"
        [views]="views"
        [initialViewId]="activeViewId"
        [syncViewWithUrl]="false"
        (viewChange)="onViewChange($event)"
        [rowAccent]="rowAccent"
        [detailLoading]="detailLoading"
        [detailTabs]="detailTabs"
        [detailTitle]="dealTitle"
        [detailSubtitle]="dealSubtitle"
        (queryChange)="onQueryChange($event)"
        (rowOpen)="onRowOpen($event)"
        (rowAction)="onRowAction($event)">

        <ng-template #detailAsideTemplate let-row>
            <div class="flex flex-wrap items-center justify-end gap-2">
                <span *ngIf="row.dealData?.status; else asideStatusEmpty" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset"
                    [ngClass]="dealStatusBadgeClasses[row.dealData?.status] || 'bg-gray-100 text-gray-700 ring-gray-200 border-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:ring-gray-700 dark:border-gray-700'">{{ statusText(row.dealData?.status) }}</span>
                <ng-template #asideStatusEmpty><span class="text-gray-400 dark:text-gray-600">—</span></ng-template>
            </div>
        </ng-template>

        <!-- right: permanent, every tab (filled) -->
        <ng-template #detailFooterTemplate let-row let-tab="tab">
            <app-action-button variant="primary" (click)="openDealSheetView(row)" icon="view">Detail view</app-action-button>
        </ng-template>

        <ng-template #detailMetaTemplate let-row>
            <div class="dealsheet-meta"><p class="dealsheet-meta-label">Customer</p><p class="dealsheet-meta-value">{{ row.client?.companyName }}</p></div>
            <div class="dealsheet-meta"><p class="dealsheet-meta-label">Department</p><p class="dealsheet-meta-value">{{ row.department?.departmentName }}</p></div>
            <div class="dealsheet-meta"><p class="dealsheet-meta-label">Sales person</p><p class="dealsheet-meta-value">{{ row.createdBy?.firstName }} {{ row.createdBy?.lastName }}</p></div>
            <div class="dealsheet-meta"><p class="dealsheet-meta-label">Date</p><p class="dealsheet-meta-value">{{ row.dealData?.savedDate | date: 'dd MMM yyyy' }}</p></div>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'items'">
                    <app-detail-table title="Deal items" [columns]="itemColumns" [rows]="itemRows(row)" [footRows]="itemFootRows(row)" [currency]="row.currency"></app-detail-table>
                </ng-container>

                <ng-container *ngSwitchCase="'costs'">
                    <app-detail-table title="Additional costs and discounts" [columns]="costColumns" [rows]="costRows(row)" showTotals [currency]="row.currency"
                        emptyMessage="No additional costs or discounts."></app-detail-table>
                </ng-container>

                <ng-container *ngSwitchCase="'documents'">
                    <app-detail-documents
                        title="Customer LPO"
                        emptyMessage="No customer LPO files available."
                        [documents]="dealDocuments(row)"
                        (open)="onDealDocPreview(row, $event)"
                        (download)="onDealDocDownload(row, $event)"></app-detail-documents>
                </ng-container>

                <ng-container *ngSwitchCase="'comments'">
                    <app-detail-comments
                        [comments]="dealComments(row)"
                        emptyMessage="No deal comments recorded yet."></app-detail-comments>
                </ng-container>

                <ng-container *ngSwitchCase="'history'">
                    <app-detail-timeline
                        [entries]="(historyFor(row) | async) ?? []"
                        emptyMessage="No history recorded yet."></app-detail-timeline>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>
</div>

<app-update-dealsheet [open]="updateOpen" [data]="updateData" (saved)="onUpdateSaved($event)" (closed)="updateOpen = false"></app-update-dealsheet>
