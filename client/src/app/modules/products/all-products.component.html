<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Products"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="total"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        searchPlaceholder="Search by item code, part no, name..."
        emptyMessage="No products found"
        createLabel="Create Product"
        [rowActions]="rowActions"
        [views]="views"
        (viewChange)="onViewChange($event)"
        [bulkActions]="bulkActions"
        storageKey="all-products-list"
        exportable
        exportFileName="products.xlsx"
        [detailTabs]="detailTabs"
        [detailTitle]="productTitle"
        [detailSubtitle]="productSubtitle"
        (queryChange)="onQueryChange($event)"
        (exportRequest)="onExportAll()"
        (rowAction)="onRowAction($event)"
        (bulkAction)="onBulkAction($event, grid)"
        (create)="onCreateProduct()">

        <div dgToolbarExtra class="flex items-center gap-2">
            <button type="button" (click)="openImport()" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-[13px] font-medium text-gray-700 hover:bg-gray-50 dark:border-erp-border-dark dark:bg-erp-surface-dark dark:text-gray-200">Import</button>
            <button type="button" (click)="openDuplicatesReport()" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-[13px] font-medium text-gray-700 hover:bg-gray-50 dark:border-erp-border-dark dark:bg-erp-surface-dark dark:text-gray-200">Duplicates</button>
        </div>

        <ng-template #detailAsideTemplate let-row>
            <app-status-pill [status]="row.isActive ? 'Active' : 'Inactive'" [toneMap]="activeTones"></app-status-pill>
        </ng-template>

        <ng-template #detailMetaTemplate let-row>
            <div class="pd-meta">
                <p class="pd-meta-label">Category</p>
                <p class="pd-meta-value">{{ row.productCategory?.categoryName }}</p>
            </div>
            <div class="pd-meta">
                <p class="pd-meta-label">Warehouse</p>
                <p class="pd-meta-value">{{ row.warehouse?.wareHouseName }}</p>
            </div>
            <div class="pd-meta">
                <p class="pd-meta-label">Selling Price</p>
                <p class="pd-meta-value">{{ row.defaultSellingPrice }}</p>
            </div>
            <div class="pd-meta">
                <p class="pd-meta-label">Created</p>
                <p class="pd-meta-value">{{ row.createdDate | date: 'dd MMM yyyy' }}</p>
            </div>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'pricing'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="pricingSections(row)"></app-detail-overview>
                </ng-container>

                <app-detail-related-list *ngSwitchCase="'suppliers'"
                    [items]="(suppliersFor(row) | async) ?? []"
                    emptyMessage="No suppliers linked to this product."></app-detail-related-list>

                <app-detail-timeline *ngSwitchCase="'history'"
                    [entries]="(historyFor(row) | async) ?? []"
                    emptyMessage="No history recorded yet."></app-detail-timeline>
            </ng-container>
        </ng-template>
    </app-data-grid>

    <app-product-form-drawer
        [open]="formOpen"
        [mode]="formMode"
        [product]="formProduct"
        (saved)="onFormSaved()"
        (closed)="onFormClosed()">
    </app-product-form-drawer>
</div>
