<div class="bg-white max-h-[90vh] overflow-y-auto w-[640px]">
  <div class="border-b border-gray-300 px-6 py-4 flex justify-between items-center">
    <h3 class="text-lg font-medium text-gray-800">Create Part No.</h3>
    <button
      class="bg-gray-200 rounded-lg p-1 flex items-center justify-center hover:bg-gray-300 transition-colors -mr-2"
      (click)="onCancel()">
      <ng-icon name="heroXMark" class="text-lg"></ng-icon>
    </button>
  </div>

  <div class="p-6">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <app-form-field
            label="Part No"
            [control]="productForm.get('partNo')"
            [isSubmitted]="isSubmitting"
            placeholder="Manual Entry">
          </app-form-field>

          <app-form-field
            label="Date"
            [control]="productForm.get('createdDate')"
            [isSubmitted]="isSubmitting"
            type="date">
          </app-form-field>
        </div>

        <app-form-field
          label="Product Description"
          [control]="productForm.get('productDescription')"
          [isSubmitted]="isSubmitting"
          type="textarea"
          placeholder="Enter product description">
        </app-form-field>

        <app-select-dropdown
          label="Product Segment"
          [options]="departments"
          optionLabel="departmentName"
          optionValue="_id"
          formControlName="productSegment"
          placeholder="Auto fill"
          [isSubmitted]="isSubmitting">
        </app-select-dropdown>

        <app-select-dropdown
          label="Product Category"
          [options]="categories"
          optionLabel="categoryName"
          optionValue="_id"
          formControlName="productCategory"
          placeholder="Select category"
          [isSubmitted]="isSubmitting"
          footerLabel="+ Add category"
          (footerAction)="onAddCategory()">
        </app-select-dropdown>

        <app-select-dropdown
          label="Target Warehouse"
          [options]="warehouses"
          optionLabel="wareHouseName"
          optionValue="_id"
          formControlName="warehouse"
          placeholder="Select warehouse"
          [isSubmitted]="isSubmitting"
          footerLabel="+ Add warehouse"
          (footerAction)="onAddWarehouse()">
        </app-select-dropdown>
      </div>
  
      <div class="border-t border-gray-200 mt-6 pt-4 flex justify-end gap-3">
        <app-btn theme="cancel" type="button" (buttonClick)="onCancel()">Cancel</app-btn>
        <app-btn theme="primary" type="submit" [loading]="isSubmitting">Save & Exit</app-btn>
      </div>
    </form>
  </div>
</div>
