<div class="bg-white rounded-lg w-full max-w-2xl">
  <div class="border-b p-4 px-6 flex justify-between items-center">
    <h3 class="text-lg font-medium text-gray-800">Block Item</h3>
    <button
      type="button"
      class="text-gray-400 hover:text-gray-600"
      (click)="onCancel()">
      <ng-icon name="heroXMark" class="w-5 h-5"></ng-icon>
    </button>
  </div>
  <div class="p-6">
    <form [formGroup]="blockForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <app-form-field
          label="Salesperson Name"
          [control]="blockForm.get('salesPersonName')"
          [isSubmitted]="isSubmitting"
          placeholder="Salesperson name"
          [readonly]="true">
        </app-form-field>

        <app-select-dropdown
          label="Blocked For (Customer)"
          [options]="customers"
          optionLabel="companyName"
          optionValue="_id"
          formControlName="customerId"
          placeholder="Select customer"
          [isSubmitted]="isSubmitting"
          footerLabel="+ Create Customer"
          (footerAction)="createCustomer()">
        </app-select-dropdown>

        <app-form-field
          label="Available qty"
          [control]="blockForm.get('availableQuantity')"
          [isSubmitted]="isSubmitting"
          type="number"
          placeholder="Available quantity"
          [readonly]="true">
        </app-form-field>

        <app-form-field
          label="QTY required"
          [control]="blockForm.get('quantity')"
          [isSubmitted]="isSubmitting"
          type="number"
          placeholder="Enter quantity required"
          (input)="onQuantityChange()">
        </app-form-field>

        <div class="grid grid-cols-2 gap-4">
          <app-form-field
            label="From Date"
            [control]="blockForm.get('fromDate')"
            [isSubmitted]="isSubmitting"
            type="date"
            placeholder="Select from date">
          </app-form-field>

          <app-form-field
            label="To Date"
            [control]="blockForm.get('toDate')"
            [isSubmitted]="isSubmitting"
            type="date"
            placeholder="Select to date">
          </app-form-field>
        </div>
      </div>

      <div class="border-t border-gray-200 mt-6 pt-4 flex justify-end gap-3">
        <app-btn theme="cancel" type="button" (buttonClick)="onCancel()">Discard</app-btn>
        <app-btn theme="primary" type="submit" [loading]="isSubmitting">Save & Exit</app-btn>
      </div>
    </form>
  </div>
</div>
