<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Purchase Requests"
        subtitle="Track and manage purchase requests"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="total"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        searchPlaceholder="Search PR no, customer, job or supplier"
        emptyMessage="No purchase requests found"
        [rowActions]="rowActions"
        [views]="views"
        [initialViewId]="activeViewId"
        [syncViewWithUrl]="false"
        storageKey="purchase-request-list"
        [detailLoading]="detailLoading"
        [detailTabs]="detailTabs"
        [detailTitle]="prTitle"
        [detailSubtitle]="prSubtitle"
        (queryChange)="onQueryChange($event)"
        (rowOpen)="onRowOpen()"
        (rowAction)="onRowAction($event)">

        <ng-template #detailMetaTemplate let-row>
            <div class="pr-meta">
                <p class="pr-meta-label">Customer</p>
                <p class="pr-meta-value">{{ row.customerId?.companyName }}</p>
            </div>
            <div class="pr-meta">
                <p class="pr-meta-label">Job ID</p>
                <p class="pr-meta-value">{{ row.jobId?.jobId || '-' }}</p>
            </div>
            <div class="pr-meta">
                <p class="pr-meta-label">Amount</p>
                <p class="pr-meta-value">{{ formatAmount(row) }}</p>
            </div>
            <div class="pr-meta">
                <p class="pr-meta-label">Date</p>
                <p class="pr-meta-value">{{ (row.approvedDate || row.createdAt) | date: 'dd MMM yyyy' }}</p>
            </div>
        </ng-template>

        <!-- right: permanent, every tab (filled) -->
        <ng-template #detailFooterTemplate let-row>
            <app-action-button *ngIf="canEdit(row)" variant="primary" (click)="onEditPr(row, $event)" icon="edit">Edit</app-action-button>
            <app-action-button *ngIf="canCreateFromJob(row)" variant="primary" (click)="onCreatePrForJob(row, $event)" icon="plus">Create PR</app-action-button>
            <app-action-button variant="primary" (click)="openFullPurchase(row, $event)" icon="view">Detail view</app-action-button>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'items'">
                    <app-detail-table title="Line items" [columns]="itemColumns" [rows]="itemRows(row)" showTotals [currency]="row.currency"></app-detail-table>
                </ng-container>

                <ng-container *ngSwitchCase="'approval'">
                    <app-approval-journey [stages]="approvalJourney(row)" orientation="vertical" [rejectionNote]="null"></app-approval-journey>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>
</div>

<!-- Mounted only while open, so each opening starts a fresh form. -->
<app-create-purchase *ngIf="createDrawerOpen" [drawer]="true" [withoutJob]="false" [sourceLocked]="true" [initialJobId]="createDrawerJobId"
    (saved)="onCreateDrawerSaved()" (closed)="onCreateDrawerClosed()"></app-create-purchase>

<!-- Mounted only while open, so each opening starts from a fresh load of that PR. -->
<app-create-purchase *ngIf="editDrawerOpen" [drawer]="true" [editPurchaseId]="editDrawerPurchaseId" [sourceLocked]="true"
    (saved)="onEditDrawerSaved()" (closed)="onEditDrawerClosed()"></app-create-purchase>

<app-initiate-lpo *ngIf="initiateLpoPurchaseId" [purchaseIdInput]="initiateLpoPurchaseId" (issued)="onInitiateLpoIssued()" (closed)="onInitiateLpoClosed()"></app-initiate-lpo>
