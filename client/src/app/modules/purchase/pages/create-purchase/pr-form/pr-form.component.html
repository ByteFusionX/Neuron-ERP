<form [formGroup]="purchaseForm" class="space-y-4" (ngSubmit)="$event.preventDefault()">
  <!-- Items = every line; one tab per supplier narrows the lines to that supplier -->
  <!-- Only the choices a new PR still has to make; everything else is in the drawer header -->
  <div *ngIf="!isEditing && !sourceLocked" class="grid items-end gap-x-6 gap-y-3 sm:grid-cols-3">
    <app-sf-switch
      label="Create without a job"
      [ngModel]="isJobLess"
      (ngModelChange)="jobLessChange.emit($event)"
      [ngModelOptions]="{ standalone: true }"
    ></app-sf-switch>
    <app-sf-field *ngIf="!isJobLess" label="Job" required class="sm:col-span-2">
      <app-sf-combobox
        [options]="jobOptions()"
        placeholder="Search job ID"
        [ngModel]="requestedJobId()"
        (ngModelChange)="jobSelected.emit($event)"
        [ngModelOptions]="{ standalone: true }"
      ></app-sf-combobox>
    </app-sf-field>
  </div>

  <div *ngIf="selectedJobSheet || isJobLess" class="flex flex-nowrap items-center gap-6 border-b border-gray-100 dark:border-erp-border-dark pb-3">
    <div class="flex min-w-0 flex-1 items-center gap-1">
    <button
      type="button"
      class="grid h-7 w-7 shrink-0 place-content-center rounded-lg border border-gray-200 dark:border-erp-border-dark text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent"
      [disabled]="!canScrollLeft"
      aria-label="Scroll tabs left"
      (click)="tabStrip.scrollBy({ left: -200, behavior: 'smooth' })"
    >
      <ng-icon name="heroChevronLeft" class="h-3.5 w-3.5"></ng-icon>
    </button>
    <div #tabStrip data-tab-strip (scroll)="updateStripScroll()" (wheel)="onStripWheel($event)" class="flex min-w-0 flex-1 flex-nowrap items-center gap-1 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden [&>*]:shrink-0">
      <button
        type="button"
        class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors"
        [ngClass]="shownTab === 'items' ? 'border-violet-600 bg-violet-600 text-white' : 'border-gray-200 dark:border-erp-border-dark text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
        (click)="pickTab('items')"
      >
        Items
        <span class="rounded-full px-1.5 text-[10px] tabular-nums" [ngClass]="shownTab === 'items' ? 'bg-white/20' : 'bg-gray-100 dark:bg-gray-800'">{{ itemCount() }}</span>
      </button>
      <div
        *ngFor="let t of supplierTabs"
        class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors"
        [ngClass]="shownTab === t.id ? 'border-violet-600 bg-violet-600 text-white' : 'border-gray-200 dark:border-erp-border-dark text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'"
      >
        <button type="button" class="inline-flex items-center gap-1.5" (click)="pickTab(t.id)">
          <span class="max-w-[7rem] truncate">{{ t.name }}</span>
          <span class="rounded-full px-1.5 text-[10px] tabular-nums" [ngClass]="shownTab === t.id ? 'bg-white/20' : 'bg-gray-100 dark:bg-gray-800'">{{ t.count }}<ng-container *ngIf="t.total != null">/{{ t.total }}</ng-container></span>
        </button>
        <button
          *ngIf="selectedKeys.length && shownTab === 'items' && !readOnly"
          type="button"
          class="-mr-1 grid h-4 w-4 place-content-center rounded hover:bg-black/10"
          [attr.aria-label]="'Add ' + selectedKeys.length + ' selected item(s) to ' + t.name"
          [title]="'Add ' + selectedKeys.length + ' selected to ' + t.name"
          (click)="addToSupplier(t.id)"
        >
          <ng-icon name="heroPlus" class="h-3 w-3"></ng-icon>
        </button>
        <button
          *ngIf="t.closable && !(selectedKeys.length && shownTab === 'items' && !readOnly)"
          type="button"
          class="-mr-1 grid h-4 w-4 place-content-center rounded hover:bg-black/10"
          aria-label="Close supplier tab"
          (click)="supplierClosed.emit(t.id)"
        >
          <ng-icon name="heroXMark" class="h-3 w-3"></ng-icon>
        </button>
      </div>
    </div>
    <button
      type="button"
      class="grid h-7 w-7 shrink-0 place-content-center rounded-lg border border-gray-200 dark:border-erp-border-dark text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent"
      [disabled]="!canScrollRight"
      aria-label="Scroll tabs right"
      (click)="tabStrip.scrollBy({ left: 200, behavior: 'smooth' })"
    >
      <ng-icon name="heroChevronRight" class="h-3.5 w-3.5"></ng-icon>
    </button>
    </div>
    <div *ngIf="!readOnly" class="ml-auto flex shrink-0 items-center gap-2">
      <app-sf-combobox
        class="w-56"
        [options]="freeSuppliers"
        [(ngModel)]="compareSupplierId"
        [ngModelOptions]="{ standalone: true }"
        [disabled]="!selectedKeys.length"
        placeholder="Select supplier"
        aria-label="Supplier to compare"
      ></app-sf-combobox>
      <app-action-button variant="ghost" [disabled]="!selectedKeys.length || !compareSupplierId" (click)="addCompare()">
        <ng-icon name="heroPlus" class="h-3.5 w-3.5"></ng-icon> Compare<ng-container *ngIf="selectedKeys.length"> ({{ selectedKeys.length }})</ng-container>
      </app-action-button>
    </div>
  </div>

  <!-- Read-only once the request has left In Progress: item-entry makes the lines inert but keeps its search/filter/density toolbar live. -->
  <div *ngIf="selectedJobSheet || isJobLess; else noJob">
    <div *ngIf="switching" class="pr-skeleton space-y-2" aria-busy="true" aria-label="Loading items">
      <div *ngFor="let r of skeletonRows" class="flex items-center gap-3">
        <span class="pr-sk h-8 w-8 rounded"></span>
        <span class="pr-sk h-8 flex-1 rounded"></span>
        <span class="pr-sk h-8 w-20 rounded"></span>
        <span class="pr-sk h-8 w-24 rounded"></span>
      </div>
    </div>
    <div [class.hidden]="switching">
    <app-item-entry
      mode="purchase"
      [quoteLayout]="true"
      [externalAddButtons]="externalAddButtons"
      paletteTargetLabel="Purchase request"
      [optionalItems]="entryItems"
      [seedOptionalItems]="entrySeed()"
      [currency]="currency() || 'QAR'"
      [supplierOptions]="supplierOptions()"
      [allowCreateProduct]="true"
      [bulkSelect]="true"
      [readOnly]="readOnly"
      [flat]="true"
      [lineLocked]="lineLocked"
      [lineHardLocked]="lineHardLocked"
      [lineFixed]="lineFixed"
      [lineMinQty]="lineMinQty"
      [discountFloor]="discountFloor"
      [lineAwarded]="lineAwarded"
      [lineBadge]="lineBadge"
      [linePills]="linePills"
      (pillClicked)="pillPicked.emit($event)"
      [lineOffers]="lineOffers"
      [lineDeal]="lineDeal"
      [supplierScope]="activeTab === 'items' ? null : activeTab"
      [supplierDiscounts]="purchaseForm.get('supplierDiscounts')?.value?.suppliers ?? null"
      [dealSupplierDiscounts]="dealSupplierDiscounts"
      [dealExtraCosts]="dealExtraCosts"
      [jobTotals]="jobTotals"
      [prExtraCosts]="prExtraCosts"
      [customerDiscountTotal]="customerDiscountTotal"
      [supplierScopeName]="activeTab === 'items' ? '' : activeTabName"
      [scopeLineKeys]="tabLineKeys"
      [scopeExcludedKeys]="tabExcludedKeys"
      (removeFromTab)="linesRemovedFromTab.emit($event)"
      (awardToTab)="linesAwardedToTab.emit($event)"
      (offerPicked)="offerPicked.emit($event)"
      (addToTab)="linesAddedToTab.emit($event)"
      (supplierDiscountEdited)="supplierDiscountEdited.emit($event)"
      (createProductRequested)="createProductRequested.emit($event)"></app-item-entry>
    </div>
  </div>

  <ng-template #noJob>
    <div class="pr-empty-state">{{ requestedJobId() || isEditing ? 'Loading the job’s items…' : 'Select a job to load its items.' }}</div>
  </ng-template>
</form>
