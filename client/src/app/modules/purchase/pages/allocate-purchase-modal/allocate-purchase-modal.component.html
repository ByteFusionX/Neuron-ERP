<app-form-modal-shell
  icon="user-round-check"
  tone="sky"
  title="Allocate purchase"
  contextLabel="PR"
  [context]="data?.purchaseNo"
  contextEmptyText="Choose who works on this purchase request."
  formId="allocate-purchase-form"
  [invalid]="form.invalid && submitted"
  invalidText="Select an employee"
  submitLabel="Allocate"
  submitIcon="check"
  submitShortcutVerb="allocate"
  (closed)="close()">
  <form id="allocate-purchase-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-sf-section title="Purchase" columns="1">
      <app-sf-field label="Allocate to" [control]="form.controls.employee">
        <app-sf-combobox
          formControlName="employee"
          [options]="employeeOptions"
          placeholder="Select employee"></app-sf-combobox>
      </app-sf-field>
    </app-sf-section>
  </form>
</app-form-modal-shell>
