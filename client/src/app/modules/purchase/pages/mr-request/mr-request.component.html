<div class="flex max-h-[90vh] flex-col bg-white text-gray-900 dark:bg-erp-surface-dark dark:text-gray-100">
  <header class="flex items-start gap-3 border-b border-gray-100 px-6 py-4 dark:border-erp-border-dark">
    <span class="grid h-9 w-9 shrink-0 place-content-center rounded-lg bg-violet-50 text-violet-600 ring-1 ring-inset ring-violet-100 dark:bg-violet-950/40 dark:text-violet-400 dark:ring-violet-900">
      <app-dp-icon name="send" size="w-5 h-5"></app-dp-icon>
    </span>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <h2 class="text-base font-semibold leading-6">MR request</h2>
        <app-detail-badge *ngIf="hasMrRequest()" label="Requested" tone="active" dot></app-detail-badge>
      </div>
      <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Ask an engineer to raise a material request for this purchase.</p>
    </div>
    <button type="button" (click)="onCloseClicks()" aria-label="Close"
      class="grid h-8 w-8 place-content-center rounded-md text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-gray-800 dark:hover:text-gray-200">
      <app-dp-icon name="close" size="w-4 h-4"></app-dp-icon>
    </button>
  </header>

  <form id="mr-request-form" [formGroup]="mrForm" (ngSubmit)="onSubmit()" novalidate class="space-y-4 overflow-y-auto px-6 py-5">
    <app-sf-field label="Engineer" [control]="f['engineer']">
      <app-sf-combobox formControlName="engineer" [options]="employeeOptions" placeholder="Search engineer"></app-sf-combobox>
    </app-sf-field>
    <app-sf-field label="Total proposed amount in customer LPO" [control]="f['totalPurchase']" optional>
      <app-sf-number formControlName="totalPurchase" placeholder="0.00" [stepper]="false"></app-sf-number>
    </app-sf-field>
    <app-sf-field label="Message" [control]="f['message']">
      <app-sf-textarea formControlName="message" placeholder="What does the engineer need to request?" [rows]="3" autoresize></app-sf-textarea>
    </app-sf-field>
  </form>

  <footer class="flex items-center justify-between gap-2 border-t border-gray-100 bg-gray-50/70 px-6 py-3 dark:border-erp-border-dark dark:bg-black/20">
    <app-action-button variant="ghost" [disabled]="!hasMrRequest() || isSaving()" (click)="onClearClicks()">Clear request</app-action-button>
    <div class="flex gap-2">
      <app-action-button variant="secondary" (click)="onCloseClicks()">Cancel</app-action-button>
      <app-action-button variant="primary" type="submit" form="mr-request-form" [disabled]="isSaving()">{{ isSaving() ? 'Saving…' : 'Send request' }}</app-action-button>
    </div>
  </footer>
</div>
