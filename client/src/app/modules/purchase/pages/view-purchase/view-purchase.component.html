<div class="flex h-full flex-col p-6 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-detail-view-shell
    class="min-h-0 flex-1"
    [loading]="isLoading"
    [empty]="!isLoading && !purchase"
    emptyTitle="Purchase request not found"
    emptyMessage="It may have been deleted, or you may not have access to it."
    [emptyLink]="['/purchase/pr']"
    emptyLinkLabel="Back to purchase requests"
    [breadcrumbs]="breadcrumbs"
    [avatarText]="avatarText"
    [title]="purchase?.purchaseNo || ''"
    [badges]="badges"
    [subtitle]="subtitle"
    [stats]="stats"
    [tabs]="tabs"
    [activeTab]="tab"
    (activeTabChange)="tab = $event"
    [sections]="sidebarSections"
  >
    <ng-container headerActions *ngIf="purchase as p">
      <app-action-button *ngIf="p.status === 'Rejected' && p.rejectedReason?.length" (click)="showStatusHistory()">View reason</app-action-button>
      <app-action-button *ngIf="dealId" (click)="onViewDealSheet()">Deal sheet {{ dealId }}</app-action-button>

      <ng-container *ngIf="p.status === 'Pending'">
        <app-action-button *ngIf="!isManual && hasNewItemsToMerge()" [disabled]="isMerging" (click)="onMergeItems()">
          {{ isMerging ? 'Merging…' : 'Merge items' }}
        </app-action-button>
        <app-action-button *ngIf="!isManual && hasMergedItems()" [disabled]="isRevoking" (click)="onRevokeMerge()">
          {{ isRevoking ? 'Revoking…' : 'Revoke merge' }}
        </app-action-button>
        <ng-container *ngIf="canApproveOrReject()">
          <app-action-button [disabled]="isRejecting" (click)="onReject()">{{ isRejecting ? 'Rejecting…' : 'Reject' }}</app-action-button>
          <app-action-button variant="primary" [disabled]="isApproving" (click)="onApprove()">{{ isApproving ? 'Approving…' : 'Approve' }}</app-action-button>
        </ng-container>
      </ng-container>

      <app-action-button *ngIf="purchaseId !== 'none' && p.status !== 'Pending'" variant="primary" (click)="onEdit()">Edit</app-action-button>
    </ng-container>

    <div tabBody [ngSwitch]="tab">
      <div *ngSwitchCase="'items'">
        <app-detail-table
          title="Line items"
          [columns]="itemColumns"
          [rows]="itemRows"
          [currency]="purchase?.currency || 'QAR'"
          numbered
          showTotals
          spread
          emptyMessage="No supplier selected"
        ></app-detail-table>
      </div>

      <div *ngSwitchCase="'summary'" class="space-y-6">
        <app-detail-metrics [items]="summaryMetrics"></app-detail-metrics>
      </div>

      <div *ngSwitchCase="'history'">
        <app-detail-timeline [entries]="historyEntries" emptyMessage="No approval history yet."></app-detail-timeline>
      </div>
    </div>
  </app-detail-view-shell>
</div>
