<data-table
[data]="tableData()"
[columns]="tableColumns"
[defaultColumns]="defaultColumns"
[isLoading]="isLoading()"
[isEmpty]="isEmpty()"
[totalItems]="totalItems()"
[tableId]="'pending-pr-table'"
(filterChange)="onFilterChange($event)"
(paginationChange)="onPaginationChange($event)"
(rowClick)="onRowClick($event)"
(actionClick)="onActionClick($event)"
[title]="'Pending PR'"
>
<ng-template #sideColumn>
    <div class="flex items-center gap-3">
        <button type="button"
            class="px-3 py-1.5 rounded-md border text-sm font-medium transition-colors"
            [ngClass]="sourceTypeView() === 'manual' ? 'bg-white text-violet-600 border-violet-600 ring-2 ring-violet-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
            (click)="setSourceTypeView(sourceTypeView() === 'manual' ? 'job' : 'manual')">General Purchase</button>
        <app-btn theme="primary" (click)="goToCreatePr()">+ Create PR</app-btn>
    </div>
</ng-template>
</data-table>
