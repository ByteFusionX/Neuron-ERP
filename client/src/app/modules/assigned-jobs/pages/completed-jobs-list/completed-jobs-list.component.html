<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Completed Jobs"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        [totalCount]="total"
        emptyMessage="No Data"
        [rowActions]="rowActions"
        storageKey="completed-jobs-list"
        [detailLoading]="detailLoading"
        [detailTabs]="detailTabs"
        [detailTitle]="rowTitle"
        [detailSubtitle]="rowSubtitle"
        (rowOpen)="onRowOpen($event)"
        (rowAction)="onRowAction($event)"
        (queryChange)="onQueryChange($event)">

        <ng-template #detailMetaTemplate let-row>
            <div class="qt-meta">
                <p class="qt-meta-label">Customer</p>
                <p class="qt-meta-value">{{ row.client?.[0]?.companyName }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Department</p>
                <p class="qt-meta-value">{{ row.department?.[0]?.departmentName }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Assigned By</p>
                <p class="qt-meta-value">{{ row.salesPerson?.[0]?.firstName }} {{ row.salesPerson?.[0]?.lastName }}</p>
            </div>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'comments'">
                    <app-detail-comments [comments]="commentsFor(row)" emptyMessage="No comments for this job."></app-detail-comments>
                </ng-container>

                <ng-container *ngSwitchCase="'documents'">
                    <app-detail-documents
                        title="Presale Files"
                        emptyMessage="No files uploaded yet."
                        [documents]="presaleDocuments(row)"
                        (open)="onDocPreview(row, $event)"
                        (download)="onDocDownload(row, $event)"></app-detail-documents>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>

    <app-view-estimation [open]="!!estimationTarget" [estimation]="estimationTarget?.estimation ?? null" [enquiryId]="estimationTarget?.enqId ?? ''" (closed)="estimationTarget = null"></app-view-estimation>
</div>
