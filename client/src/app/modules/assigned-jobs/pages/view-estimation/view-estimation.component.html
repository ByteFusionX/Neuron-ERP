<app-sf-drawer title="Estimations" width="1100px" [open]="open" (closed)="closed.emit()">

    <ng-container *ngIf="estimation">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div *ngIf="options.length > 1" class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Option</span>
                <button *ngFor="let o of options; let i = index" type="button"
                    class="rounded-full border px-3 py-1 text-[13px] transition-colors"
                    [ngClass]="i === selectedOption
                        ? 'border-violet-600 bg-violet-600 text-white'
                        : 'border-gray-300 dark:border-erp-border-dark text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-white/5'"
                    (click)="selectedOption = i">Option {{ i + 1 }}</button>
            </div>

            <div class="flex items-center gap-1 rounded-lg border border-gray-200 p-1 dark:border-erp-border-dark">
                <button type="button" class="rounded-md px-3 py-1.5 text-[13px] font-medium transition-colors"
                    [ngClass]="tab === 'items' ? 'bg-violet-600 text-white' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/5'"
                    (click)="tab = 'items'">Items</button>
                <button type="button" class="rounded-md px-3 py-1.5 text-[13px] font-medium transition-colors"
                    [ngClass]="tab === 'summary' ? 'bg-violet-600 text-white' : 'text-gray-600 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/5'"
                    (click)="tab = 'summary'">Summary</button>
            </div>
        </div>

        <!-- items -->
        <div *ngIf="tab === 'items'">
            <app-detail-table [columns]="itemCols" [rows]="itemRows" groupStyle="band" numbered groupTotals spread centerGroups
                emptyMessage="No items in this option."></app-detail-table>
        </div>

        <!-- summary -->
        <div *ngIf="tab === 'summary'" class="space-y-6">
            <div class="grid gap-6 lg:grid-cols-2">
                <app-detail-section title="Cost Summary">
                    <app-detail-field label="Total Cost" numeric>{{ totalCost | numberFormatter }}</app-detail-field>
                    <app-detail-field label="Total Selling price" numeric>{{ sellingPrice | numberFormatter }}</app-detail-field>
                    <app-detail-field label="Profit Margin" numeric>{{ profitAmount | numberFormatter }}</app-detail-field>
                    <app-detail-field label="Profit margin with %" numeric>{{ profitPercent.toFixed(2) }}%</app-detail-field>
                </app-detail-section>
                <app-detail-section title="Price Summary">
                    <app-detail-field label="Subtotal" numeric>{{ sellingPrice | numberFormatter }}</app-detail-field>
                    <app-detail-field label="Discount" numeric>{{ discount | numberFormatter }}</app-detail-field>
                    <app-detail-field label="Total Amount" numeric>{{ netAmount | numberFormatter }}</app-detail-field>
                </app-detail-section>
            </div>

            <app-detail-clause-list [clauses]="noteClauses" emptyMessage="No presale note added."></app-detail-clause-list>
        </div>
    </ng-container>

    <ng-container sfDrawerFooter>
        <app-action-button variant="secondary" (click)="closed.emit()">Close</app-action-button>
        <ng-container *ngIf="editable">
            <app-action-button variant="secondary" (click)="onClear()">Clear Estimation</app-action-button>
            <app-action-button variant="primary" (click)="onEdit()">Edit</app-action-button>
        </ng-container>
    </ng-container>
</app-sf-drawer>
