<app-sf-drawer
    [title]="drawerTitle"
    [subtitle]="drawerSubtitle"
    width="min(1100px, 96vw)"
    [open]="open"
    [dirty]="form.dirty"
    (closed)="cancel()">
    <form id="pi-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <section class="mb-5 rounded-xl border border-gray-200 bg-gray-50 px-4 pt-3 dark:border-erp-border-dark dark:bg-gray-900/60">
            <div class="flex items-baseline justify-between gap-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300">Summary cost</h3>
                <p class="text-xs text-gray-500">{{ items.length }} {{ items.length === 1 ? 'line' : 'lines' }} from the job deal sheet · {{ currency() }}</p>
            </div>
            <dl class="mt-2 grid grid-cols-2 sm:grid-cols-4">
                @for (s of summaryStats(); track s.label) {
                    <div class="py-2.5 pr-4">
                        <dt class="text-[11px] text-gray-500 dark:text-gray-400">{{ s.label }}</dt>
                        <dd class="mt-0.5 text-sm font-semibold tabular-nums" [ngClass]="s.strong ? 'text-violet-700 dark:text-violet-300' : 'text-gray-900 dark:text-gray-100'">{{ s.value | number:'1.2-2' }}</dd>
                    </div>
                }
            </dl>
        </section>

        <app-sf-section title="Proforma details" columns="3">
            <app-sf-field label="PI No" [control]="f['piNo']">
                <app-sf-input formControlName="piNo" readonly placeholder="Issued on save"></app-sf-input>
            </app-sf-field>
            <app-sf-field label="Job" [control]="f['job']">
                <app-sf-combobox formControlName="job" [options]="jobOptions()" placeholder="Select a job" emptyText="No billable jobs"></app-sf-combobox>
            </app-sf-field>
            <app-sf-field label="Client" [control]="f['clientName']">
                <app-sf-input formControlName="clientName" readonly></app-sf-input>
            </app-sf-field>
            <app-sf-field label="Attention" optional [control]="f['attention']">
                <app-sf-input formControlName="attention" placeholder="Contact person"></app-sf-input>
            </app-sf-field>
            <app-sf-field label="Payment Terms" [control]="f['paymentTerms']">
                <app-sf-input formControlName="paymentTerms" placeholder="e.g. 100% Advance"></app-sf-input>
            </app-sf-field>
            <app-sf-field label="Ship To" optional [control]="f['shipTo']">
                <app-sf-input formControlName="shipTo" placeholder="Delivery location"></app-sf-input>
            </app-sf-field>
            <app-sf-field label="LPO No" optional [control]="f['lpoNo']">
                <app-sf-input formControlName="lpoNo" placeholder="Customer PO number"></app-sf-input>
            </app-sf-field>
            <app-sf-field label="Subject" optional [control]="f['subject']">
                <app-sf-input formControlName="subject" placeholder="Subject"></app-sf-input>
            </app-sf-field>
        </app-sf-section>

        <app-sf-section title="Payment details" description="Amount and date the payment is expected as per the payment terms" columns="3">
            <app-sf-field label="Expected Amount" [control]="f['expectedAmount']">
                <app-sf-number formControlName="expectedAmount" [stepper]="false" [decimals]="2" [min]="0" [suffix]="currency()"></app-sf-number>
            </app-sf-field>
            <app-sf-field label="Expected Date" [control]="f['expectedDate']">
                <app-sf-date formControlName="expectedDate" typeable displayFormat="dd/MM/yyyy"></app-sf-date>
            </app-sf-field>
        </app-sf-section>
    </form>

    <ng-container sfDrawerFooter>
        <app-action-button variant="secondary" (click)="cancel()">Cancel</app-action-button>
        <app-action-button variant="primary" type="submit" form="pi-form" [disabled]="saving()">
            {{ saving() ? 'Saving...' : (pi ? 'Update PI' : 'Create PI') }}
        </app-action-button>
    </ng-container>
</app-sf-drawer>
