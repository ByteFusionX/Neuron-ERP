<div class="h-full flex flex-col p-5 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid
    #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Customer Bills"
    subtitle="Proforma invoices for pending and on hold jobs"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [serverSide]="true"
    [totalCount]="total"
    [data]="rows"
    [columns]="columns"
    [loading]="isLoading"
    [pageSize]="pageSize"
    searchPlaceholder="Search by job, PI no, client, or LPO"
    emptyMessage="Nothing to show here yet"
    [views]="views"
    [detailTabs]="detailTabs"
    [detailTitle]="title"
    [detailSubtitle]="subtitle"
    [createLabel]="canCreate ? 'Create PI' : ''"
    (create)="openDrawer(null, null)"
    [rowActions]="rowActions"
    (rowAction)="onRowAction($event)"
    exportable
    exportFileName="customer-bills.xlsx"
    (queryChange)="onQueryChange($event)">

    <ng-template #detailMetaTemplate let-row>
      <app-detail-meta panelMeta [items]="metaFor(row)" [currency]="currencyOf(row)"></app-detail-meta>
    </ng-template>

    <ng-template #detailTemplate let-row let-tab="tab">
      <ng-container [ngSwitch]="tab">
        <app-detail-overview *ngSwitchCase="'overview'" [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
        <app-detail-timeline *ngSwitchCase="'history'" [entries]="(historyFor(row) | async) ?? []"
          emptyMessage="No history yet. It starts once a proforma invoice is created."></app-detail-timeline>
      </ng-container>
    </ng-template>
  </app-data-grid>
</div>

<app-pi-form-drawer
  [open]="drawerOpen"
  [job]="drawerJob"
  [pi]="drawerPi"
  (saved)="onDrawerSaved()"
  (closed)="closeDrawer()">
</app-pi-form-drawer>
