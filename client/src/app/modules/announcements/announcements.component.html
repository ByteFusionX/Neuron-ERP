<div class="w-full min-w-96">
  <!-- Header Section -->
  <div class="flex items-center justify-between p-4 border-b">
    <div class="flex items-center">
      <ng-icon name="heroMegaphone" class="text-lg"></ng-icon>
      <span class="ml-2 text-sm font-semibold">Announcements</span>
    </div>
    <div class="flex items-center gap-3">
      <button *ngIf="createAnnouncement" type="button"
        class="bg-violet-700 hover:bg-violet-600 text-white font-medium px-2.5 py-1 rounded-full text-xs"
        (click)="openDialog()">
        + New
      </button>
      <ng-icon *ngIf="closeSidenav.observed" name="heroXMark" class="cursor-pointer text-lg hover:text-red-500" (click)="onClose()"></ng-icon>
    </div>
  </div>

  <app-skelton-loading *ngIf="isLoading"></app-skelton-loading>

  <!-- Announcement item template, reused by recent + list -->
  <ng-template #announcementRow let-item="item" let-isRecent="isRecent">
    <div class="relative flex flex-col bg-white hover:bg-gray-50 transition duration-200 border-b px-4 py-2.5"
      [class.bg-orange-50]="!item.viewedBy.includes(userId)"
      [class.opacity-50]="isMuted(item)"
      [class.grayscale]="isMuted(item)"
      #announcementItem [attr.data-id]="item._id">
      <div *ngIf="item.celeb" class="confetti-container">
        <app-confetti-component></app-confetti-component>
      </div>

      <div class="flex justify-between items-center gap-2">
        <div class="flex items-center gap-2 flex-wrap">
          <span *ngIf="isRecent" class="px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-600 whitespace-nowrap flex items-center gap-1">
            <ng-icon name="heroBellAlert" class="text-xs"></ng-icon>
            Recent
          </span>
          <h3 class="text-sm font-semibold text-violet-700">{{ item.title }}</h3>
        </div>
        <div class="flex items-center gap-2" *ngIf="deleteOrEditAnnouncement">
          <ng-icon name="heroPencilSquare" class="text-sm cursor-pointer text-gray-500 hover:text-gray-800" (click)="editAnnouncement(item)"></ng-icon>
          <ng-icon name="heroTrash" class="text-sm cursor-pointer text-red-400 hover:text-red-600" (click)="deleteAnnouncement(item)"></ng-icon>
        </div>
      </div>

      <p class="text-xs text-gray-600 mt-1 break-words whitespace-normal leading-relaxed">{{ item.description }}</p>

      <div class="flex items-center justify-between mt-2">
        <span class="text-xs text-gray-400 flex items-center gap-1">
          <ng-icon name="heroCalendarDays" class="text-xs"></ng-icon>
          Posted {{ item.createdDate | date: 'MMM d, y' }}
        </span>
        <span class="text-xs text-gray-500 flex items-center gap-1">
          <ng-icon name="heroCalendarDays" class="text-xs"></ng-icon>
          {{ item.date | date: 'MMM d, y' }}
        </span>
      </div>
    </div>
  </ng-template>

  <!-- Announcements Content -->
  <div>
    <h2 class="text-sm font-semibold text-gray-700 px-4 py-2 border-b" *ngIf="!isEmpty">All Announcements</h2>

    <div *ngIf="recentData">
      <ng-container *ngTemplateOutlet="announcementRow; context: { item: recentData, isRecent: true }"></ng-container>
    </div>

    <div *ngFor="let item of announcementData; trackBy: trackByIdFn">
      <ng-container *ngTemplateOutlet="announcementRow; context: { item: item, isRecent: false }"></ng-container>
    </div>

    <div *ngIf="isEmpty" class="w-full flex justify-center items-center">
      <div class="p-3">
        <img src="assets/images/empty.png" alt="">
        <p class="m-2 text-center text-sm text-gray-500">No announcements.</p>
      </div>
    </div>
  </div>
</div>
