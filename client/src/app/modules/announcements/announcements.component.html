<div class="h-full flex flex-col p-6 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <div *ngIf="loadError" role="alert"
    class="mb-3 flex shrink-0 flex-wrap items-center justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300">
    <span>Could not load announcements. Check your connection and try again.</span>
    <button type="button" class="font-medium underline hover:no-underline" (click)="retry()">Try again</button>
  </div>
  <app-data-grid #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Announcements"
    subtitle="Company news, policies and updates"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [serverSide]="true"
    [totalCount]="total"
    [data]="data"
    [columns]="columns"
    [loading]="isLoading"
    [pageSize]="pageSize"
    [selectable]="false"
    searchPlaceholder="Search announcements"
    emptyMessage="No announcements found"
    [createLabel]="canCreate ? 'New announcement' : ''"
    [rowActions]="rowActions"
    [rowAccent]="rowAccent"
    [views]="views"
    storageKey="announcement-list"
    [detailTabs]="detailTabs"
    [detailTitle]="title"
    [detailSubtitle]="subtitle"
    (queryChange)="onQueryChange($event)"
    (rowOpen)="onRowOpen($event)"
    (rowAction)="onRowAction($event)"
    (create)="openCreate()">

    <button dgToolbarExtra type="button" (click)="markAllRead()" [disabled]="!announcements.unread()"
      class="rounded-md px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-100 disabled:opacity-40 dark:text-gray-300 dark:hover:bg-gray-800">
      Mark all read
    </button>

    <ng-template #detailAsideTemplate let-row>
      <app-status-pill [status]="row.priority || 'normal'" [toneMap]="priorityTone"
        [label]="priorityLabel(row.priority || 'normal')"></app-status-pill>
    </ng-template>

    <ng-template #detailMetaTemplate let-row>
      <div class="enquiry-meta"><p class="enquiry-meta-label">Posted by</p><p class="enquiry-meta-value">{{ row.authorName || '—' }}</p></div>
      <div class="enquiry-meta"><p class="enquiry-meta-label">Type</p><p class="enquiry-meta-value">{{ typeLabel(row) }}</p></div>
      <div class="enquiry-meta"><p class="enquiry-meta-label">Published</p><p class="enquiry-meta-value">{{ (row.publishAt || row.date) | date: 'dd MMM yyyy' }}</p></div>
      <div class="enquiry-meta"><p class="enquiry-meta-label">Audience</p><p class="enquiry-meta-value">{{ audience(row) }}</p></div>
    </ng-template>

    <ng-template #detailFooterLeftTemplate let-row>
      <a *ngIf="row.link" [href]="row.link" target="_blank" rel="noopener noreferrer"
        class="text-sm font-medium text-violet-700 hover:underline dark:text-violet-300">Open link</a>
    </ng-template>

    <ng-template #detailFooterTemplate let-row>
      <app-action-button *ngIf="row.requireAck && !row.isAcknowledged && row.state === 'active'" variant="primary"
        [disabled]="isAcknowledging" (click)="acknowledge(row)">I've read this</app-action-button>
      <span *ngIf="row.requireAck && row.isAcknowledged" class="text-xs font-medium text-emerald-700 dark:text-emerald-400">Acknowledged</span>
    </ng-template>

    <ng-template #detailTemplate let-row let-tab="tab">
      <ng-container [ngSwitch]="tab">
        <div *ngSwitchCase="'message'" class="relative">
          <div *ngIf="isCelebrationRow(row)" class="confetti-container"><app-confetti-component></app-confetti-component></div>
          <p class="whitespace-pre-line break-words text-sm leading-relaxed text-gray-800 dark:text-gray-200">{{ row.description }}</p>
        </div>
        <app-detail-overview *ngSwitchCase="'overview'" [grid]="grid!" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
        <app-detail-timeline *ngSwitchCase="'history'" [entries]="(historyFor(row) | async) ?? []" emptyMessage="No history recorded yet."></app-detail-timeline>
      </ng-container>
    </ng-template>
  </app-data-grid>

  <app-add-announcement class="contents" [open]="formOpen" [announcement]="editTarget" (saved)="onFormSaved()" (closed)="onFormClosed()"></app-add-announcement>
</div>
