<div class="audit-page h-full flex flex-col p-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Audit & History"
    subtitle="Review system activity across modules, users, and recorded changes"
    rowKey="_id"
    [serverSide]="true"
    [totalCount]="total"
    [data]="rows"
    [columns]="columns"
    [loading]="loading"
    [pageSize]="limit"
    searchPlaceholder="Search activity"
    emptyMessage="No activity recorded yet"
    [createLabel]="''"
    [views]="views"
    storageKey="settings-audit-log"
    exportable
    exportFileName="audit-history.xlsx"
    [pageSizeOptions]="pageSizeOptions"
    [rowActions]="rowActions"
    (rowAction)="onRowAction($event)"
    (queryChange)="onQueryChange($event)"
  >
  </app-data-grid>
</div>
