<app-form-modal-shell
    icon="files" tone="violet" [title]="title" [contextEmptyText]="subtitle"
    formId="note-form" [invalid]="submitted && !!note.invalid"
    [submitLabel]="createButton ? 'Create' : 'Update'" [saving]="isSaving" submitShortcutVerb="save"
    (closed)="onCloseClicked()">
    <form id="note-form" (submit)="$event.preventDefault(); createButton ? onSubmit() : onUpdate()" novalidate class="grid gap-4">
        <app-sf-field *ngIf="typeOptions.length && createButton" label="Type" [control]="type">
            <app-sf-select [formControl]="type" [options]="typeOptions"></app-sf-select>
        </app-sf-field>
        <app-sf-field label="Note" [control]="note" [messages]="{ required: 'Please enter some text' }">
            <app-sf-textarea [formControl]="note" [rows]="6" bullets placeholder="Enter your text here..."></app-sf-textarea>
        </app-sf-field>
        <p class="-mt-2 text-[11px] text-gray-500 dark:text-gray-400">Press Enter to start a new bullet point; Enter on an empty bullet ends the list.</p>
    </form>
</app-form-modal-shell>
