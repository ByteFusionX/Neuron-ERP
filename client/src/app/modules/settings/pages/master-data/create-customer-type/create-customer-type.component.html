<div class="flex max-h-[90vh] flex-col bg-white text-gray-900 dark:bg-erp-surface-dark dark:text-gray-100">
    <header class="flex items-start gap-3 border-b border-gray-100 px-6 py-4 dark:border-erp-border-dark">
        <span class="grid h-9 w-9 shrink-0 place-content-center rounded-lg bg-violet-50 text-violet-600 ring-1 ring-inset ring-violet-100 dark:bg-violet-950/40 dark:text-violet-400 dark:ring-violet-900">
            <app-dp-icon name="tag" size="w-5 h-5"></app-dp-icon>
        </span>
        <div class="min-w-0 flex-1">
            <h2 class="text-base font-semibold leading-6">{{ newCustomerType ? 'Create customer type' : 'Edit customer type' }}</h2>
            <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Group customers by the kind of business they run.</p>
        </div>
        <button type="button" (click)="onCloseClicked()" aria-label="Close"
            class="grid h-8 w-8 place-content-center rounded-md text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-gray-800 dark:hover:text-gray-200">
            <app-dp-icon name="close" size="w-4 h-4"></app-dp-icon>
        </button>
    </header>

    <form id="customer-type-form" (ngSubmit)="save()" novalidate class="grid gap-4 overflow-y-auto px-6 py-5">
        <app-sf-field label="Customer type name" [control]="name" [messages]="{ required: 'Please enter customer type name' }">
            <app-sf-input [formControl]="name" placeholder="Eg:- Education"></app-sf-input>
        </app-sf-field>
        <app-sf-field label="Default discount % (optional)" [control]="defaultDiscount">
            <app-sf-number [formControl]="defaultDiscount" [min]="0" [max]="100" suffix="%" [stepper]="false"></app-sf-number>
        </app-sf-field>
        <app-sf-switch [formControl]="isActive" label="Active" description="Inactive types are kept for history but flagged in the list."></app-sf-switch>
    </form>

    <footer class="flex items-center justify-end gap-2 border-t border-gray-100 bg-gray-50/70 px-6 py-3 dark:border-erp-border-dark dark:bg-black/20">
        <app-action-button variant="secondary" (click)="onCloseClicked()">Cancel</app-action-button>
        <app-action-button variant="primary" type="submit" form="customer-type-form"
            [disabled]="!newCustomerType && !name.dirty && !defaultDiscount.dirty && !isActive.dirty">{{ newCustomerType ? 'Create' : 'Update' }}</app-action-button>
    </footer>
</div>
