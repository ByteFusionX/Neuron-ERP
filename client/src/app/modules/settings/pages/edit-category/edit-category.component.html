<app-page-layout
  title="Edit Category"
  [onClose]="onClose.bind(this)"
  [footerButtons]="footerButtons"
  contentClass="p-8">
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div class="w-full max-w-6xl mx-auto space-y-8">
      <div class="bg-gray-50 rounded-lg p-6 border border-gray-200">
        <h2 class="text-lg font-semibold text-gray-800 mb-6">Basic Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700" for="categoryName">
              Category Name <span class="text-red-500">*</span>
            </label>
            <input formControlName="categoryName" id="categoryName" appNoLeadingSpace
              class="w-full bg-white text-gray-900 border border-gray-300 rounded-lg py-2.5 px-4 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
              type="text" placeholder="Enter category name">
            <div class="text-red-600 text-xs mt-1 min-h-[16px]"
              *ngIf="categoryForm.get('categoryName')?.hasError('required') && categoryForm.get('categoryName')?.touched">
              This field is required
            </div>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700" for="role">
              User Role <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <select formControlName="role" id="role"
                class="w-full bg-white border border-gray-300 text-gray-900 py-2.5 px-4 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent appearance-none transition-all">
                <option value="">Select a role</option>
                <option value="superAdmin">Super Admin</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
            <div class="text-red-600 text-xs mt-1 min-h-[16px]"
              *ngIf="categoryForm.get('role')?.hasError('required') && categoryForm.get('role')?.touched">
              This field is required
            </div>
          </div>
        </div>
        <div class="mt-6 pt-6 border-t border-gray-200">
          <label class="flex items-center space-x-3 cursor-pointer group">
            <input type="checkbox" id="targetCheck" formControlName="isSalespersonWithTarget"
              class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 focus:ring-2 cursor-pointer">
            <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Salesperson with assigned target</span>
          </label>
        </div>
      </div>

      <div class="bg-gray-50 rounded-lg p-6 border border-gray-200">
        <h2 class="text-lg font-semibold text-gray-800 mb-6">Access Privileges</h2>
        <div class=" pr-2 space-y-4">
          <div class="flex flex-col space-y-4" formGroupName="privileges">

            <div formGroupName="dashboard" class="bg-white rounded-lg p-4 border border-gray-200">
              <div class="flex items-center space-x-3 mb-4">
                <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                <label class="text-base font-semibold text-gray-800">Dashboard</label>
              </div>
              <div class="ml-7 space-y-3 border-l-2 border-violet-200 pl-4">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">Comparison of Revenue and Gross Profit</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" value="company" id="companyTarget" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="compareAgainst">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">Against company targets</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" value="personal" id="personalTarget" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="compareAgainst">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">Against personal targets</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" value="both" id="bothPersonalAndCompany" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="compareAgainst">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">Against both company and personal targets</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="employee">
                <input type="checkbox" id="employee" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="employeeChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'employee','employeeChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Employees</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="employeeChecked" formGroupName="employee">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Employee Data</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="employeeAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      value="all" formControlName="viewReport">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Employees</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="employeeAllReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      value="reported" formControlName="viewReport">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Employees reported to the User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="employeeAllCreatedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      value="created" formControlName="viewReport">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Employees that User Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="employeeAllCreatedAndReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      value="createdAndReported" formControlName="viewReport">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Employees that User Created and Reported to</span>
                  </label>
                </div>
                <div class="mt-3">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="employeeCreate" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="create">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Create Employees</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="announcements">
                <input type="checkbox" id="announcements" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="announcementChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'announcement','announcementChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Announcements</span>
              </label>
              <div class="ml-7 mt-3 space-y-3" *ngIf="announcementChecked" formGroupName="announcement">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View All Announcements</label>
                </div>
                <div class="flex items-center space-x-2">
                  <input type="checkbox" id="createAnnouncement" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="create">
                  <label for="createAnnouncement" class="text-sm font-medium text-gray-700 cursor-pointer">Create Announcement</label>
                </div>
                <div class="flex items-center space-x-2">
                  <input type="checkbox" id="deleteOrEditAnnouncement" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="deleteOrEdit">
                  <label for="deleteOrEditAnnouncement" class="text-sm font-medium text-gray-700 cursor-pointer">Delete or Edit Announcement</label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="customer">
                <input type="checkbox" id="customer" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="customerChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'customer','customerChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Customer</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="customerChecked" formGroupName="customer">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Customer Data</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="customerAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Customers</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="customerPersonalData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="created">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Customers that user Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="customerReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="reported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Customers that reported to User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="customerPersonalReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="createdAndReported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Customers that user Created and reported to</span>
                  </label>
                </div>
                <div class="mt-3 space-y-2">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="customerCreate" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="create">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Create Customer</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="customerShare" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="share">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Share Customer to other employees</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="customerTransfer" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="transfer">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Transfer Customer to other employees</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="enquiry">
                <input type="checkbox" id="enquiry" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="enquiryChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'enquiry','enquiryChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Enquiry</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="enquiryChecked" formGroupName="enquiry">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Enquiry Data</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="enquiryAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Enquiries</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="enquiryPersonalData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="created">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Enquiries that user Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="enquiryReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="reported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Enquiries that reported to User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="enquiryPersonalReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="createdAndReported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Enquiries that user Created and reported to</span>
                  </label>
                </div>
                <div class="mt-3">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="enquiryCreate" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="create">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Create Enquiry</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="assignedJobs">
                <input type="checkbox" id="assignedJobs" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="assignedJobsChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'assignedJob','assignedJobsChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Assigned Jobs</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="assignedJobsChecked" formGroupName="assignedJob">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Assigned Jobs</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="AllAssignedJobs" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Presale Jobs (Presale Manager / Super Admin)</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="AssignedJobUser" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="assigned">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Presale Jobs Assigned to the user (Presale Engineer)</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="quotations">
                <input type="checkbox" id="quotations" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="quotationChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'quotation','quotationChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Quotation</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="quotationChecked" formGroupName="quotation">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Quotation Data</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="quotationAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Quotations</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="quotationPersonalData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="created">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Quotations that user Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="quotationReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="reported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Quotations that reported to User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="quotationPersonalReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="createdAndReported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Quotations that user Created and reported to</span>
                  </label>
                </div>
                <div class="mt-3">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="quotationCreate" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="create">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Create Quotations</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group">
                <input type="checkbox" id="dealSheet" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  formControlName="dealSheet">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Deal Sheet Approval</span>
              </label>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="jobSheet">
                <input type="checkbox" id="jobSheet" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="jobSheetChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'jobSheet','jobSheetChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Job Sheet</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="jobSheetChecked" formGroupName="jobSheet">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Job Sheet</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="jobSheetAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Job Sheets</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="jobSheetPersonalData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="created">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Jobs that user Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="jobSheetReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="reported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Jobs that reported to User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="jobSheetPersonalReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="createdAndReported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Jobs that user Created and reported to User</span>
                  </label>
                </div>
                <div class="mt-3 space-y-2">
                  <label class="flex items-center space-x-2 cursor-pointer group">

                        <input type="radio" id="inventoryProductsReported" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="reported">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Products that report to User</span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryProductsCreated" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="created">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Products that user Created</span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryProductsCreatedReported" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="createdAndReported">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Products that user Created and report to User</span>
                      </label>
                    </div>
                  </div>
                  <div formGroupName="stockEntries">
                    <div class="flex items-center space-x-2 mb-2">
                      <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                      <label class="text-sm font-medium text-gray-700">View Stock Entries Data</label>
                    </div>
                    <div class="ml-6 space-y-2 border-l-2 border-gray-200 pl-4">
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryStockAll" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="all">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Stock Entries</span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryStockReported" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="reported">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Stock Entries that report to User</span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryStockCreated" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="created">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Stock Entries that user Created</span>
                      </label>
                      <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" id="inventoryStockCreatedReported" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                          formControlName="viewReport" value="createdAndReported">
                        <span class="text-sm text-gray-700 group-hover:text-gray-900">View Stock Entries that user Created and report to User</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="claims">
                <input type="checkbox" id="claims" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="claimsChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'claims','claimsChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Claims</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="claimsChecked" formGroupName="claims">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" checked disabled class="w-4 h-4 text-violet-600 border-gray-300 rounded cursor-not-allowed">
                  <label class="text-sm font-medium text-gray-700">View Claims Data</label>
                </div>
                <div class="ml-4 space-y-2 border-l-2 border-gray-200 pl-4">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="claimsAllData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="all">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View All Claims</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="claimsReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="reported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Claims that report to User</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="claimsCreatedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="created">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Claims that user Created</span>
                  </label>
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" id="claimsCreatedReportedData" class="w-4 h-4 text-violet-600 border-gray-300 focus:ring-violet-500 cursor-pointer"
                      formControlName="viewReport" value="createdAndReported">
                    <span class="text-sm text-gray-700 group-hover:text-gray-900">View Claims that user Created and report to User</span>
                  </label>
                </div>
                <div class="mt-3">
                  <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="claimsCanApprove" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                      formControlName="canApprove">
                    <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Can Approve Claims</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg p-4 border border-gray-200">
              <label class="flex items-center space-x-3 cursor-pointer group" for="portal">
                <input type="checkbox" id="portal" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                  [(ngModel)]="portalChecked" [ngModelOptions]="{standalone: true}"
                  (change)="onCheckboxChange($event,'portal','portalChecked')">
                <span class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Portal Management</span>
              </label>
              <div class="ml-7 mt-3 space-y-3 border-l-2 border-violet-200 pl-4" *ngIf="portalChecked" formGroupName="portalManagement">
                <label class="flex items-center space-x-2 cursor-pointer group">
                  <input type="checkbox" id="department" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="department">
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Department (Create/edit/delete)</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer group">
                  <input type="checkbox" id="notesAndTerms" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="notesAndTerms">
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Customer Note & Terms and Condition (Create/edit/delete)</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer group">
                  <input type="checkbox" id="companyTarget" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="companyTarget">
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Company Target (Create/edit)</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer group">
                  <input type="checkbox" id="customerType" class="w-4 h-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500 cursor-pointer"
                    formControlName="customerType">
                  <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Customer Type (Create/edit)</span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="text-red-600 text-sm mt-4 text-center" *ngIf="error">{{error}}</p>
    </div>
  </form>
</app-page-layout>
