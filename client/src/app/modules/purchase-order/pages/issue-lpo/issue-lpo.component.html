<div class="bg-white m-6">
    <div class="border-b p-3 px-9 flex justify-between items-center">
        <h3 class="text-md font-medium">Purchase Order <span class="uppercase"></span>
        </h3>
    </div>

    <div class="flex flex-col py-6 mx-auto w-full text-gray-900 bg-white px-9">

        <div class="w-full mb-8">
            <div class="relative overflow-x-auto">
                <table class="w-full text-md text-left border">
                    <tbody>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Supplier</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Delivery Terms</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Address</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Place of Delivery</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Contact Person</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Payment Terms</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Phone</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Shipping Terms</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">E mail</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">PO Date</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Quote Ref</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">PO No</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Subject</td>
                            <td class="px-2 py-2 border"></td>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Job No</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>


        <div class="w-full mb-8">
            <div class="flex justify-between gap-3 py-5">
                <div class="md:w-1/3">
                    <label class="block uppercase tracking-wide text-gray-700 text-xs font-semibold mb-2"
                        for="grid-last-name">
                        List of Materials
                    </label>
                    <ng-select class="form border" placeholder="Select Material" appendTo="body">
                        <ng-option [value]=""></ng-option>
                    </ng-select>
                </div>
                <div class="w-full flex justify-end gap-2 items-end">
                    <span>Currency:</span>
                    <div class="flex">
                        <button class="text-gray-500 hover:text-gray-700">USD</button>/
                        <button class="text-violet-600 underline">QAR</button>
                    </div>
                </div>
            </div>
            <div class="relative overflow-x-auto">
                <table class="w-full text-md text-left border">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 border">SL.NO</th>
                            <th class="px-4 py-2 border">Description</th>
                            <th class="px-4 py-2 border">Quantity</th>
                            <th class="px-4 py-2 border">Unit Cost</th>
                            <th class="px-4 py-2 border">Total Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container>
                            <!-- <tr class="border text-center">
                                <td colspan="4" class="px-4 py-2 border">Item Name: <span
                                        class="text-base font-medium">{{ items.itemName }}</span></td>
                            </tr> -->
                            <tr class="border-b">
                                <td class="px-4 py-2 border"></td>
                                <td class="px-4 py-2 border"></td>
                                <td class="px-4 py-2 border"></td>
                                <td class="px-4 py-2 border"></td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="w-full flex md:justify-between">
            <div class="w-1/3">
                <label for="etaTerms"
                    class="block uppercase tracking-wide text-gray-700 text-xs font-semibold mb-2">Payment
                    Terms</label>
                <textarea class="w-full p-2 rounded bg-gray-200 outline-none" rows="2" formControlName="paymentTerms"
                    placeholder="Enter Payment Terms"></textarea>
            </div>
            <div class="w-1/2 py-5">
                <table class="w-full text-md text-left border">
                    <tbody>
                        <tr class="border-b">
                            <td class="px-2 py-2 border font-medium bg-gray-50">Sub Total (QAR/USD)</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Discount</td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                        <tr>
                            <td class="px-2 py-2 border font-medium bg-gray-50">Total Amount after discount </td>
                            <td class="px-2 py-2 border"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>


        <div class="w-full flex md:justify-between mb-3 px-8 py-3 border-t">
            <div class="md:flex gap-3">
                <button
                    class="w-fit px-3 py-2 text-sm border border-orange-500 hover:ring-1 hover:ring-orange-400 rounded mb-3"
                    type="button">Save
                    & Close</button>
                <button class="w-fit px-3 py-2 text-sm border bg-orange-500 text-white hover:bg-orange-400 rounded mb-3"
                    type="button">Exit</button>
            </div>
            <button class="w-fit px-3 py-2 text-sm border bg-violet-600 text-white hover:bg-violet-500 rounded mb-3"
                type="button">Issue LPO</button>
        </div>
    </div>
</div>
