<div class="p-6 min-w-[400px]">
<!-- Header -->
<div class="flex flex-col space-y-4 text-center sm:text-left">
  <div class="flex items-center gap-2 justify-center sm:justify-start border-b border-gray-300 pb-2">
    <h2 class="text-lg font-medium text-orange-600">Job ID: {{data.jobId}}</h2>
  </div>
  
  <div class="text-lg font-medium text-gray-800">Select Allocation Type</div>
</div>


  <!-- Allocation Type Options -->
  <div class="mt-6 space-y-3">
    <div 
      *ngFor="let option of allocationTypes" 
      class="p-4 rounded-lg border-2 cursor-pointer transition-all duration-200 hover:bg-gray-50"
      [class.border-orange-600]="selectedAllocationType === option.key"
      [class.bg-orange-50]="selectedAllocationType === option.key"
      [class.border-gray-300]="selectedAllocationType !== option.key"
      (click)="selectAllocationType(option.key)">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <ng-icon 
            [name]="option.icon" 
            size="24" 
            class="text-gray-600"
            [class.text-orange-600]="selectedAllocationType === option.key">
          </ng-icon>
          <div>
            <div class="font-medium text-gray-900">{{option.label}}</div>
            <div class="text-sm text-gray-500" [ngSwitch]="option.key">
              <span *ngSwitchCase="allocateTypeEnum.SupplyOnly">Material supply without installation</span>
              <span *ngSwitchCase="allocateTypeEnum.ProjectWithSupply">Complete project with material supply</span>
              <span *ngSwitchCase="allocateTypeEnum.ProjectsWithOutSupply">Project execution without material supply</span>
              <span *ngSwitchCase="allocateTypeEnum.AMC">Annual Maintenance Contract</span>
            </div>
          </div>
        </div>
        
        <!-- Tick Icon -->
        <div 
          class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200"
          [class.border-orange-600]="selectedAllocationType === option.key"
          [class.bg-orange-600]="selectedAllocationType === option.key"
          [class.border-gray-300]="selectedAllocationType !== option.key">
          
          <ng-icon 
            *ngIf="selectedAllocationType === option.key"
            name="heroCheck"
            size="16" 
            class="text-white">
          </ng-icon>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="mt-8 flex gap-3 justify-end">
    <button 
      class="px-4 py-2 text-gray-600 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors duration-200"
      (click)="onCancel()">
      Cancel
    </button>
    <button 
      class="px-6 py-2 bg-violet-600 text-white rounded-md hover:bg-violet-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors duration-200"
      [disabled]="!selectedAllocationType"
      (click)="onConfirm()">
      Confirm Selection
    </button>
  </div>
</div>
