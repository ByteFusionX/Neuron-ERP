<app-modal-layout
  title="Transfer Procurement Person"
  [subtitle]="data.jobLabel ? 'Job ID: ' + data.jobLabel : ''"
  [onClose]="onClose.bind(this)"
  [footerButtons]="getFooterButtons()"
  contentClass="p-6 min-w-[400px]">

  <div *ngIf="data.currentProcurementPerson" class="mb-4 p-3 rounded-md bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700">
    <p class="text-sm text-gray-600 dark:text-gray-400 mb-1">Current Procurement Person</p>
    <p class="text-base font-medium text-gray-900 dark:text-gray-100">
      {{ data.currentProcurementPerson.firstName }} {{ data.currentProcurementPerson.lastName }}
    </p>
  </div>

  <label for="employee" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
    New Procurement Person <span class="text-red-500">*</span>
  </label>
  <ng-select
    id="employee"
    class="filter"
    placeholder="Select employee..."
    appendTo="body"
    [(ngModel)]="selectedEmployee"
    (ngModelChange)="showError = false"
    [ngClass]="{'border-orange-500': showError}">
    <ng-option *ngFor="let employee of employees$ | async" [value]="employee._id" [disabled]="employee._id === currentId">
      {{ employee.firstName }} {{ employee.lastName }}<span *ngIf="employee._id === currentId"> (current)</span>
    </ng-option>
  </ng-select>
  <div *ngIf="showError" class="text-red-500 mt-1 text-sm">
    Please select an employee.
  </div>
</app-modal-layout>
