<app-form-modal-shell
  icon="user-round-check"
  tone="sky"
  [title]="currentProcurementPersonName ? 'Transfer procurement' : 'Assign procurement'"
  contextLabel="Job"
  [context]="data?.jobLabel"
  contextEmptyText="Choose the procurement owner."
  formId="transfer-procurement-form"
  [invalid]="form.invalid && submitted"
  invalidText="Select a procurement person"
  [submitLabel]="currentProcurementPersonName ? 'Transfer' : 'Assign'"
  submitIcon="check"
  submitShortcutVerb="transfer"
  (closed)="close()">
  <form id="transfer-procurement-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div *ngIf="currentProcurementPersonName" class="current-person">
      <span>Current Procurement Person</span>
      <strong>{{ currentProcurementPersonName }}</strong>
    </div>

    <app-sf-section title="Procurement" columns="1">
      <app-sf-field [label]="currentProcurementPersonName ? 'New procurement person' : 'Procurement person'" [control]="form.controls.procurementPerson">
        <app-sf-combobox
          formControlName="procurementPerson"
          [options]="employeeOptions"
          placeholder="Select procurement person"></app-sf-combobox>
      </app-sf-field>
    </app-sf-section>
  </form>
</app-form-modal-shell>
