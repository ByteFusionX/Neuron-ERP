<app-form-modal-shell icon="flag" tone="rose" title="Mark stock hold disputed"
  [context]="stockHold?.holdNo" contextLabel="Return"
  formId="dispute-stock-hold-form" submitLabel="Mark disputed" savingLabel="Marking..."
  submitIcon="flag" [saving]="isSubmitting" [invalid]="disputeForm.invalid && formSubmitted"
  (closed)="onCancel()">
  <form id="dispute-stock-hold-form" [formGroup]="disputeForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex items-center justify-between gap-3 border border-gray-200 rounded-lg px-3 py-2">
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">{{ stockHold?.itemDescription }}</p>
          <p class="text-xs text-gray-500">{{ stockHold?.supplierId?.supplierName }}</p>
        </div>
        <p class="text-sm font-semibold text-amber-600 shrink-0">
          {{ stockHold?.unresolvedQty }} unresolved
        </p>
      </div>

      <div class="rounded-lg border border-red-200 bg-red-50 p-3 dark:border-red-900 dark:bg-red-950/30">
        <p class="text-sm text-red-700">
          Any pending financial resolution for this hold will be held until the dispute is resolved.
        </p>
      </div>

    <app-sf-field label="Reason for dispute" required [control]="disputeForm.get('disputeNote')"><app-sf-textarea formControlName="disputeNote" placeholder="Explain why the supplier is disputing this rejection" [rows]="4" autoresize></app-sf-textarea></app-sf-field>
  </form>
</app-form-modal-shell>
