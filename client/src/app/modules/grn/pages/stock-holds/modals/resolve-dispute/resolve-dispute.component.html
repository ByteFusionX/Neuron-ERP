<app-form-modal-shell icon="check" tone="emerald" title="Resolve dispute"
  [context]="stockHold?.holdNo" contextLabel="Return"
  formId="resolve-dispute-form" submitLabel="Resolve dispute" savingLabel="Resolving..."
  submitIcon="check" [saving]="isSubmitting" [invalid]="resolveForm.invalid && formSubmitted"
  (closed)="onCancel()">
  <form id="resolve-dispute-form" [formGroup]="resolveForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex items-center justify-between gap-3 border border-gray-200 rounded-lg px-3 py-2">
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">{{ stockHold?.itemDescription }}</p>
          <p class="text-xs text-gray-500">{{ stockHold?.supplierId?.supplierName }}</p>
        </div>
        <p class="text-sm font-semibold text-amber-600 shrink-0">
          {{ stockHold?.unresolvedQty }} unresolved
        </p>
      </div>

      <div *ngIf="stockHold?.disputeNote" class="border-l-4 border-red-300 bg-red-50/60 rounded-r-lg px-3 py-2">
        <p class="text-[11px] uppercase tracking-wide text-red-700 font-medium mb-0.5">Dispute Reason</p>
        <p class="text-sm text-gray-800 break-words">{{ stockHold?.disputeNote }}</p>
      </div>

      <div class="rounded-lg border border-sky-200 bg-sky-50 p-3 dark:border-sky-900 dark:bg-sky-950/30">
        <p class="text-sm text-blue-700">
          Resolving lets this hold's pending financial adjustment (pre-invoice adjustment or credit note) proceed.
        </p>
      </div>

    <app-sf-field label="Resolution note" required [control]="resolveForm.get('disputeNote')"><app-sf-textarea formControlName="disputeNote" placeholder="Explain how the dispute was resolved" [rows]="4" autoresize></app-sf-textarea></app-sf-field>
  </form>
</app-form-modal-shell>
