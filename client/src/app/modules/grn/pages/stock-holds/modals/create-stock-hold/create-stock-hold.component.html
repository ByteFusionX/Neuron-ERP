<form [formGroup]="holdForm" (ngSubmit)="onSubmit()" class="flex max-h-[88vh] flex-col overflow-hidden rounded-lg bg-white text-gray-900 shadow-xl dark:bg-erp-surface-dark dark:text-gray-100">
  <div class="border-b border-gray-200 px-6 py-4 dark:border-erp-border-dark">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold">Create Purchase Return</h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ data?.itemDescription }} - rejected qty available: {{ data?.rejectedQty }}</p>
      </div>
      <button type="button" class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-100" (click)="onCancel()">
        <span class="material-icons text-xl">close</span>
      </button>
    </div>
  </div>

  <div class="min-h-0 flex-1 space-y-4 overflow-y-auto px-6 py-5">
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="space-y-1.5 text-sm font-medium">
        <span>Vendor Authorization No.</span>
        <input formControlName="vendorAuthorizationNo" class="sf-input" placeholder="RMA / vendor reference">
      </label>
      <label class="space-y-1.5 text-sm font-medium">
        <span>Return Reason</span>
        <input formControlName="returnReason" class="sf-input" placeholder="Defective, wrong item, damaged">
      </label>
    </div>

    <label class="space-y-1.5 text-sm font-medium">
      <span>Return Quantity</span>
      <input formControlName="qty" type="number" class="sf-input" [class.sf-invalid]="holdForm.get('qty')?.invalid && isSubmitting" placeholder="Enter quantity">
    </label>

    <label class="space-y-1.5 text-sm font-medium">
      <span>Return Logistics</span>
      <select formControlName="logisticsType" class="sf-input" [class.sf-invalid]="holdForm.get('logisticsType')?.invalid && isSubmitting">
        <option value="">Select how the item will be returned</option>
        <option *ngFor="let option of logisticsOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>

    <div class="grid gap-4 sm:grid-cols-2" *ngIf="holdForm.get('logisticsType')?.value === 'Courier'">
      <label class="space-y-1.5 text-sm font-medium">
        <span>Courier Name</span>
        <input formControlName="courierName" class="sf-input" [class.sf-invalid]="holdForm.get('courierName')?.invalid && isSubmitting" placeholder="Courier / 3rd party name">
      </label>
      <label class="space-y-1.5 text-sm font-medium">
        <span>Tracking Reference</span>
        <input formControlName="trackingRef" class="sf-input" [class.sf-invalid]="holdForm.get('trackingRef')?.invalid && isSubmitting" placeholder="Tracking number">
      </label>
    </div>

    <label class="space-y-1.5 text-sm font-medium">
      <span>Dispatch Date</span>
      <input formControlName="dispatchDate" type="date" class="sf-input">
    </label>

    <label class="space-y-1.5 text-sm font-medium">
      <span>Return Notes</span>
      <textarea formControlName="returnNotes" class="sf-input min-h-24" placeholder="Short note for supplier or internal team"></textarea>
    </label>
  </div>

  <div class="flex items-center justify-end gap-2 border-t border-gray-200 px-6 py-4 dark:border-erp-border-dark">
    <button type="button" class="sf-btn sf-btn-secondary" (click)="onCancel()">Discard</button>
    <button type="submit" class="sf-btn sf-btn-primary" [disabled]="isSubmitting">{{ isSubmitting ? 'Creating...' : 'Create Return' }}</button>
  </div>
</form>
