<app-modal-layout
  title="Resolve Rejected Item — Initiate Stock Hold"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="[
    { label: 'Discard', onClick: onCancel.bind(this), theme: 'cancel' },
    { label: 'Initiate Hold', onClick: onSubmit.bind(this), theme: 'primary', loading: isSubmitting }
  ]"
  contentClass="p-6">
  <form [formGroup]="holdForm" (ngSubmit)="onSubmit()">
    <div class="space-y-4">
      <p class="text-sm text-gray-500">
        {{ data?.itemDescription }} — rejected qty available to resolve: {{ data?.rejectedQty }}
      </p>

      <app-form-field
        label="Quantity to hold"
        [control]="holdForm.get('qty')"
        [isSubmitted]="isSubmitting"
        type="number"
        placeholder="Enter quantity">
      </app-form-field>

      <app-select-dropdown
        label="Return Logistics"
        [options]="logisticsOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="logisticsType"
        placeholder="Select how the item will be returned"
        [isSubmitted]="isSubmitting">
      </app-select-dropdown>

      <div class="grid grid-cols-2 gap-4" *ngIf="holdForm.get('logisticsType')?.value === 'Courier'">
        <app-form-field
          label="Courier Name"
          [control]="holdForm.get('courierName')"
          [isSubmitted]="isSubmitting"
          placeholder="Courier / 3rd party name">
        </app-form-field>

        <app-form-field
          label="Tracking Reference"
          [control]="holdForm.get('trackingRef')"
          [isSubmitted]="isSubmitting"
          placeholder="Tracking number">
        </app-form-field>
      </div>

      <app-form-field
        label="Dispatch Date"
        [control]="holdForm.get('dispatchDate')"
        [isSubmitted]="isSubmitting"
        type="date"
        placeholder="Select dispatch date">
      </app-form-field>
    </div>
  </form>
</app-modal-layout>
