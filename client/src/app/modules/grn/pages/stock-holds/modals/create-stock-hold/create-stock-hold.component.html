<app-form-modal-shell icon="transfer" tone="amber" title="Create purchase return"
  [context]="data?.itemDescription" contextLabel="Returning"
  formId="create-stock-hold-form" submitLabel="Create return" savingLabel="Creating..."
  submitIcon="transfer" [saving]="isSubmitting" [invalid]="holdForm.invalid && holdForm.touched"
  (closed)="onCancel()">
  <form id="create-stock-hold-form" [formGroup]="holdForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <p class="text-xs text-gray-500 dark:text-gray-400">Rejected quantity available: {{ data?.rejectedQty }}<ng-container *ngIf="isDn"> · DN {{ data?.dnNo }}<ng-container *ngIf="data?.jobNo"> · Job {{ data?.jobNo }}</ng-container></ng-container></p>
    <div class="grid gap-4 sm:grid-cols-2" *ngIf="isDn">
      <app-sf-field label="Supplier" required [control]="holdForm.get('supplierId')"><app-sf-select formControlName="supplierId" [options]="supplierOptions" [placeholder]="supplierOptions.length ? 'Select supplier to return to' : 'No PO on this job for this item'"></app-sf-select></app-sf-field>
      <app-sf-field label="Reason code" required [control]="holdForm.get('reasonCode')"><app-sf-select formControlName="reasonCode" [options]="reasonOptions" placeholder="Select reason"></app-sf-select></app-sf-field>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-sf-field label="Vendor authorization no." [control]="holdForm.get('vendorAuthorizationNo')"><app-sf-input formControlName="vendorAuthorizationNo" placeholder="RMA / vendor reference"></app-sf-input></app-sf-field>
      <app-sf-field label="Return reason" [control]="holdForm.get('returnReason')"><app-sf-input formControlName="returnReason" placeholder="Defective, wrong item, damaged"></app-sf-input></app-sf-field>
    </div>
    <app-sf-field label="Return quantity" required [control]="holdForm.get('qty')"><app-sf-number formControlName="qty" [min]="1" [stepper]="false" placeholder="Enter quantity"></app-sf-number></app-sf-field>
    <app-sf-field label="Return logistics" required [control]="holdForm.get('logisticsType')"><app-sf-select formControlName="logisticsType" [options]="logisticsOptions" placeholder="Select how the item will be returned"></app-sf-select></app-sf-field>
    <div class="grid gap-4 sm:grid-cols-2" *ngIf="holdForm.get('logisticsType')?.value === 'Courier'">
      <app-sf-field label="Courier name" required [control]="holdForm.get('courierName')"><app-sf-input formControlName="courierName" placeholder="Courier / 3rd party name"></app-sf-input></app-sf-field>
      <app-sf-field label="Tracking reference" required [control]="holdForm.get('trackingRef')"><app-sf-input formControlName="trackingRef" placeholder="Tracking number"></app-sf-input></app-sf-field>
    </div>
    <app-sf-field label="Dispatch date" [control]="holdForm.get('dispatchDate')"><app-sf-date formControlName="dispatchDate"></app-sf-date></app-sf-field>
    <app-sf-field label="Return notes" [control]="holdForm.get('returnNotes')"><app-sf-textarea formControlName="returnNotes" placeholder="Short note for supplier or internal team" [rows]="4" autoresize></app-sf-textarea></app-sf-field>
  </form>
</app-form-modal-shell>
