<app-form-modal-shell icon="check" tone="emerald" title="Resolve stock hold"
  [context]="stockHold?.itemDescription" contextLabel="Resolving"
  formId="resolve-stock-hold-form" submitLabel="Resolve" savingLabel="Resolving..."
  submitIcon="check" [saving]="isSubmitting" [invalid]="resolveForm.invalid && resolveForm.touched"
  (closed)="onCancel()">
  <form id="resolve-stock-hold-form" [formGroup]="resolveForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <p class="text-xs text-gray-500 dark:text-gray-400">Unresolved quantity: {{ stockHold?.unresolvedQty }}</p>
    <app-sf-field label="Quantity to resolve now" required [control]="resolveForm.get('qty')"><app-sf-number formControlName="qty" [min]="1" [stepper]="false" placeholder="Enter quantity"></app-sf-number></app-sf-field>
    <app-sf-field label="Resolution type" required [control]="resolveForm.get('resolutionType')"><app-sf-select formControlName="resolutionType" [options]="resolutionOptions" placeholder="Select how this quantity is being resolved"></app-sf-select></app-sf-field>
    <app-sf-field *ngIf="isPhysicalResolution" label="Replacement purchase order ID" [control]="resolveForm.get('replacementPoId')"><app-sf-input formControlName="replacementPoId" placeholder="Replacement or alternate-supplier PO ID"></app-sf-input></app-sf-field>

    <ng-container *ngIf="isFinancialResolution">
      <app-sf-switch formControlName="invoiced" label="Supplier invoice already issued"></app-sf-switch>
      <app-sf-field *ngIf="resolveForm.get('invoiced')?.value" label="Purchase order ID" required [control]="resolveForm.get('poId')"><app-sf-input formControlName="poId" placeholder="Invoiced PO ID"></app-sf-input></app-sf-field>

      <p *ngIf="resolveForm.get('invoiced')?.value && !canIssueCreditNote" class="text-xs text-red-600">
        You don't have permission to issue a Credit Note. This action will be rejected server-side.
      </p>
    </ng-container>

    <app-sf-field label="Note" [control]="resolveForm.get('note')"><app-sf-textarea formControlName="note" placeholder="Optional note for the audit trail" [rows]="4" autoresize></app-sf-textarea></app-sf-field>
  </form>
</app-form-modal-shell>
