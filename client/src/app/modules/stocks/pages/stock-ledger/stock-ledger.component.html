<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Stock Ledger"
    [subtitle]="subtitle"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [serverSide]="true"
    [totalCount]="totalItems()"
    [data]="tableData()"
    [columns]="columns"
    [loading]="isLoading()"
    [pageSize]="row"
    [selectable]="false"
    [showDetailPanel]="false"
    [views]="views"
    searchPlaceholder="Search item, document no, remarks..."
    emptyMessage="No stock movements found yet."
    exportable
    exportFileName="stock-ledger.xlsx"
    (queryChange)="onQueryChange($event)"
    (viewChange)="onViewChange($event)">
  </app-data-grid>
</div>
