<app-sf-drawer title="Adjust Stock" subtitle="Correct the quantity in a warehouse. Every adjustment is recorded in the ledger with its reason."
    width="560px" [open]="open" [dirty]="form.dirty" (closed)="onDrawerClosed($event)">

    <div *ngIf="current" class="mb-4 grid grid-cols-3 divide-x divide-gray-200 rounded-xl border border-gray-200 bg-gray-50/95 py-3 text-center dark:divide-erp-border-dark dark:border-erp-border-dark dark:bg-gray-900/85">
        <div class="px-4">
            <p class="text-[11px] uppercase tracking-wide text-gray-500">On hand</p>
            <p class="text-sm font-semibold tabular-nums text-gray-900 dark:text-gray-100">{{ current.onHand }}</p>
        </div>
        <div class="px-4">
            <p class="text-[11px] uppercase tracking-wide text-gray-500">Reserved</p>
            <p class="text-sm font-semibold tabular-nums text-gray-900 dark:text-gray-100">{{ current.reserved }}</p>
        </div>
        <div class="px-4">
            <p class="text-[11px] uppercase tracking-wide text-gray-500">Available</p>
            <p class="text-sm font-semibold tabular-nums text-gray-900 dark:text-gray-100">{{ current.available }}</p>
        </div>
    </div>

    <form id="stock-adjust-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-sf-section title="Stock" columns="2">
            <app-sf-field full label="Product" [optional]="isEdit" [control]="form.controls.product">
                <div class="relative" (focusin)="onProductFocus()" (focusout)="hideSuggestionsSoon()"
                    (keydown)="onProductKeydown($event)">
                    <app-sf-textarea [formControl]="productText" [rows]="3" expandOnFocus noEnter
                        placeholder="Type part no or description"></app-sf-textarea>
                    <ul *ngIf="showSuggestions && productSuggestions.length"
                        class="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-lg text-sm">
                        <li *ngFor="let o of productSuggestions; let i = index" [id]="'stock-adjust-sugg-' + i"
                            (mousedown)="selectProduct(o)" (mouseenter)="activeSuggestion = i"
                            [ngClass]="{ 'bg-gray-100 dark:bg-gray-700': i === activeSuggestion }"
                            class="cursor-pointer px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 whitespace-pre-line">{{ o.description || o.productName }}</li>
                    </ul>
                </div>
            </app-sf-field>
            <app-sf-field label="Warehouse" [optional]="isEdit" [control]="form.controls.warehouse">
                <app-sf-combobox formControlName="warehouse" [options]="warehouseOptions" placeholder="Select warehouse"
                    footerLabel="Add warehouse" (footerAction)="createWarehouse()"></app-sf-combobox>
            </app-sf-field>
            <app-sf-field label="Area" optional [control]="form.controls.area">
                <app-sf-combobox formControlName="area" [options]="areaOptions" placeholder="Select area"
                    footerLabel="Add area" (footerAction)="createArea()"></app-sf-combobox>
            </app-sf-field>
        </app-sf-section>

        <app-sf-section title="Adjustment" columns="2">
            <app-sf-field full label="Action" [optional]="isEdit" [control]="form.controls.direction">
                <app-sf-radio-group formControlName="direction" [options]="directionOptions" variant="segmented"></app-sf-radio-group>
            </app-sf-field>
            <app-sf-field label="Quantity" [optional]="isEdit" [control]="form.controls.quantity" [messages]="{ min: 'Enter a quantity of 1 or more' }">
                <app-sf-number formControlName="quantity" [min]="1"></app-sf-number>
            </app-sf-field>
            <app-sf-field label="Reason" [optional]="isEdit" [control]="form.controls.reason">
                <app-sf-select formControlName="reason" [options]="reasonOptions" placeholder="Select reason"></app-sf-select>
            </app-sf-field>
            <app-sf-field *ngIf="form.controls.direction.value === 'add'" label="Unit cost" optional
                hint="Leave blank to use the cost of the last receipt." [control]="form.controls.unitCost">
                <app-sf-number formControlName="unitCost" [min]="0" [decimals]="2"></app-sf-number>
            </app-sf-field>
            <app-sf-field *ngIf="form.controls.direction.value === 'add'" label="Arrival date" optional [control]="form.controls.arrivalDate">
                <app-sf-date formControlName="arrivalDate"></app-sf-date>
            </app-sf-field>
            <app-sf-field *ngIf="form.controls.direction.value === 'add'" label="Expire on" optional [control]="form.controls.expiryDate">
                <app-sf-date formControlName="expiryDate"></app-sf-date>
            </app-sf-field>
            <app-sf-field full label="Serial no" optional [control]="form.controls.serialNos"
                [hint]="form.controls.direction.value === 'add' ? 'One per line. Added to the item\'s serials in stock.' : 'One per line. Removed from the item\'s serials in stock.'">
                <app-sf-textarea formControlName="serialNos" [rows]="3" placeholder="One serial number per line"></app-sf-textarea>
            </app-sf-field>
            <app-sf-field full label="Remarks" [optional]="!isOther" [control]="form.controls.remarks"
                [messages]="{ required: 'Remarks are required when the reason is Other' }">
                <app-sf-textarea formControlName="remarks" [rows]="3" placeholder="What happened?"></app-sf-textarea>
            </app-sf-field>
        </app-sf-section>
    </form>

    <ng-container sfDrawerFooter>
        <span class="mr-auto">
            <app-action-button variant="secondary" (click)="createProductOpen = true">+ Add product</app-action-button>
        </span>
        <app-action-button variant="secondary" (click)="onDrawerClosed(false)">Cancel</app-action-button>
        <app-action-button variant="primary" type="submit" form="stock-adjust-form" [disabled]="saving">
            {{ saving ? 'Saving…' : 'Post adjustment' }}
        </app-action-button>
    </ng-container>
</app-sf-drawer>

<app-product-form-drawer [open]="createProductOpen" mode="create" (saved)="onProductCreated($event)" (closed)="createProductOpen = false"></app-product-form-drawer>
