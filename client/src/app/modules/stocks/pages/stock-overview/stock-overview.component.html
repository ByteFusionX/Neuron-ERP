<div class="h-full flex flex-col p-5 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid
    #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Stock Balance"
    subtitle="What is on hand, reserved and available for each item."
    [breadcrumbs]="breadcrumbs"
    rowKey="productId"
    [serverSide]="true"
    [totalCount]="totalItems()"
    [data]="tableData()"
    [columns]="columns"
    [loading]="isLoading()"
    [pageSize]="row"
    searchPlaceholder="Search item, part no, description..."
    emptyMessage="No stock found yet. Receive a GRN or adjust stock to start."
    createLabel="Adjust Stock"
    [rowActions]="rowActions"
    [views]="views"
    storageKey="stock-overview"
    exportable
    exportFileName="stock.xlsx"
    [detailTabs]="detailTabs"
    [detailTitle]="detailTitle"
    [detailSubtitle]="detailSubtitle"
    (queryChange)="onQueryChange($event)"
    (viewChange)="onViewChange($event)"
    (rowOpen)="onRowOpen($event)"
    (rowAction)="onRowAction($event)"
    (create)="openAdjust()">

    <ng-template #detailMetaTemplate let-row>
      <app-detail-meta [items]="metaFor(row)"></app-detail-meta>
    </ng-template>

    <ng-template #detailTemplate let-row let-tab="tab">
      <ng-container [ngSwitch]="tab">
        <ng-container *ngSwitchCase="'details'">
          <app-detail-overview [grid]="grid" [row]="row" [sections]="detailSections()"></app-detail-overview>
        </ng-container>
        <app-detail-timeline *ngSwitchCase="'history'" [entries]="historyEntries()" emptyMessage="No history recorded yet."></app-detail-timeline>
      </ng-container>
    </ng-template>
  </app-data-grid>
</div>

<app-stock-adjust-drawer [open]="adjustOpen" [productId]="adjustProductId" [warehouseId]="adjustWarehouseId"(saved)="loadStock()" (closed)="closeAdjust()"></app-stock-adjust-drawer>
