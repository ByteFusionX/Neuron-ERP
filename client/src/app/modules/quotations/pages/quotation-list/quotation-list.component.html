<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Quotations"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
            [serverSide]="true"
            [totalCount]="total"
            [data]="rows"
            [columns]="columns"
            [loading]="isLoading"
            [pageSize]="row"
            searchPlaceholder="Search by QuoteId"
            emptyMessage="No quotations found"
            [createLabel]="createQuotation ? 'Create Quote' : ''"
            [rowActions]="rowActions"
            [views]="views"
            (viewChange)="onViewChange($event)"
            [bulkActions]="bulkActions"
            storageKey="quotation-list"
            [density]="density"
            [rowAccent]="rowAccent"
            exportable
            exportFileName="quotations.xlsx"
            [detailLoading]="detailLoading"
            [detailTabs]="detailTabs"
            [detailTitle]="quoteTitle"
            [detailSubtitle]="quoteSubtitle"
            (queryChange)="onQueryChange($event)"
            (rowOpen)="onRowOpen()"
            (cellEdit)="onCellEdit($event)"
            (rowAction)="onRowAction($event)"
            (bulkAction)="onBulkAction($event, grid)"
        (create)="onCreateQuotation()">
        
        <app-view-toggle dgToolbarExtra label="Quotation" active="list" listLink="/quotations" reportLink="/quotations/report" [reportQueryParams]="reportQueryParams"></app-view-toggle>

        <ng-template #detailAsideTemplate let-row>
            <span *ngIf="row.status; else asideStatusEmpty" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset"
                [ngClass]="statusBadgeClasses[row.status] || 'bg-gray-100 text-gray-700 ring-gray-200 border-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:ring-gray-700 dark:border-gray-700'">{{ row.status }}</span>
            <ng-template #asideStatusEmpty><span class="text-gray-400 dark:text-gray-600">—</span></ng-template>
        </ng-template>

        <ng-template #detailMetaTemplate let-row>
            <div class="qt-meta">
                <p class="qt-meta-label">Customer</p>
                <p class="qt-meta-value">{{ row.client?.companyName }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Department</p>
                <p class="qt-meta-value">{{ departmentNames(row) }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Amount</p>
                <p class="qt-meta-value">{{ formatAmount(row) }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Date</p>
                <p class="qt-meta-value">{{ row.date | date: 'dd MMM yyyy' }}</p>
            </div>
        </ng-template>

        <ng-template #detailFooterTemplate let-row let-tab="tab">
            <app-action-button *ngIf="tab === 'events'" variant="secondary" (click)="onAddEvent(row)">Add event</app-action-button>
            <app-action-button *ngIf="tab === 'lpo' && canUploadLpo(row)" variant="secondary" (click)="startLpoUpload(row)">Upload</app-action-button>
            <app-action-button variant="primary" (click)="openFullQuotation(row, $event)">Open full quotation</app-action-button>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'deal'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="[dealSummarySection(row)]"></app-detail-overview>
                </ng-container>

                <ng-container *ngSwitchCase="'items'">
                    <app-detail-table title="Line items" [columns]="itemColumns" [rows]="itemRows(row)" showTotals [currency]="row.currency"></app-detail-table>
                </ng-container>

                <ng-container *ngSwitchCase="'events'">
                    <app-detail-task-list
                        [items]="eventItems((eventsFor(row) | async) ?? [])"
                        defaultFilter="event"
                        [showTasks]="false"
                        [showEvents]="true"
                        (add)="onAddEvent(row)"
                        (toggle)="onToggleEvent(row, $event)"
                        (eventOutcome)="onEventOutcome(row, $event.item, $event.status)"
                        (remove)="onDeleteEvent(row, $event)"
                        (previewFile)="onPreviewEventFile($event.file)"
                        (deleteFile)="onDeleteEventFile(row, $event.item, $event.file)"></app-detail-task-list>
                </ng-container>
                <ng-container *ngSwitchCase="'lpo'">
                    <app-detail-documents
                        title="Customer LPO"
                        emptyMessage="No Documents uploaded yet."
                        [documents]="lpoDocuments(row)"
                        [removable]="row.dealData?.status === 'rejected' || row.dealData?.status === 'revoked'"
                        [removeDetails]="lpoRemoveDetails(row)"
                        (open)="onLpoPreviewDoc(row, $event)"
                        (download)="onLpoDownloadDoc(row, $event)"
                        (remove)="onLpoRemoveDoc(row, $event)"></app-detail-documents>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>

    <!-- Create and edit share one drawer; the list only decides which mode to open it in. -->
    <app-quote-form-drawer [open]="formOpen" [mode]="formMode" [quote]="formQuote" [enquiry]="sourceEnquiry"
        (saved)="getQuotations()" (closed)="onFormClosed()"></app-quote-form-drawer>

    <!-- Convert to deal sheet: opens from the row action, or straight after an LPO upload. -->
    <app-deal-form [quotation]="dealQuote" (saved)="onDealSaved($event)" (closed)="dealQuote = null"></app-deal-form>
</div>
