<app-sf-drawer title="Create Project" subtitle="Assign a project or AMC to an engineer" width="640px"
    [open]="open" [dirty]="projectForm.dirty" (closed)="onDrawerClosed($event)">

    <form id="project-form" [formGroup]="projectForm" (ngSubmit)="submit()" novalidate>
        <app-sf-section title="Project" columns="2">
            <app-sf-field full label="Customer" [control]="projectForm.controls.customerId">
                <app-sf-combobox formControlName="customerId" [options]="customerOptions" placeholder="Select customer"></app-sf-combobox>
            </app-sf-field>
            <app-sf-field label="Project Type" [control]="projectForm.controls.projectType">
                <app-sf-select formControlName="projectType" [options]="projectTypeOptions" placeholder="Select type"></app-sf-select>
            </app-sf-field>
            <app-sf-field label="Priority" [control]="projectForm.controls.priority">
                <app-sf-select formControlName="priority" [options]="priorityOptions" placeholder="Select priority"></app-sf-select>
            </app-sf-field>
            <app-sf-field label="Estimated Cost" hint="Optional" [control]="projectForm.controls.estimatedCost">
                <app-sf-currency formControlName="estimatedCost" placeholder="0.00"></app-sf-currency>
            </app-sf-field>
        </app-sf-section>

        <app-sf-section title="Assignment" columns="2">
            <app-sf-field full label="Assign Engineer" [control]="projectForm.controls.engineerId">
                <app-sf-combobox formControlName="engineerId" [options]="engineerOptions" placeholder="Select engineer"></app-sf-combobox>
            </app-sf-field>
            <app-sf-field full label="Scope / Notes" hint="Optional" [control]="projectForm.controls.comment">
                <app-sf-textarea formControlName="comment" [rows]="5" placeholder="Scope, site details or instructions for the engineer"></app-sf-textarea>
            </app-sf-field>
        </app-sf-section>
    </form>

    <ng-container sfDrawerFooter>
        <app-action-button variant="secondary" [disabled]="saving" (click)="cancel()">Cancel</app-action-button>
        <app-action-button variant="primary" type="submit" form="project-form" [disabled]="saving">
            {{ saving ? 'Creating…' : 'Create Project' }}
        </app-action-button>
    </ng-container>
</app-sf-drawer>
