<div class="h-full flex flex-col p-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <div *ngIf="loadError" role="alert"
    class="mb-3 flex shrink-0 flex-wrap items-center justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300">
    <span>{{ loadError }}</span>
    <button type="button" class="font-medium underline hover:no-underline" (click)="reload()">Try again</button>
  </div>

  <app-data-grid #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="All Projects"
    subtitle="New jobs, pending projects, AMC and material requests in one place"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [serverSide]="true"
    [exportable]="true"
    [exportFetch]="exportFetch"
        [fullFilters]="true"
    [totalCount]="total"
    [data]="rows"
    [columns]="columns"
    [loading]="isLoading"
    [pageSize]="row"
    searchPlaceholder="Search job ID, customer or engineer"
    [emptyMessage]="emptyMessage"
    [createLabel]="createLabel"
    [rowActions]="rowActions"
    [views]="views"
    [detailTabs]="detailTabs"
    [detailTitle]="detailTitle"
    [detailSubtitle]="detailSubtitle"
    (create)="addProject()"
    (viewChange)="onViewChange($event)"
    (queryChange)="onQueryChange($event)"
    (rowAction)="onRowAction($event)">

    <ng-template #detailMetaTemplate let-row>
      <app-detail-meta [items]="metaFor(row)"></app-detail-meta>
    </ng-template>

    <ng-template #detailTemplate let-row let-tab="tab">
      <app-detail-overview *ngIf="tab === 'overview'" [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
      <app-detail-timeline *ngIf="tab === 'history'" [entries]="(historyFor(row) | async) ?? []"
        emptyMessage="No project history yet."></app-detail-timeline>
    </ng-template>
  </app-data-grid>

  <app-material-request-drawer [open]="mrOpen" [projectId]="mrProjectId" (saved)="onMaterialRequestSaved()" (closed)="mrOpen = false"></app-material-request-drawer>

  <app-create-project class="contents" [open]="createOpen" [projectId]="editProjectId" (saved)="onProjectCreated()" (closed)="onProjectDrawerClosed()"></app-create-project>
</div>
