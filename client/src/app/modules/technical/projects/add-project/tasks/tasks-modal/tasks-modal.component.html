<app-modal-layout
  [title]="isEditMode() ? 'Edit Task' : 'Create Task'"
  [onClose]="onCancel.bind(this)"
  [footerButtons]="[
    { label: 'Cancel', onClick: onCancel.bind(this), theme: 'cancel' },
    { label: isEditMode() ? 'Update' : 'Create', onClick: onSubmit.bind(this), theme: 'primary', loading: isSaving(), type: 'submit' }
  ]"
  contentClass="p-6">
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
            <label class="block mb-1 font-medium">Task Name</label>
            <input formControlName="taskName" type="text" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Description</label>
            <textarea formControlName="description" rows="3" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div class="mb-4 flex gap-4">
            <div class="w-1/2">
                <label class="block mb-1 font-medium">Status</label>
                <select formControlName="status" class="w-full border rounded px-3 py-2">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="w-1/2">
                <label class="block mb-1 font-medium">Priority</label>
                <select formControlName="priority" class="w-full border rounded px-3 py-2">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>
        <div class="mb-4 grid grid-cols-3 gap-4" [formGroup]="timelineGroup">
            <div>
                <label class="block mb-1 font-medium">Expected Start Date</label>
                <input formControlName="expectedStartDate" type="date" class="w-full border rounded px-3 py-2" />
            </div>
            <div>
                <label class="block mb-1 font-medium">Expected End Date</label>
                <input formControlName="expectedEndDate" type="date" class="w-full border rounded px-3 py-2" />
            </div>
            <div>
                <label class="block mb-1 font-medium">Expected Duration (days)</label>
                <input formControlName="expectedDuration" type="number" class="w-full border rounded px-3 py-2" />
            </div>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Progress</label>
            <input type="range" min="0" max="100" formControlName="progress" class="w-full" />
            <div class="text-right text-sm text-gray-600">{{ taskForm.get('progress')?.value }}%</div>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Notes</label>
            <textarea formControlName="notes" rows="3" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div class="mb-4">
            <label class="block mb-1 font-medium">Associated Team</label>
            <table class="w-full border rounded mb-2">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="p-2">Sl No</th>
                        <th class="p-2">Select Employee</th>
                        <th class="p-2">Designation</th>
                        <th class="p-2">Actions</th>
                    </tr>
                </thead>
                <tbody formArrayName="associatedTeam">
                    <tr *ngFor="let member of associatedTeamArray.controls; let i = index" [formGroupName]="i">
                        <td class="p-2 text-center">{{ i + 1 }}</td>
                        <td class="p-2">
                            <select formControlName="employee" class="w-full border rounded px-2 py-1">
                                <option value="">Select</option>
                                <option *ngFor="let emp of employees()" [value]="emp._id">{{ emp.firstName }} {{ emp.lastName }}</option>
                            </select>
                        </td>
                        <td class="p-2">
                            {{ getEmployeeDesignation(member.get('employee')?.value) }}
                        </td>
                        <td class="p-2 text-center">
                            <button type="button" (click)="removeTeamMember(i)"
                                [disabled]="associatedTeamArray.length === 1" class="text-red-600">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <button type="button" (click)="addTeamMember()" class="bg-violet-600 text-white px-3 py-1 rounded">+ Add
                Team Member</button>
        </div>
    </form>
</app-modal-layout>
