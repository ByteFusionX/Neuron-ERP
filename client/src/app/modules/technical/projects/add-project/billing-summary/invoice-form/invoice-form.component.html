<div class="bg-white w-full max-w-4xl max-h-[95vh] min-w-[500px]">
  <!-- Modal Header -->
  <div class="px-6 py-4 border-b border-gray-200">
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-semibold text-gray-900">
        {{ billingId() ? 'Edit Invoice Plan' : 'Add Invoice Plan' }}
      </h3>
      <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors duration-200"
        (click)="closeModal()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modal Body -->
  <form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()" class="px-6 py-4">

    <!-- Invoiced Amount -->
    <div class="mb-4">
      <app-form-field label="Invoiced Amount" type="number" placeholder="Enter amount" [control]="f['invoicedAmount']"
        [isSubmitted]="isSubmitted()">
      </app-form-field>

      <div class="-mt-3">
        <!-- Real-time balance validation error -->
        <div *ngIf="getBalanceError() && (f['invoicedAmount'].dirty || f['invoicedAmount'].touched)"
          class="text-sm text-red-600 flex items-center gap-1">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"></path>
          </svg>
          {{ getBalanceError() }}
        </div>

        <!-- Available balance info -->
        <div class=" text-sm text-gray-500">
          Available balance: {{ getAvailableBalance() | number:'1.2-2' }} QAR
        </div>
      </div>
    </div>

    <!-- Invoiced Against -->
    <div class="mb-4">
      <app-form-field label="Invoiced Against" type="text" placeholder="e.g., Advance, Against Delivery"
        [control]="f['invoicedAgainst']" [isSubmitted]="isSubmitted()">
      </app-form-field>
    </div>

    <!-- Invoiced Date -->
    <div class="mb-6">
      <app-form-field label="Invoiced Date" type="date" [control]="f['invoicedDate']" [isSubmitted]="isSubmitted()">
      </app-form-field>
    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
      <app-btn theme="cancel" type="button" (buttonClick)="closeModal()">
        Cancel
      </app-btn>

      <app-btn theme="primary" type="submit" [loading]="isSubmitting()" [disabled]="invoiceForm.invalid">
        {{ billingId() ? 'Update' : 'Add' }} Invoice Plan
      </app-btn>
    </div>
  </form>
</div>
