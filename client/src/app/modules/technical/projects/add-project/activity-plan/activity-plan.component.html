<button class="bg-violet-600 text-white px-4 py-2 rounded mb-4" (click)="openModal()">Add Activity Plan</button>

<data-table
  [data]="activityPlans"
  [columns]="columns"
  [title]="'Activity Plan'"
  [isLoading]="false"
  [isEmpty]="activityPlans.length === 0"
  [enableColumnCustomization]="true"
  [defaultColumns]="defaultColumns"
  tableId="activity-plan-table"
></data-table>

<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-8 relative">
    <h2 class="text-xl font-semibold mb-4">Add Activity Plan</h2>
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block mb-1 font-medium">Activity Name</label>
        <input formControlName="activityName" type="text" class="w-full border rounded px-3 py-2" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Expected Start Date</label>
        <input formControlName="expectedStartDate" type="date" class="w-full border rounded px-3 py-2" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Expected End Date</label>
        <input formControlName="expectedEndDate" type="date" class="w-full border rounded px-3 py-2" />
      </div>
      <div class="mb-4">
        <app-select-dropdown
          label="Activity Performed Person(s)"
          [options]="engineers"
          [multiple]="true"
          [isSubmitted]="isSubmitted"
          formControlName="personNames"
          optionLabel="name"
          optionValue="id"
        ></app-select-dropdown>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Status</label>
        <select formControlName="status" class="w-full border rounded px-3 py-2" (change)="onStatusChange()">
          <option value="Open">Open</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
      <div *ngIf="addForm.get('status')?.value === 'Closed'">
        <div class="mb-4">
          <label class="block mb-1 font-medium">Actual Start Date</label>
          <input formControlName="actualStartDate" type="date" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Actual End Date</label>
          <input formControlName="actualEndDate" type="date" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="mb-4">
          <app-select-dropdown
            label="Reason"
            [options]="reasonOptions"
            [isSubmitted]="isSubmitted"
            formControlName="reason"
            optionLabel="name"
            optionValue="id"
          ></app-select-dropdown>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button type="button" class="px-4 py-2 rounded border" (click)="closeModal()">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded bg-violet-600 text-white">Save</button>
      </div>
    </form>
  </div>
</div>
