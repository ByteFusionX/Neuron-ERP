<app-sf-drawer *ngIf="drawerMode; else pageMode" [open]="open" [width]="step === 2 ? '1180px' : '860px'"
  [title]="isEditMode ? 'Edit Delivery Note' : 'Create Delivery Note'"
  [subtitle]="dnForm.get('dnNo')?.value || 'New DN'" (closed)="onDrawerClosed()">
  <ng-container *ngTemplateOutlet="dnBody"></ng-container>
  <ng-container sfDrawerFooter>
    <ng-container *ngTemplateOutlet="dnActions"></ng-container>
  </ng-container>
</app-sf-drawer>

<ng-template #pageMode>
<div class="flex h-full flex-col bg-gray-50 p-6 dark:bg-erp-surface-dark-alt">
  <div class="min-h-0 flex-1 rounded-lg border border-gray-200 bg-white shadow-sm dark:border-erp-border-dark dark:bg-erp-surface-dark">
    <div class="flex h-full flex-col">
      <header class="flex flex-wrap items-start justify-between gap-4 border-b border-gray-200 px-6 py-4 dark:border-erp-border-dark">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">Delivery Note</p>
          <h1 class="mt-1 text-lg font-semibold text-gray-900 dark:text-gray-100">{{ isEditMode ? 'Edit Delivery Note' : 'Create Delivery Note' }}</h1>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ dnForm.get('dnNo')?.value || 'New DN' }}</p>
        </div>
      </header>

      <main class="min-h-0 flex-1 overflow-auto px-6 py-5">
        <ng-container *ngTemplateOutlet="dnBody"></ng-container>
      </main>

      <footer class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 bg-gray-50 px-6 py-4 dark:border-erp-border-dark dark:bg-white/[0.02]">
        <app-action-button variant="secondary" (click)="onCancel()">
          <ng-icon name="heroArrowLeft" class="h-4 w-4"></ng-icon> Back
        </app-action-button>
        <div class="flex flex-wrap items-center gap-2">
          <ng-container *ngTemplateOutlet="dnActions"></ng-container>
        </div>
      </footer>
    </div>
  </div>
</div>
</ng-template>

<ng-template #dnActions>
  <span *ngIf="stepAttempted && !isDetailsValid()" class="mr-auto text-xs text-red-600 dark:text-red-400">Fix the highlighted fields</span>
  <app-action-button *ngIf="step === 1" variant="secondary" (click)="onCancel()">Cancel</app-action-button>
  <app-action-button *ngIf="step === 2" variant="secondary" (click)="goToStep(1)">Back</app-action-button>
  <app-action-button *ngIf="step === 1" variant="primary" (click)="goToStep(2)">Next: Items</app-action-button>
  <ng-container *ngIf="step === 2">
    <app-action-button variant="primary" [disabled]="isAllDelivered() || isSubmitting()" (click)="onPostDn()">{{ isSubmitting() ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Deliver Order') }}</app-action-button>
  </ng-container>
</ng-template>

<ng-template #dnBody>
  <!-- Stepper -->
  <app-sf-stepper [labels]="stepLabels" [current]="step" [isComplete]="stepDone" (stepClick)="goToStep($any($event))"></app-sf-stepper>
  <ng-container *ngTemplateOutlet="bodyContent"></ng-container>
</ng-template>

<ng-template #bodyContent>
<form [formGroup]="dnForm" class="space-y-5">
      <ng-container *ngIf="step === 1">
        <app-sf-section title="Source" columns="3">
          <app-sf-field label="Job ID" [control]="dnForm.get('jobId')">
            <app-sf-select formControlName="jobId" [options]="jobOptions" placeholder="Choose from the list"></app-sf-select>
          </app-sf-field>
          <app-sf-field label="Client Name" [control]="dnForm.get('clientName')">
            <app-sf-input formControlName="clientName" readonly></app-sf-input>
          </app-sf-field>
          <app-sf-field label="Customer LPO Number" [control]="dnForm.get('customerLpoNumber')">
            <app-sf-input formControlName="customerLpoNumber" placeholder="Customer PO / LPO"></app-sf-input>
          </app-sf-field>
          <app-sf-field label="DN No" [control]="dnForm.get('dnNo')">
            <app-sf-input formControlName="dnNo" readonly></app-sf-input>
          </app-sf-field>
          <app-sf-field label="DN Date" [control]="dnForm.get('dnDate')">
            <app-sf-date formControlName="dnDate" displayFormat="dd/MM/yy"></app-sf-date>
          </app-sf-field>
          <app-sf-field label="Subject" [control]="dnForm.get('subject')">
            <app-sf-input formControlName="subject" placeholder="Delivery subject"></app-sf-input>
          </app-sf-field>
        </app-sf-section>

        <app-sf-section title="Delivery Details" columns="3">
          <app-sf-field label="Delivery Type" [control]="dnForm.get('deliveryType')">
            <app-sf-combobox formControlName="deliveryType" [options]="deliveryTypeOptions" placeholder="Select delivery type"
              emptyText="No delivery types found"></app-sf-combobox>
          </app-sf-field>
          <app-sf-field label="Contact No" [control]="dnForm.get('contactNo')">
            <app-sf-input formControlName="contactNo" placeholder="Receiver contact"></app-sf-input>
          </app-sf-field>
          <app-sf-field label="Ship To" [control]="dnForm.get('shipToName')">
            <app-sf-input formControlName="shipToName" placeholder="Site / pickup / customer"></app-sf-input>
          </app-sf-field>
          <app-sf-field label="Contact Person" [control]="dnForm.get('contactPerson')">
            <app-sf-input formControlName="contactPerson" placeholder="Receiver name"></app-sf-input>
          </app-sf-field>
          <app-sf-field label="Payment Terms" optional [control]="dnForm.get('paymentTerms')">
            <app-sf-input formControlName="paymentTerms" placeholder="From the job's quotation"></app-sf-input>
          </app-sf-field>
          <app-sf-field full label="Ship-to Address" [control]="dnForm.get('shipToAddress')">
            <app-sf-textarea formControlName="shipToAddress" [rows]="2" placeholder="Delivery site address"></app-sf-textarea>
          </app-sf-field>
          <app-sf-field full label="Delivery Instructions" optional [control]="dnForm.get('deliveryInstructions')">
            <app-sf-textarea formControlName="deliveryInstructions" [rows]="2" placeholder="Gate pass, timing, pickup release note, drop-ship remarks"></app-sf-textarea>
          </app-sf-field>
        </app-sf-section>

      </ng-container>

      <!-- Step 2: what goes on this DN. Balance stays available for a later DN. -->
      <app-dn-item-entry *ngIf="step === 2" [items]="items" [isSelected]="isSelectedFn"
        [title]="selectedJob?.jobId ? 'Job ' + selectedJob.jobId : 'Items to deliver'"
        (toggle)="toggleItemSelection($event)"></app-dn-item-entry>
</form>
</ng-template>
