<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Pending Deliveries"
    subtitle="Items still waiting for delivery from approved jobs"
    [breadcrumbs]="breadcrumbs"
    rowKey="slNo"
    [serverSide]="true"
    [totalCount]="totalItems()"
    [data]="tableData()"
    [columns]="tableColumns"
    [loading]="isLoading()"
    [pageSize]="paginationService.paginationState().row"
    searchPlaceholder="Search customer"
    emptyMessage="No pending deliveries found"
    storageKey="dispatch-pending-delivery"
    exportable
    exportFileName="pending-delivery-report.xlsx"
    (queryChange)="onQueryChange($event)">
  </app-data-grid>

  <div *ngIf="canSwitchDispatchView()" class="flex flex-wrap items-center gap-2">
    <app-action-button variant="secondary" routerLink="/dispatch">Delivery note register</app-action-button>
  </div>
</div>
