<div class="h-full flex flex-col pt-5">
  <div class="bg-white shadow-sm mx-5 p-5">
    <div class="flex items-center justify-between gap-4 flex-wrap">
      <div class="flex-grow max-w-sm">
        <label class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
        <ng-select [items]="reportOptions" bindLabel="label" bindValue="value" placeholder="Select Report Type"
          [ngModel]="selectedReport()" (ngModelChange)="selectedReport.set($event)" [clearable]="false"
          class="custom-ng-select">
        </ng-select>
      </div>

      <div class="flex-grow max-w-xs">
        <label class="block text-sm font-medium text-gray-700 mb-1">From Date</label>
        <input type="date" [ngModel]="fromDate()" (ngModelChange)="fromDate.set($event)"
          class="w-full px-3 py-2 border border-accent rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm">
      </div>

      <div class="flex-grow max-w-xs">
        <label class="block text-sm font-medium text-gray-700 mb-1">To Date</label>
        <input type="date" [ngModel]="toDate()" (ngModelChange)="toDate.set($event)"
          class="w-full px-3 py-2 border border-accent rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm">
      </div>

      <div class="flex flex-col justify-end mt-4 md:mt-0">
        <label class="hidden md:block text-sm font-medium text-transparent mb-1">Generate</label>
        <app-btn type="button" theme="primary" (click)="generateReport()">
          Generate
        </app-btn>
      </div>
    </div>
  </div>

  <div class="flex-grow relative">
    <ng-container *ngIf="activeReport() === 'pending-delivery'">
      <app-pending-delivery [globalDateRange]="activeDateRange()"></app-pending-delivery>
    </ng-container>

    <ng-container *ngIf="activeReport() === 'invoice-linking'">
      <app-invoice-linking [globalDateRange]="activeDateRange()"></app-invoice-linking>
    </ng-container>

    <ng-container *ngIf="activeReport() === 'inventory-deduction'">
      <app-inventory-deduction [globalDateRange]="activeDateRange()"></app-inventory-deduction>
    </ng-container>

    <div *ngIf="!activeReport()"
      class="flex flex-col items-center justify-center h-64 bg-white shadow-sm mt-2 text-gray-500">
      <p class="text-lg">Please select a report type and click generate.</p>
    </div>
  </div>
</div>
