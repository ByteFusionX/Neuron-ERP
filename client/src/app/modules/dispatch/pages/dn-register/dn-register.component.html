<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <app-data-grid #grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Delivery Notes"
    subtitle="Prepare, dispatch, and close customer deliveries"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [serverSide]="true"
    [totalCount]="totalItems()"
    [data]="tableData()"
    [columns]="tableColumns"
    [loading]="isLoading()"
    [pageSize]="paginationService.paginationState().row"
    searchPlaceholder="Search by DN number"
    emptyMessage="No delivery notes found"
    [createLabel]="canCreateDn() ? 'Create DN' : ''"
    [rowActions]="rowActions"
    [views]="views"
    storageKey="dispatch-dn-register"
    exportable
    exportFileName="delivery-notes.xlsx"
    [detailTitle]="dnTitle"
    [detailSubtitle]="dnSubtitle"
    (queryChange)="onQueryChange($event)"
    (rowOpen)="onRowClick($event)"
    (rowAction)="onRowAction($event)"
    (create)="openCreateDrawer()">

    <ng-template #detailAsideTemplate let-row>
      <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset"
        [ngClass]="{
          'bg-gray-100 text-gray-700 ring-gray-200': row.status === 'Draft',
          'bg-sky-50 text-sky-700 ring-sky-200': row.status === 'Ready for Dispatch' || row.status === 'Dispatched',
          'bg-emerald-50 text-emerald-700 ring-emerald-200': row.status === 'Delivered',
          'bg-red-50 text-red-700 ring-red-200': row.status === 'Cancelled' || row.status === 'Rejected',
          'bg-amber-50 text-amber-700 ring-amber-200': row.status === 'Partially Rejected'
        }">{{ row.status }}</span>
    </ng-template>

    <ng-template #detailMetaTemplate let-row>
      <div class="qt-meta">
        <p class="qt-meta-label">Customer</p>
        <p class="qt-meta-value">{{ row.clientName }}</p>
      </div>
      <div class="qt-meta">
        <p class="qt-meta-label">Job</p>
        <p class="qt-meta-value">{{ row.job?.jobId || '-' }}</p>
      </div>
      <div class="qt-meta">
        <p class="qt-meta-label">Type</p>
        <p class="qt-meta-value">{{ row.deliveryType || 'Customer Delivery' }}</p>
      </div>
      <div class="qt-meta">
        <p class="qt-meta-label">Date</p>
        <p class="qt-meta-value">{{ row.dnDate | date: 'dd MMM yyyy' }}</p>
      </div>
    </ng-template>

    <!-- right: permanent, every tab (filled) -->
    <ng-template #detailFooterTemplate let-row>
      <app-action-button *ngIf="row.status === 'Draft'" variant="primary" (click)="openCreateDrawer(row._id)" icon="edit">Edit draft</app-action-button>
      <app-action-button variant="primary" (click)="viewDnDetails(row)" icon="view">Open full DN</app-action-button>
    </ng-template>
  </app-data-grid>

  <div *ngIf="canSwitchDispatchView()" class="flex flex-wrap items-center gap-2">
    <app-action-button *ngIf="canViewPendingDelivery()" variant="secondary" routerLink="/dispatch/pending-delivery-reports">Pending delivery</app-action-button>
    <app-action-button *ngIf="canViewInvoiceLinking()" variant="secondary" routerLink="/dispatch/invoice-linking-report">Invoice linking</app-action-button>
    <app-action-button *ngIf="canViewInventoryDeduction()" variant="secondary" routerLink="/dispatch/inventory-deduction-report">Inventory deduction</app-action-button>
  </div>

  <app-create-dn [drawerMode]="true" [open]="formOpen" [editId]="formEditId"
    (saved)="onCreateSaved()" (closed)="closeCreateDrawer()"></app-create-dn>
</div>
