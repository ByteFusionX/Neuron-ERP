<div class="relative w-full max-w-4xl mx-auto bg-white rounded-lg shadow-lg">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b rounded-t">
        <h3 class="text-xl font-semibold text-gray-900">
            Customer Delivery Report <span *ngIf="customerName">- {{customerName}}</span>
        </h3>
        <button type="button" (click)="onClose()"
            class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
            <ng-icon name="heroXMark" class="text-lg"></ng-icon>
        </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
        
        <div *ngIf="isLoading" class="flex justify-center py-10">
            <app-skelton-loading [lineLength]="5"></app-skelton-loading>
        </div>

        <div *ngIf="!isLoading && deliveryNotes.length === 0" class="text-center py-10 text-gray-500">
            No delivery notes found for this Customer.
        </div>

        <div *ngIf="!isLoading && deliveryNotes.length > 0" class="relative overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500 border">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 border">DN No</th>
                        <th scope="col" class="px-6 py-3 border">Date</th>
                        <th scope="col" class="px-6 py-3 border">Job ID</th>
                         <th scope="col" class="px-6 py-3 border">Subject</th>
                        <th scope="col" class="px-6 py-3 border text-center">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let dn of deliveryNotes" class="bg-white border-b hover:bg-gray-50">
                        <td class="px-6 py-4 border font-medium text-purple-600">
                            {{dn.dnNo}}
                        </td>
                        <td class="px-6 py-4 border">
                            {{dn.dnDate | date:'dd/MM/yyyy'}}
                        </td>
                        <td class="px-6 py-4 border">
                             {{dn.job?.jobId || 'N/A'}}
                        </td>
                         <td class="px-6 py-4 border">
                             {{dn.subject || '-'}}
                        </td>
                        <td class="px-6 py-4 border text-center">
                            <span *ngIf="dn.status === 'Generated'" class="bg-blue-100 text-blue-600 text-xs font-medium px-2.5 py-0.5 rounded">Generated</span>
                             <span *ngIf="dn.status === 'Delivered'" class="bg-green-100 text-green-600 text-xs font-medium px-2.5 py-0.5 rounded">Delivered</span>
                             <span *ngIf="dn.status === 'Partially Delivered'" class="bg-yellow-100 text-yellow-600 text-xs font-medium px-2.5 py-0.5 rounded">Partial</span>
                             <span *ngIf="dn.status === 'Cancelled'" class="bg-red-100 text-red-600 text-xs font-medium px-2.5 py-0.5 rounded">Cancelled</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
