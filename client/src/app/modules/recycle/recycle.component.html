<div class="h-full flex flex-col p-6 bg-gray-50 dark:bg-erp-surface-dark-alt">
  <div *ngIf="loadError" role="alert"
    class="mb-3 flex shrink-0 flex-wrap items-center justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300">
    <span>{{ loadError }}</span>
    <button type="button" class="font-medium underline hover:no-underline" (click)="loadTrash()">Try again</button>
  </div>

  <app-data-grid
    class="flex-1 min-h-0"
    [fillHeight]="true"
    title="Recycle Bin"
    subtitle="Review and restore records deleted within the retention period"
    [breadcrumbs]="breadcrumbs"
    rowKey="_id"
    [data]="trash"
    [columns]="columns"
    [loading]="isLoading"
    searchPlaceholder="Search deleted records"
    emptyMessage="No deleted records found"
    [selectable]="false"
    [showDetailPanel]="false"
    [rowActions]="rowActions"
    storageKey="recycle-bin"
    exportable
    exportFileName="recycle-bin.xlsx"
    (rowAction)="onRowAction($event)">
  </app-data-grid>
</div>
