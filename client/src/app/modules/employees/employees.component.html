<div class="h-full flex flex-col p-6 gap-5 bg-gray-50 dark:bg-erp-surface-dark-alt">
    <app-data-grid #grid
        class="flex-1 min-h-0"
        [fillHeight]="true"
        title="Employees"
        [breadcrumbs]="breadcrumbs"
        rowKey="_id"
        [serverSide]="true"
        [totalCount]="total"
        [data]="rows"
        [columns]="columns"
        [loading]="isLoading"
        [pageSize]="row"
        searchPlaceholder="Search by name or employee ID"
        emptyMessage="No employees found"
        [createLabel]="createEmployee ? 'Create Employee' : ''"
        [rowActions]="rowActions"
        [views]="views"
        (viewChange)="onViewChange($event)"
        storageKey="employee-list"
        [density]="density"
        [rowAccent]="rowAccent"
        exportable
        exportFileName="employees.xlsx"
        [detailLoading]="detailLoading"
        [detailTabs]="detailTabs"
        [detailTitle]="employeeTitle"
        [detailSubtitle]="employeeSubtitle"
        (queryChange)="onQueryChange($event)"
        (rowOpen)="onRowOpen()"
        (rowAction)="onRowAction($event)"
        (create)="openCreateDrawer()">

        <ng-template #detailMetaTemplate let-row>
            <div class="qt-meta">
                <p class="qt-meta-label">Department</p>
                <p class="qt-meta-value">{{ row.department?.departmentName || '—' }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Designation</p>
                <p class="qt-meta-value">{{ row.designation || '—' }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Reports to</p>
                <p class="qt-meta-value">{{ fullName(row.reportingTo) || 'No one' }}</p>
            </div>
            <div class="qt-meta">
                <p class="qt-meta-label">Joined</p>
                <p class="qt-meta-value">{{ row.dateOfJoining | date: 'dd MMM yyyy' }}</p>
            </div>
        </ng-template>

        <ng-template #detailFooterTemplate let-row>
            <app-action-button *ngIf="canEdit && row._id !== currentUserId" variant="secondary" (click)="openEditDrawer(row)">Edit</app-action-button>
            <app-action-button variant="primary" (click)="openProfile(row)">Open full profile</app-action-button>
        </ng-template>

        <ng-template #detailTemplate let-row let-tab="tab">
            <ng-container [ngSwitch]="tab">
                <ng-container *ngSwitchCase="'overview'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="overviewSections(row)"></app-detail-overview>
                </ng-container>
                <ng-container *ngSwitchCase="'contract'">
                    <app-detail-overview [grid]="grid" [row]="row" [sections]="contractSections(row)"></app-detail-overview>
                </ng-container>
                <ng-container *ngSwitchCase="'history'">
                    <app-detail-timeline [entries]="historyEntries(row)" emptyMessage="No promotions or transfers recorded yet."></app-detail-timeline>
                </ng-container>
            </ng-container>
        </ng-template>
    </app-data-grid>

    <app-employee-form-drawer [open]="formOpen" [mode]="formMode" [employee]="formEmployee"
        (saved)="getEmployees()" (closed)="formOpen = false"></app-employee-form-drawer>
</div>
