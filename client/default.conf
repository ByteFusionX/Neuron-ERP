server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # PDF viewer (ngx-extended-pdf-viewer) loads .mjs modules; browsers reject them unless served as JavaScript
    # a types block replaces the inherited map, so re-include the defaults first
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Service worker must be a real JS file (404 if missing, never the index.html fallback) and never cached stale
    location = /sw-push.js {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
